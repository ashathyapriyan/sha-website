answer:`<p><strong>Streams</strong> process data in chunks instead of loading everything into memory — efficient for large files and network data.</p>
<ul><li>Types: Readable, Writable, Duplex, Transform.</li><li><code>pipe()</code> connects streams.</li></ul>`,
code:`const fs = require('fs');\nconst read = fs.createReadStream('big.txt');\nconst write = fs.createWriteStream('copy.txt');\nread.pipe(write); // stream chunks efficiently`},
{id:120,category:"Node.js",question:"The Buffer in Node?",lang:"js",
answer:`<p>A <strong>Buffer</strong> is a fixed-size chunk of raw binary memory outside V8's heap. It handles binary data like files, TCP streams, and images that strings can't represent well.</p>`,
code:`const buf = Buffer.from('Hello');\nconsole.log(buf);            // <Buffer 48 65 6c 6c 6f>\nconsole.log(buf.toString()); // Hello\nconsole.log(buf.length);     // 5`},
{id:121,category:"Node.js",question:"process object in Node?",lang:"js",
answer:`<p>The global <strong>process</strong> object provides info about and control over the current Node process.</p>
<ul><li><code>process.argv</code> – CLI arguments.</li><li><code>process.env</code> – environment variables.</li><li><code>process.exit()</code> – end the process.</li></ul>`,
code:`// console.log(process.argv);       // command-line args\n// console.log(process.env.NODE_ENV);\n// console.log(process.platform);\nconsole.log("process gives runtime info & control");`},
{id:122,category:"Node.js",question:"Environment variables?",lang:"js",
answer:`<p><strong>Environment variables</strong> store config (API keys, DB URLs, ports) outside the code, keeping secrets safe and enabling per-environment settings.</p>
<p>Accessed via <code>process.env</code>; often loaded from a <code>.env</code> file with the <code>dotenv</code> package.</p>`,
code:`require('dotenv').config();\nconst PORT = process.env.PORT || 3000;\nconst DB = process.env.DATABASE_URL;\nconsole.log("Running on port", PORT);`},
{id:123,category:"Node.js",question:"Error handling in Node?",lang:"js",
answer:`<p>Common patterns:</p>
<ul><li><strong>try/catch</strong> for sync & async/await.</li><li><strong>Error-first callbacks</strong> – <code>(err, data) => {}</code>.</li><li><code>.catch()</code> on Promises.</li><li>Global handlers for <code>uncaughtException</code> / <code>unhandledRejection</code>.</li></ul>`,
code:`async function load() {\n  try {\n    const data = await fetchData();\n    return data;\n  } catch (err) {\n    console.error("Failed:", err.message);\n  }\n}`},
{id:124,category:"Node.js",question:"What is a REST API in Node?",lang:"js",
answer:`<p>A <strong>REST API</strong> exposes resources over HTTP using standard verbs. In Express you map verbs + routes to handlers.</p>
<ul><li>GET – read, POST – create, PUT/PATCH – update, DELETE – remove.</li><li>Returns JSON with appropriate status codes.</li></ul>`,
code:`app.get('/users', (req,res) => res.json(users));\napp.post('/users', (req,res) => {\n  users.push(req.body);\n  res.status(201).json(req.body);\n});\napp.delete('/users/:id', (req,res) => res.sendStatus(204));`},
{id:125,category:"Node.js",question:"What is the cluster module?",lang:"js",
answer:`<p>Node is single-threaded, so the <strong>cluster module</strong> forks multiple worker processes that share the same server port, using all CPU cores for better throughput.</p>`,
code:`const cluster = require('cluster');\nconst os = require('os');\nif (cluster.isPrimary) {\n  os.cpus().forEach(() => cluster.fork());\n} else {\n  require('./server'); // each worker runs server\n}`},
{id:126,category:"Node.js",question:"package.json vs package-lock.json?",lang:"none",
answer:`<ul><li><strong>package.json</strong> – lists dependencies with version <em>ranges</em> (<code>^1.2.0</code>) plus scripts and metadata.</li><li><strong>package-lock.json</strong> – records the <em>exact</em> resolved versions of every dependency for reproducible installs.</li></ul>`,
code:`// package.json\n"dependencies": { "express": "^4.18.0" }\n\n// package-lock.json pins exact:\n// "express": { "version": "4.18.2" }`},
{id:127,category:"Node.js",question:"What is nodemon?",lang:"none",
answer:`<p><strong>nodemon</strong> is a development tool that automatically restarts your Node application whenever it detects file changes — no manual restarts needed.</p>`,
code:`# install\nnpm install --save-dev nodemon\n\n# run (auto-restarts on save)\nnpx nodemon server.js`},
{id:128,category:"Node.js",question:"What is CORS?",lang:"js",
answer:`<p><strong>CORS (Cross-Origin Resource Sharing)</strong> is a browser security mechanism controlling which origins can call your API. Servers send <code>Access-Control-Allow-Origin</code> headers to permit cross-origin requests.</p>`,
code:`const cors = require('cors');\napp.use(cors({ origin: 'https://sha.dev' }));\n// or allow all:\napp.use(cors());`},
{id:129,category:"Node.js",question:"What is JWT?",lang:"js",
answer:`<p><strong>JWT (JSON Web Token)</strong> is a compact, signed token for stateless authentication. It has three parts: <strong>header.payload.signature</strong>. The server verifies the signature without storing sessions.</p>`,
code:`const jwt = require('jsonwebtoken');\nconst token = jwt.sign({ id: 1 }, 'secret', { expiresIn: '1h' });\nconst decoded = jwt.verify(token, 'secret');\nconsole.log(decoded.id);`},
{id:130,category:"Node.js",question:"How to scale a Node app?",lang:"none",
answer:`<p>Strategies to scale Node apps:</p>
<ul><li><strong>Clustering / PM2</strong> – use all CPU cores.</li><li><strong>Load balancing</strong> – distribute traffic (Nginx).</li><li><strong>Caching</strong> – Redis for hot data.</li><li><strong>Horizontal scaling</strong> – more server instances.</li><li><strong>Async/non-blocking</strong> code & a message queue for heavy jobs.</li></ul>`,
code:`# Run with PM2 in cluster mode across all cores\npm2 start server.js -i max\n\n# Monitor\npm2 monit`},

{id:131,category:"Databases",question:"SQL vs NoSQL?",lang:"none",
answer:`<table><tr><th>SQL</th><th>NoSQL</th></tr>
<tr><td>Relational, tables/rows</td><td>Documents, key-value, graph</td></tr>
<tr><td>Fixed schema</td><td>Flexible schema</td></tr>
<tr><td>Vertical scaling</td><td>Horizontal scaling</td></tr>
<tr><td>ACID, joins</td><td>High write throughput</td></tr>
<tr><td>MySQL, PostgreSQL</td><td>MongoDB, Redis</td></tr></table>`,
code:`-- SQL\nSELECT * FROM users WHERE age > 18;\n\n// NoSQL (MongoDB)\ndb.users.find({ age: { $gt: 18 } });`},
{id:132,category:"Databases",question:"What is a primary key?",lang:"none",
answer:`<p>A <strong>primary key</strong> uniquely identifies each row in a table. It must be <strong>unique</strong> and <strong>not null</strong>, and there is only one per table. It's often auto-incremented.</p>`,
code:`CREATE TABLE users (\n  id INT PRIMARY KEY AUTO_INCREMENT,\n  name VARCHAR(50),\n  email VARCHAR(100) UNIQUE\n);`},
{id:133,category:"Databases",question:"What is a foreign key?",lang:"none",
answer:`<p>A <strong>foreign key</strong> is a column that references the primary key of another table, creating a relationship and enforcing <strong>referential integrity</strong>.</p>`,
code:`CREATE TABLE orders (\n  id INT PRIMARY KEY,\n  user_id INT,\n  FOREIGN KEY (user_id) REFERENCES users(id)\n);`},
{id:134,category:"Databases",question:"Database normalization?",lang:"none",
answer:`<p><strong>Normalization</strong> organises data to reduce redundancy and improve integrity by splitting data into related tables.</p>
<ul><li><strong>1NF</strong> – atomic values, no repeating groups.</li><li><strong>2NF</strong> – no partial dependency on a composite key.</li><li><strong>3NF</strong> – no transitive dependency.</li></ul>`,
code:`-- Split into customers + orders tables linked by id\nSELECT o.id, c.name\nFROM orders o JOIN customers c ON o.cust_id = c.id;`},
{id:135,category:"Databases",question:"SQL JOINs?",lang:"none",
answer:`<ul><li><strong>INNER JOIN</strong> – rows matching in both tables.</li><li><strong>LEFT JOIN</strong> – all left rows + matches.</li><li><strong>RIGHT JOIN</strong> – all right rows + matches.</li><li><strong>FULL JOIN</strong> – all rows from both.</li></ul>`,
code:`SELECT users.name, orders.total\nFROM users\nINNER JOIN orders ON users.id = orders.user_id;\n\nSELECT users.name, orders.total\nFROM users\nLEFT JOIN orders ON users.id = orders.user_id;`},
{id:136,category:"Databases",question:"What is an index?",lang:"none",
answer:`<p>An <strong>index</strong> is a data structure (usually a B-tree) that speeds up reads by letting the database find rows without scanning the whole table.</p>
<p>Trade-off: faster reads but slower writes and extra storage.</p>`,
code:`CREATE INDEX idx_email ON users(email);\n\n-- now this query is much faster\nSELECT * FROM users WHERE email = 'a@b.com';`},
{id:137,category:"Databases",question:"ACID properties?",lang:"none",
answer:`<p><strong>ACID</strong> guarantees reliable transactions:</p>
<ul><li><strong>Atomicity</strong> – all or nothing.</li><li><strong>Consistency</strong> – valid state to valid state.</li><li><strong>Isolation</strong> – concurrent transactions don't interfere.</li><li><strong>Durability</strong> – committed data survives crashes.</li></ul>`,
code:`BEGIN TRANSACTION;\n  UPDATE accounts SET balance = balance - 100 WHERE id = 1;\n  UPDATE accounts SET balance = balance + 100 WHERE id = 2;\nCOMMIT; -- both succeed or both roll back`},
{id:138,category:"Databases",question:"What is a transaction?",lang:"none",
answer:`<p>A <strong>transaction</strong> is a sequence of operations treated as a single unit. It either fully completes (<code>COMMIT</code>) or fully undoes (<code>ROLLBACK</code>), preserving data integrity.</p>`,
code:`BEGIN;\nINSERT INTO orders VALUES (1, 500);\nUPDATE stock SET qty = qty - 1 WHERE id = 7;\n-- if anything fails:\nROLLBACK;\n-- else:\nCOMMIT;`},
{id:139,category:"Databases",question:"What is MongoDB?",lang:"js",
answer:`<p><strong>MongoDB</strong> is a popular NoSQL <strong>document database</strong>. It stores data as flexible, JSON-like <strong>BSON documents</strong> in collections, with no fixed schema.</p>`,
code:`// MongoDB documents\ndb.users.insertOne({\n  name: "Sha",\n  skills: ["JS", "React"],\n  age: 28\n});\ndb.users.find({ age: { $gte: 18 } });`},
{id:140,category:"Databases",question:"What is aggregation in MongoDB?",lang:"js",
answer:`<p><strong>Aggregation</strong> processes documents through a <strong>pipeline</strong> of stages to compute grouped/transformed results (like SQL GROUP BY).</p>
<p>Stages: <code>$match</code>, <code>$group</code>, <code>$sort</code>, <code>$project</code>.</p>`,
code:`db.orders.aggregate([\n  { $match: { status: "paid" } },\n  { $group: { _id: "$userId", total: { $sum: "$amount" } } },\n  { $sort: { total: -1 } }\n]);`},
{id:141,category:"Databases",question:"What is Redis?",lang:"none",
answer:`<p><strong>Redis</strong> is an in-memory key-value data store, extremely fast, used for <strong>caching</strong>, sessions, rate limiting, queues and real-time leaderboards.</p>
<p>Supports strings, lists, sets, hashes; can persist to disk.</p>`,
code:`SET user:1 "Sha"\nGET user:1\nEXPIRE user:1 3600   # auto-delete after 1 hour\nINCR page:views      # atomic counter`},
{id:142,category:"Databases",question:"What is connection pooling?",lang:"js",
answer:`<p><strong>Connection pooling</strong> reuses a set of open database connections instead of opening a new one per request. This reduces overhead and improves performance under load.</p>`,
code:`const pool = mysql.createPool({\n  host: 'localhost', user: 'root',\n  database: 'app', connectionLimit: 10\n});\npool.query('SELECT * FROM users', (e, rows) => {});`},
{id:143,category:"Databases",question:"What is SQL injection?",lang:"js",
answer:`<p><strong>SQL injection</strong> is an attack where malicious input is inserted into a query to manipulate the database. Prevent it with <strong>parameterised queries</strong> (prepared statements), never string concatenation.</p>`,
code:`// vulnerable\ndb.query("SELECT * FROM users WHERE id = " + userInput);\n\n// safe — parameterised\ndb.query("SELECT * FROM users WHERE id = ?", [userInput]);`},
{id:144,category:"Databases",question:"GROUP BY and HAVING?",lang:"none",
answer:`<ul><li><strong>GROUP BY</strong> – groups rows sharing a value, used with aggregate functions (COUNT, SUM, AVG).</li><li><strong>HAVING</strong> – filters groups (WHERE filters rows before grouping).</li></ul>`,
code:`SELECT country, COUNT(*) AS users\nFROM customers\nGROUP BY country\nHAVING COUNT(*) > 100\nORDER BY users DESC;`},
{id:145,category:"Databases",question:"DELETE vs TRUNCATE vs DROP?",lang:"none",
answer:`<ul><li><strong>DELETE</strong> – removes specific rows (with WHERE); can be rolled back; slower.</li><li><strong>TRUNCATE</strong> – removes all rows fast, resets identity, can't use WHERE.</li><li><strong>DROP</strong> – removes the entire table (structure + data).</li></ul>`,
code:`DELETE FROM users WHERE id = 5;  -- specific rows\nTRUNCATE TABLE logs;             -- empty table fast\nDROP TABLE temp;                 -- remove table entirely`},
{id:146,category:"Databases",question:"What is an ORM?",lang:"js",
answer:`<p>An <strong>ORM (Object-Relational Mapping)</strong> library lets you interact with the database using objects/methods instead of raw SQL. Examples: Sequelize, Prisma, TypeORM, Mongoose.</p>
<p>Benefits: cleaner code, less boilerplate, DB-agnostic. Trade-off: less control, possible performance overhead.</p>`,
code:`// Prisma ORM example\nconst users = await prisma.user.findMany({\n  where: { age: { gt: 18 } },\n  orderBy: { name: 'asc' }\n});`},
{id:147,category:"Databases",question:"What is sharding?",lang:"none",
answer:`<p><strong>Sharding</strong> splits a large database horizontally across multiple servers (shards), each holding a subset of the data. It enables horizontal scaling for huge datasets and high traffic.</p>`,
code:`// Conceptual: route by key range\n// Shard 1: user_id 1 - 1,000,000\n// Shard 2: user_id 1,000,001 - 2,000,000\n// Each shard is its own DB server`},
{id:148,category:"Databases",question:"What is replication?",lang:"none",
answer:`<p><strong>Replication</strong> copies data across multiple database servers. A <strong>primary</strong> handles writes and replicates to <strong>replicas</strong> that serve reads, improving availability, read scaling and failover.</p>`,
code:`// Primary  -> writes\n//   |  replicate\n//   v\n// Replica 1, Replica 2 -> reads (load balanced)`},
{id:149,category:"Databases",question:"What is caching?",lang:"js",
answer:`<p><strong>Caching</strong> stores frequently accessed data in fast storage (memory/Redis) so repeated requests don't hit the slower database. It reduces latency and load.</p>
<p>Strategies: cache-aside, write-through, TTL expiry; watch for cache invalidation.</p>`,
code:`async function getUser(id) {\n  let user = await redis.get('user:' + id);\n  if (!user) {\n    user = await db.findUser(id);\n    await redis.set('user:' + id, user, 'EX', 3600);\n  }\n  return user;\n}`},
{id:150,category:"Databases",question:"OLTP vs OLAP?",lang:"none",
answer:`<table><tr><th>OLTP</th><th>OLAP</th></tr>
<tr><td>Transaction processing</td><td>Analytical processing</td></tr>
<tr><td>Many small fast writes</td><td>Complex read queries</td></tr>
<tr><td>Current operational data</td><td>Historical/aggregated data</td></tr>
<tr><td>e.g. e-commerce orders</td><td>e.g. BI dashboards / warehouses</td></tr></table>`,
code:`-- OLTP: quick insert\nINSERT INTO orders VALUES (...);\n\n-- OLAP: heavy analytical query\nSELECT region, SUM(sales) FROM facts\nGROUP BY region, year;`},

{id:151,category:"Security",question:"What is XSS?",lang:"js",
answer:`<p><strong>XSS (Cross-Site Scripting)</strong> injects malicious scripts into web pages viewed by others, stealing cookies or hijacking sessions.</p>
<p>Prevent by <strong>escaping/sanitising</strong> output, using a Content-Security-Policy, and avoiding <code>innerHTML</code> with untrusted data.</p>`,
code:`// vulnerable\nel.innerHTML = userInput;\n\n// safe\nel.textContent = userInput;\n// or sanitize with DOMPurify\n// el.innerHTML = DOMPurify.sanitize(userInput);`},
{id:152,category:"Security",question:"What is CSRF?",lang:"none",
answer:`<p><strong>CSRF (Cross-Site Request Forgery)</strong> tricks a logged-in user's browser into sending unwanted authenticated requests.</p>
<p>Prevent with <strong>CSRF tokens</strong>, <code>SameSite</code> cookies, and checking the Origin/Referer.</p>`,
code:`<!-- Server issues a token, form echoes it back -->\n<form method="POST">\n  <input type="hidden" name="_csrf" value="TOKEN">\n</form>\n<!-- Cookie: Set-Cookie: sid=...; SameSite=Strict -->`},
{id:153,category:"Security",question:"HTTP vs HTTPS?",lang:"none",
answer:`<ul><li><strong>HTTP</strong> – plaintext, data can be intercepted.</li><li><strong>HTTPS</strong> – HTTP over <strong>TLS/SSL</strong>, encrypting traffic, verifying server identity and ensuring integrity. Required for security, trust, and SEO.</li></ul>`,
code:`// HTTP  -> http://site.com  (insecure)\n// HTTPS -> https://site.com (encrypted, padlock)\n// Get a free certificate via Let's Encrypt`},
{id:154,category:"Security",question:"What is hashing?",lang:"js",
answer:`<p><strong>Hashing</strong> converts data into a fixed-length irreversible string. Passwords must be hashed (not encrypted) with slow algorithms like <strong>bcrypt</strong> plus a <strong>salt</strong> to resist brute-force and rainbow tables.</p>`,
code:`const bcrypt = require('bcrypt');\nconst hash = await bcrypt.hash('myPassword', 10);\nconst ok   = await bcrypt.compare('myPassword', hash);\nconsole.log(ok); // true`},
{id:155,category:"Security",question:"Encryption vs hashing?",lang:"none",
answer:`<table><tr><th>Hashing</th><th>Encryption</th></tr>
<tr><td>One-way (irreversible)</td><td>Two-way (reversible with key)</td></tr>
<tr><td>For passwords/integrity</td><td>For confidential data transfer</td></tr>
<tr><td>bcrypt, SHA-256</td><td>AES, RSA</td></tr></table>`,
code:`// Hash (one-way): password -> hash (can't reverse)\n// Encrypt (two-way): data + key -> cipher -> data\n// Hash passwords, encrypt data at rest`},
{id:156,category:"Security",question:"Authentication vs authorization?",lang:"js",
answer:`<ul><li><strong>Authentication</strong> – verifying <em>who</em> you are (login, password, OTP).</li><li><strong>Authorization</strong> – verifying <em>what</em> you're allowed to do (roles, permissions).</li></ul>
<p>Authentication comes first, then authorization.</p>`,
code:`// 1. Authentication: verify identity\nif (!validUser(token)) return res.sendStatus(401);\n// 2. Authorization: check permission\nif (user.role !== 'admin') return res.sendStatus(403);`},
{id:157,category:"Security",question:"What is OAuth?",lang:"none",
answer:`<p><strong>OAuth 2.0</strong> is an authorization framework allowing apps to access a user's data on another service (Google, GitHub) without sharing passwords. The user grants a scoped <strong>access token</strong>.</p>`,
code:`// Flow:\n// 1. App redirects to provider login\n// 2. User consents\n// 3. Provider returns auth code\n// 4. App exchanges code for access token\n// 5. App calls API with the token`},
{id:158,category:"Security",question:"What are security headers?",lang:"js",
answer:`<p><strong>HTTP security headers</strong> harden apps against attacks:</p>
<ul><li><code>Content-Security-Policy</code> – restrict resource sources (anti-XSS).</li><li><code>X-Frame-Options</code> – prevent clickjacking.</li><li><code>Strict-Transport-Security</code> – force HTTPS.</li><li><code>X-Content-Type-Options: nosniff</code>.</li></ul>`,
code:`const helmet = require('helmet');\napp.use(helmet()); // sets secure headers automatically`},
{id:159,category:"Security",question:"What is rate limiting?",lang:"js",
answer:`<p><strong>Rate limiting</strong> caps how many requests a client can make in a time window. It protects against brute-force attacks, DDoS, and API abuse.</p>`,
code:`const rateLimit = require('express-rate-limit');\napp.use(rateLimit({\n  windowMs: 15 * 60 * 1000, // 15 min\n  max: 100                  // 100 requests/IP\n}));`},
{id:160,category:"Security",question:"What is the same-origin policy?",lang:"none",
answer:`<p>The <strong>same-origin policy</strong> is a browser rule that restricts how a document/script from one origin (protocol + host + port) can interact with resources from another origin — preventing malicious cross-site data access.</p>
<p>CORS relaxes it in a controlled way.</p>`,
code:`// Same origin: https://sha.dev/a  &  https://sha.dev/b\n// Different origin (blocked by default):\n//   https://sha.dev  vs  https://api.other.com`},
{id:161,category:"Security",question:"Man-in-the-middle attack?",lang:"none",
answer:`<p>A <strong>man-in-the-middle (MITM)</strong> attack intercepts communication between two parties to eavesdrop or alter data. Defences: <strong>HTTPS/TLS</strong>, certificate pinning, HSTS, and avoiding untrusted networks.</p>`,
code:`// Without TLS: attacker reads/modifies traffic\n// Client <---> [Attacker] <---> Server\n// With HTTPS: traffic is encrypted end-to-end`},
{id:162,category:"Security",question:"What is input validation?",lang:"js",
answer:`<p><strong>Input validation</strong> ensures user data is well-formed and safe before processing. Always validate on the <strong>server</strong> (client validation is for UX only) to prevent injection and bad data.</p>`,
code:`const { z } = require('zod');\nconst schema = z.object({\n  email: z.string().email(),\n  age: z.number().min(18)\n});\nschema.parse(req.body); // throws if invalid`},
{id:163,category:"Security",question:"What are environment secrets?",lang:"none",
answer:`<p><strong>Secrets</strong> (API keys, DB passwords, JWT secrets) should never be hard-coded or committed to Git. Store them in environment variables or a secrets manager (AWS Secrets Manager, Vault) and add <code>.env</code> to <code>.gitignore</code>.</p>`,
code:`# .gitignore\n.env\n\n# .env (never commit)\nDB_PASSWORD=supersecret\nJWT_SECRET=xyz123`},
{id:164,category:"Security",question:"The HTTPS/SSL handshake?",lang:"none",
answer:`<p>The <strong>TLS handshake</strong> establishes a secure connection:</p>
<ol><li>Client says hello with supported ciphers.</li><li>Server sends its certificate (public key).</li><li>They agree on a session key via asymmetric crypto.</li><li>Encrypted communication begins with the symmetric key.</li></ol>`,
code:`// 1. ClientHello\n// 2. ServerHello + Certificate\n// 3. Key exchange -> shared session key\n// 4. Encrypted data flows`},
{id:165,category:"Security",question:"Principle of least privilege?",lang:"none",
answer:`<p>The <strong>principle of least privilege</strong> means giving users, processes, and services only the minimum permissions needed to do their job. This limits damage if an account is compromised.</p>`,
code:`-- App DB user with only needed rights\nGRANT SELECT, INSERT ON app.orders TO 'app_user';\n-- not full admin access`},

{id:166,category:"APIs",question:"What is an API?",lang:"js",
answer:`<p>An <strong>API (Application Programming Interface)</strong> is a contract that lets software components communicate. Web APIs expose endpoints over HTTP so clients can request and exchange data (usually JSON).</p>`,
code:`fetch('https://api.example.com/users')\n  .then(res => res.json())\n  .then(data => console.log(data));`},
{id:167,category:"APIs",question:"REST vs GraphQL?",lang:"none",
answer:`<table><tr><th>REST</th><th>GraphQL</th></tr>
<tr><td>Multiple endpoints</td><td>Single endpoint</td></tr>
<tr><td>Fixed response shape</td><td>Client picks fields</td></tr>
<tr><td>Over/under-fetching</td><td>Exact data needed</td></tr>
<tr><td>Simpler, cacheable</td><td>Flexible, fewer round-trips</td></tr></table>`,
code:`# GraphQL: ask for exactly what you need\nquery {\n  user(id: 1) {\n    name\n    posts { title }\n  }\n}`},
{id:168,category:"APIs",question:"HTTP methods (verbs)?",lang:"none",
answer:`<ul><li><strong>GET</strong> – read data.</li><li><strong>POST</strong> – create data.</li><li><strong>PUT</strong> – replace a resource.</li><li><strong>PATCH</strong> – partial update.</li><li><strong>DELETE</strong> – remove.</li></ul>
<p>GET is safe & idempotent; POST is not idempotent.</p>`,
code:`GET    /users        # list\nPOST   /users        # create\nPUT    /users/1      # replace\nPATCH  /users/1      # update part\nDELETE /users/1      # remove`},
{id:169,category:"APIs",question:"HTTP status codes?",lang:"js",
answer:`<ul><li><strong>2xx</strong> success – 200 OK, 201 Created, 204 No Content.</li><li><strong>3xx</strong> redirect – 301, 304 Not Modified.</li><li><strong>4xx</strong> client error – 400, 401, 403, 404, 429.</li><li><strong>5xx</strong> server error – 500, 502, 503.</li></ul>`,
code:`// res.status(200).json(data);        // OK\n// res.status(201).json(newItem);     // Created\n// res.status(404).send('Not found'); // Client error\n// res.status(500).send('Error');     // Server error\nconsole.log("2xx ok, 4xx client, 5xx server");`},
{id:170,category:"APIs",question:"What is the fetch API?",lang:"js",
answer:`<p>The <strong>Fetch API</strong> is the modern, Promise-based way to make HTTP requests in the browser, replacing XMLHttpRequest.</p>`,
code:`async function getData() {\n  const res = await fetch('/api/data');\n  if (!res.ok) throw new Error('HTTP ' + res.status);\n  const data = await res.json();\n  return data;\n}`},
{id:171,category:"APIs",question:"What is Axios?",lang:"js",
answer:`<p><strong>Axios</strong> is a popular Promise-based HTTP client. Advantages over fetch: automatic JSON parsing, interceptors, request cancellation, timeouts, and better error handling.</p>`,
code:`import axios from 'axios';\nconst { data } = await axios.get('/api/users');\nawait axios.post('/api/users', { name: 'Sha' });\n// interceptors, baseURL, timeouts built-in`},
{id:172,category:"APIs",question:"What is API authentication?",lang:"js",
answer:`<p>APIs verify callers using methods like:</p>
<ul><li><strong>API keys</strong> – simple token in a header.</li><li><strong>JWT</strong> – signed bearer tokens.</li><li><strong>OAuth 2.0</strong> – delegated access.</li></ul>`,
code:`fetch('/api/data', {\n  headers: { 'Authorization': 'Bearer ' + token }\n});`},
{id:173,category:"APIs",question:"Rate limiting in APIs?",lang:"none",
answer:`<p>API <strong>rate limiting</strong> restricts how many requests a client may make in a window, returning <strong>429 Too Many Requests</strong> when exceeded. It protects the server and ensures fair usage. Often communicated via <code>X-RateLimit-*</code> headers.</p>`,
code:`HTTP/1.1 429 Too Many Requests\nX-RateLimit-Limit: 100\nX-RateLimit-Remaining: 0\nRetry-After: 60`},
{id:174,category:"APIs",question:"What is pagination?",lang:"none",
answer:`<p><strong>Pagination</strong> splits large result sets into pages so responses stay fast and small.</p>
<ul><li><strong>Offset/limit</strong> – <code>?page=2&limit=20</code>.</li><li><strong>Cursor-based</strong> – use a pointer to the last item (more stable).</li></ul>`,
code:`GET /products?page=2&limit=20\n\n// response\n{ "data": [], "page": 2, "total": 540 }`},
{id:175,category:"APIs",question:"What is API versioning?",lang:"none",
answer:`<p><strong>API versioning</strong> lets you change an API without breaking existing clients. Common strategies: URL path (<code>/v1/</code>), header, or query parameter.</p>`,
code:`GET /v1/users   # old clients\nGET /v2/users   # new features\n\n// or via header:\n// Accept: application/vnd.api.v2+json`},
{id:176,category:"APIs",question:"What is a webhook?",lang:"js",
answer:`<p>A <strong>webhook</strong> is a reverse API: instead of you polling, the server <strong>pushes</strong> an HTTP POST to your URL when an event happens (payment, new message). Real-time and efficient.</p>`,
code:`// Your endpoint receives events\napp.post('/webhook', (req, res) => {\n  const event = req.body;\n  if (event.type === 'payment.success') handle(event);\n  res.sendStatus(200);\n});`},
{id:177,category:"APIs",question:"What is idempotency?",lang:"none",
answer:`<p>An operation is <strong>idempotent</strong> if making the same request multiple times has the same effect as making it once. GET, PUT, DELETE are idempotent; POST usually isn't.</p>
<p>Idempotency keys prevent duplicate charges on retries.</p>`,
code:`PUT /users/1 { name: 'Sha' }  // same result if repeated\nPOST /charge\nHeader: Idempotency-Key: abc123 // safe to retry`},
{id:178,category:"APIs",question:"What is CORS preflight?",lang:"none",
answer:`<p>For "non-simple" cross-origin requests, the browser first sends an <strong>OPTIONS preflight</strong> request to check if the actual request is allowed. The server responds with allowed methods/headers/origin.</p>`,
code:`OPTIONS /api/data        # preflight\nAccess-Control-Request-Method: POST\n\n// Server replies:\nAccess-Control-Allow-Origin: https://sha.dev\nAccess-Control-Allow-Methods: POST, GET`},
{id:179,category:"APIs",question:"GraphQL query vs mutation?",lang:"none",
answer:`<ul><li><strong>Query</strong> – reads data (like GET).</li><li><strong>Mutation</strong> – writes/changes data (like POST/PUT/DELETE).</li><li><strong>Subscription</strong> – real-time updates via WebSockets.</li></ul>`,
code:`query { user(id:1) { name } }\n\nmutation {\n  addUser(name: "Sha") { id name }\n}`},
{id:180,category:"APIs",question:"What is WebSocket?",lang:"js",
answer:`<p><strong>WebSocket</strong> provides a persistent, full-duplex connection between client and server over a single TCP connection — ideal for real-time apps (chat, live data, games). Unlike HTTP, the server can push data anytime.</p>`,
code:`const ws = new WebSocket('wss://server.com');\nws.onmessage = e => console.log('Received:', e.data);\nws.onopen = () => ws.send('Hello server');`},

{id:181,category:"DevOps",question:"What is Git?",lang:"none",
answer:`<p><strong>Git</strong> is a distributed version control system that tracks changes to code, enables collaboration, branching, and history. Every developer has a full copy of the repository.</p>`,
code:`git init\ngit add .\ngit commit -m "Initial commit"\ngit push origin main`},
{id:182,category:"DevOps",question:"git merge vs rebase?",lang:"none",
answer:`<ul><li><strong>merge</strong> – combines branches, creating a merge commit; preserves history (non-linear).</li><li><strong>rebase</strong> – replays your commits on top of another branch; produces a clean, linear history but rewrites commits.</li></ul>
<p>Don't rebase shared/public branches.</p>`,
code:`# merge\ngit checkout main\ngit merge feature\n\n# rebase\ngit checkout feature\ngit rebase main`},
{id:183,category:"DevOps",question:"What is CI/CD?",lang:"none",
answer:`<ul><li><strong>CI (Continuous Integration)</strong> – automatically build & test code on every push.</li><li><strong>CD (Continuous Delivery/Deployment)</strong> – automatically release to staging/production.</li></ul>
<p>Tools: GitHub Actions, GitLab CI, Jenkins, CircleCI.</p>`,
code:`# GitHub Actions snippet\nname: CI\non: [push]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - run: npm install && npm test`},
{id:184,category:"DevOps",question:"What is Docker?",lang:"none",
answer:`<p><strong>Docker</strong> packages an app and its dependencies into a portable <strong>container</strong> that runs the same everywhere. Containers are lightweight and share the host OS kernel (unlike VMs).</p>`,
code:`# Dockerfile\nFROM node:20\nWORKDIR /app\nCOPY . .\nRUN npm install\nCMD ["node", "server.js"]\n# docker build -t app . && docker run -p 3000:3000 app`},
{id:185,category:"DevOps",question:"What is Kubernetes?",lang:"none",
answer:`<p><strong>Kubernetes (K8s)</strong> is a container orchestration platform that automates deploying, scaling, and managing containerised apps across clusters — handling load balancing, self-healing, and rolling updates.</p>`,
code:`# deployment.yaml (concept)\nkind: Deployment\nspec:\n  replicas: 3        # run 3 pods\n  template:\n    spec:\n      containers:\n        - image: myapp:1.0`},
{id:186,category:"DevOps",question:"Container vs virtual machine?",lang:"none",
answer:`<table><tr><th>Container</th><th>VM</th></tr>
<tr><td>Shares host OS kernel</td><td>Full guest OS</td></tr>
<tr><td>MBs, starts in seconds</td><td>GBs, starts in minutes</td></tr>
<tr><td>Lightweight, dense</td><td>Stronger isolation</td></tr></table>`,
code:`// Container: app + libs on shared kernel\n// VM: app + libs + full OS on hypervisor`},
{id:187,category:"DevOps",question:"What is a load balancer?",lang:"none",
answer:`<p>A <strong>load balancer</strong> distributes incoming traffic across multiple servers to improve availability, scalability, and reliability. Algorithms: round-robin, least-connections, IP hash.</p>`,
code:`# Nginx load balancing\nupstream app {\n  server app1:3000;\n  server app2:3000;\n}\nserver { location / { proxy_pass http://app; } }`},
{id:188,category:"DevOps",question:"Infrastructure as code?",lang:"none",
answer:`<p><strong>Infrastructure as Code (IaC)</strong> manages servers and resources through declarative config files instead of manual setup. It's version-controlled, repeatable, and automated. Tools: Terraform, CloudFormation, Ansible.</p>`,
code:`# Terraform (concept)\nresource "aws_instance" "web" {\n  ami           = "ami-123"\n  instance_type = "t2.micro"\n}`},
{id:189,category:"DevOps",question:"Monitoring and logging?",lang:"js",
answer:`<ul><li><strong>Monitoring</strong> – track metrics (CPU, latency, errors) and alert on issues. Tools: Prometheus, Grafana, Datadog.</li><li><strong>Logging</strong> – record events for debugging/audit. Centralise with ELK stack or Loki.</li></ul>`,
code:`// Structured log\nconsole.log(JSON.stringify({ event: 'login', userId: 42, ms: 120 }));\n// Metric: httpRequestDuration.observe(0.12);`},
{id:190,category:"DevOps",question:"Blue-green deployment?",lang:"none",
answer:`<p><strong>Blue-green deployment</strong> runs two identical environments. "Blue" serves live traffic while "green" gets the new release; you switch traffic to green once verified, enabling zero-downtime releases and instant rollback.</p>`,
code:`// Blue (v1) = live\n// Green (v2) = new, tested\n// Switch router: traffic -> Green\n// Problem? Switch back to Blue instantly`},

{id:191,category:"Advanced",question:"The event loop (deep dive)?",lang:"js",
answer:`<p>The <strong>event loop</strong> coordinates the call stack, microtask queue, and macrotask queue. After each synchronous run, <strong>all microtasks</strong> (Promises, queueMicrotask) drain before the next macrotask (setTimeout, I/O).</p>`,
code:`console.log('1');\nsetTimeout(() => console.log('4'), 0);\nPromise.resolve().then(() => console.log('3'));\nconsole.log('2');\n// Output: 1, 2, 3, 4 (microtasks before macrotasks)`},
{id:192,category:"Advanced",question:"What is memoization?",lang:"js",
answer:`<p><strong>Memoization</strong> is an optimization that caches the results of expensive function calls keyed by their arguments, returning the cached value on repeat calls. A specialized form of caching.</p>`,
code:`function memoize(fn) {\n  const cache = {};\n  return (n) => n in cache ? cache[n] : (cache[n] = fn(n));\n}\nconst slow = n => { for(let i=0;i<1e6;i++); return n*2; };\nconst fast = memoize(slow);\nconsole.log(fast(5), fast(5)); // 2nd is instant`},
{id:193,category:"Advanced",question:"Deep copy vs shallow copy?",lang:"js",
answer:`<ul><li><strong>Shallow copy</strong> – copies top-level properties; nested objects are shared by reference.</li><li><strong>Deep copy</strong> – recursively copies everything; fully independent.</li></ul>
<p>Deep copy via <code>structuredClone()</code> or <code>JSON.parse(JSON.stringify())</code>.</p>`,
code:`const obj = { a: 1, nested: { b: 2 } };\nconst shallow = { ...obj };\nshallow.nested.b = 99; // also changes obj!\nconsole.log(obj.nested.b); // 99\n\nconst deep = structuredClone(obj);\ndeep.nested.b = 0;    // obj unaffected\nconsole.log(obj.nested.b); // still 99`},
{id:194,category:"Advanced",question:"What is functional programming?",lang:"js",
answer:`<p><strong>Functional programming</strong> builds software from pure functions, avoiding shared state and mutation.</p>
<ul><li><strong>Pure functions</strong> – same input → same output, no side effects.</li><li><strong>Immutability</strong>.</li><li><strong>Higher-order functions</strong> & composition.</li></ul>`,
code:`const double = x => x * 2;\nconst inc = x => x + 1;\nconst compose = (f, g) => x => f(g(x));\nconsole.log(compose(double, inc)(5)); // 12`},
{id:195,category:"Advanced",question:"What is Big O notation?",lang:"none",
answer:`<p><strong>Big O</strong> describes how an algorithm's time/space grows with input size.</p>
<ul><li><strong>O(1)</strong> – constant.</li><li><strong>O(log n)</strong> – binary search.</li><li><strong>O(n)</strong> – linear loop.</li><li><strong>O(n log n)</strong> – good sorts.</li><li><strong>O(n²)</strong> – nested loops.</li></ul>`,
code:`// O(1) - direct access\narr[0];\n// O(n) - single loop\nfor (let i = 0; i < n; i++) {}\n// O(n^2) - nested loops\nfor (i) for (j) {}`},
{id:196,category:"Advanced",question:"Debouncing vs throttling (recap)?",lang:"none",
answer:`<ul><li><strong>Debounce</strong> – run after activity <em>stops</em> (e.g. search input).</li><li><strong>Throttle</strong> – run at most once per interval during activity (e.g. scroll).</li></ul>
<p>Both limit how often a function fires to improve performance.</p>`,
code:`// Debounce: waits for pause\n// [type][type][type]...pause -> fire once\n\n// Throttle: steady rate\n// [scroll scroll scroll] -> fire every 200ms`},
{id:197,category:"Advanced",question:"Web performance optimization?",lang:"html",
answer:`<p>Techniques to speed up web apps:</p>
<ul><li><strong>Minify & bundle</strong> JS/CSS; tree-shake.</li><li><strong>Lazy-load</strong> images & code splitting.</li><li><strong>Caching</strong> & CDN.</li><li><strong>Compress</strong> (gzip/Brotli), optimise images (WebP).</li><li>Reduce render-blocking resources; measure with Lighthouse.</li></ul>`,
code:`<img loading="lazy" src="photo.webp" alt="photo">\n<link rel="preload" href="font.woff2" as="font">\n<script src="app.js" defer><\/script>`},
{id:198,category:"Advanced",question:"What is a Progressive Web App (PWA)?",lang:"js",
answer:`<p>A <strong>PWA</strong> is a web app that behaves like a native app: installable, works offline (via <strong>service workers</strong>), supports push notifications, and is fast. Key parts: manifest + service worker + HTTPS.</p>`,
code:`// Register a service worker\nif ('serviceWorker' in navigator) {\n  navigator.serviceWorker.register('/sw.js');\n}\n// sw.js caches assets for offline use`},
{id:199,category:"Advanced",question:"What is a service worker?",lang:"js",
answer:`<p>A <strong>service worker</strong> is a background script that sits between the app and the network. It enables offline support, caching strategies, background sync and push notifications. It runs separately from the page and can intercept network requests.</p>`,
code:`// sw.js\nself.addEventListener('fetch', e => {\n  e.respondWith(\n    caches.match(e.request)\n      .then(res => res || fetch(e.request))\n  );\n});`},
{id:200,category:"Advanced",question:"Microservices / microfrontend architecture?",lang:"none",
answer:`<ul><li><strong>Microservices</strong> – backend split into small, independently deployable services, each owning one business capability and its data.</li><li><strong>Microfrontends</strong> – the same idea on the frontend: independent teams build and deploy separate UI pieces composed into one app.</li></ul>
<p>Benefits: independent scaling/deployment; trade-off: added complexity.</p>`,
code:`// Microservices\n// [Auth Service] [Order Service] [Payment Service]\n//   each: own DB, own deploy, talk via API/queue\n\n// Microfrontend\n// Shell loads: Header MFE + Cart MFE + Product MFE`}
];

  const f=(filter||'').trim().toLowerCase();
  categories.forEach(cat=>{
    const matches=cat.items.filter(q=>!f||q.question.toLowerCase().includes(f)||q.category.toLowerCase().includes(f)||(''+q.id)===f);
    if(matches.length===0)return;
    const catDiv=document.createElement('div');
    catDiv.className='cat'+((f||cat.items.some(q=>q.id===currentId))?' open':'');
    const head=document.createElement('div');
    head.className='cat-head';
    head.innerHTML='<span>'+cat.icon+'</span><span>'+cat.name+'</span><span class="cat-count">'+matches.length+'</span><span class="chev">▶</span>';
    head.onclick=()=>catDiv.classList.toggle('open');
    catDiv.appendChild(head);
    const list=document.createElement('div');
    list.className='q-list';
    matches.forEach(q=>{
      const item=document.createElement('div');
      item.className='q-item'+(q.id===currentId?' active':'')+(doneSet.has(q.id)?' done':'');
      item.dataset.id=q.id;
      item.innerHTML='<span class="qid">'+q.id+'.</span><span>'+q.question+'</span><span class="check">✓</span>';
      item.onclick=()=>{loadQuestion(q.id);if(window.innerWidth<=900)closeSidebar();};
      list.appendChild(item);
    });
    catDiv.appendChild(list);
    catList.appendChild(catDiv);
  });
}

function loadQuestion(id){
  const q=QUESTIONS.find(x=>x.id===id);
  if(!q)return;
  currentId=id;
  crumb.innerHTML='<span class="ic">'+(ICONS[q.category]||'📘')+'</span>'+q.category+' · Question '+q.id+' of 200';
  qTitle.textContent=q.id+'. '+q.question;
  answerEl.innerHTML=q.answer;

  if(q.code){
    editorSection.style.display='';
    editor.value=q.code;
    editor.dataset.original=q.code;
    langLabel.textContent=(q.lang&&q.lang!=='none'?q.lang:'CODE').toUpperCase();
    runCode();
  }else{
    editorSection.style.display='none';
  }

  updateDoneBtn();
  updateNavBtns();
  buildSidebar(search.value);
  history.replaceState(null,'','#q'+id);
  window.scrollTo({top:0,behavior:'smooth'});
}

function escForJs(code){return code.replace(/<\/script>/gi,'<\\/script>');}

function buildSrcDoc(code,lang){
  if(lang==='html'){
    return '<!DOCTYPE html><html><head><style>body{font-family:Inter,sans-serif;padding:14px;color:#111}</style></head><body>'+code+consoleScript()+'</body></html>';
  }
  if(lang==='css'){
    return '<!DOCTYPE html><html><body style="font-family:Inter,sans-serif;padding:14px;color:#111">'+code+'</body></html>';
  }
  // js / none / sql etc: run as JS and capture console output
  return '<!DOCTYPE html><html><head><style>body{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;padding:14px;white-space:pre-wrap;color:#111}.err{color:#c0392b}</style></head><body><div id="__c"></div>'+consoleScript()+'<scr'+'ipt>try{\n'+escForJs(code)+'\n}catch(e){__log("Error: "+e.message,true);}<\/scr'+'ipt></body></html>';
}
function consoleScript(){
  return '<scr'+'ipt>function __log(m,err){var d=document.getElementById("__c");if(!d){d=document.createElement("div");d.id="__c";d.style.cssText="font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap;color:#0a5e3e;margin-top:8px";document.body.appendChild(d);}var line=document.createElement("div");if(err)line.className="err";line.textContent=m;d.appendChild(line);}var __ol=console.log;console.log=function(){var a=[].slice.call(arguments).map(function(x){try{return (typeof x==="object"&&x!==null)?JSON.stringify(x):String(x);}catch(e){return String(x);}}).join(" ");__log(a);try{__ol.apply(console,arguments);}catch(e){}};window.onerror=function(m){__log("Error: "+m,true);return true;};<\/scr'+'ipt>';
}

function runCode(){
  const q=QUESTIONS.find(x=>x.id===currentId);
  const lang=(q&&q.lang&&q.lang!=='none')?q.lang:'js';
  preview.srcdoc=buildSrcDoc(editor.value,lang);
}

function updateDoneBtn(){
  const done=doneSet.has(currentId);
  doneBtn.textContent=done?'✓ Completed':'Mark as Done';
  doneBtn.classList.toggle('is-done',done);
}
function toggleDone(){
  if(doneSet.has(currentId))doneSet.delete(currentId);
  else doneSet.add(currentId);
  localStorage.setItem(STORE_KEY,JSON.stringify([...doneSet]));
  updateDoneBtn();updateProgress();
  document.querySelectorAll('.q-item').forEach(el=>{
    el.classList.toggle('done',doneSet.has(+el.dataset.id));
  });
}
function updateProgress(){
  const pct=Math.round(doneSet.size/QUESTIONS.length*100);
  document.getElementById('doneCount').textContent=doneSet.size;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressPct').textContent=pct+'%';
}
function updateNavBtns(){
  const prev=QUESTIONS.find(x=>x.id===currentId-1);
  const next=QUESTIONS.find(x=>x.id===currentId+1);
  const pb=document.getElementById('prevBtn'),nb=document.getElementById('nextBtn');
  pb.disabled=!prev;nb.disabled=!next;
  document.getElementById('prevTtl').textContent=prev?prev.question.slice(0,26):'—';
  document.getElementById('nextTtl').textContent=next?next.question.slice(0,26):'—';
}
function goPrev(){if(QUESTIONS.find(x=>x.id===currentId-1))loadQuestion(currentId-1);}
function goNext(){if(QUESTIONS.find(x=>x.id===currentId+1))loadQuestion(currentId+1);}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
function shareQuestion(){
  const url=location.origin+location.pathname+'#q'+currentId;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>showToast('Link copied!'),()=>prompt('Copy this link:',url));
  }else prompt('Copy this link:',url);
}
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('show');}
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('show');}
function applyTheme(dark){
  document.body.classList.toggle('dark',dark);
  document.getElementById('themeToggle').textContent=dark?'☀️':'🌙';
  localStorage.setItem(THEME_KEY,dark?'dark':'light');
}

document.getElementById('runBtn').onclick=runCode;
document.getElementById('resetBtn').onclick=()=>{editor.value=editor.dataset.original;runCode();};
doneBtn.onclick=toggleDone;
document.getElementById('shareBtn').onclick=shareQuestion;
document.getElementById('prevBtn').onclick=goPrev;
document.getElementById('nextBtn').onclick=goNext;
document.getElementById('themeToggle').onclick=()=>applyTheme(!document.body.classList.contains('dark'));
document.getElementById('hamburger').onclick=()=>sidebar.classList.contains('open')?closeSidebar():openSidebar();
overlay.onclick=closeSidebar;
search.addEventListener('input',()=>buildSidebar(search.value));
editor.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=editor.selectionStart;editor.value=editor.value.slice(0,s)+'  '+editor.value.slice(editor.selectionEnd);editor.selectionStart=editor.selectionEnd=s+2;}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight')goNext();
  if(e.key==='ArrowLeft')goPrev();
});

applyTheme(localStorage.getItem(THEME_KEY)==='dark');
buildSidebar();
updateProgress();
const m=location.hash.match(/#q(\d+)/);
const startId=m?Math.min(200,Math.max(1,+m[1])):1;
loadQuestion(startId);
</script>
</body>
</html>
