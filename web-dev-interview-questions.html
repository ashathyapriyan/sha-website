:root{--bg:#f8f8f2;--accent:#0f7a52;--orange:#c07e1a;--card:#fff;--border:#e0e0d4;--code-bg:#1e1e2e;--code-text:#cdd6f4;--text:#333;--muted:#888;}

.lesson-content li{margin-bottom:6px;}
.lesson-content code,.breadcrumb code{background:rgba(15,122,82,.1);color:var(--accent);padding:2px 6px;border-radius:4px;font-family:'Courier New',monospace;font-size:.85em;}

.editor-wrap{display:none;margin-top:16px;border:1.5px solid var(--accent);border-radius:12px;overflow:hidden;}

.editor-toolbar{background:var(--accent);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:600;}
.editor-body{display:grid;grid-template-columns:1fr 1fr;min-height:280px;}
.editor-body textarea{width:100%;height:100%;min-height:280px;background:#1e1e2e;color:#cdd6f4;border:none;padding:16px;font-family:'Courier New',monospace;font-size:.87rem;resize:none;outline:none;tab-size:2;line-height:1.5;}
.editor-body iframe{width:100%;height:100%;min-height:280px;border:none;border-left:1px solid #333;background:#fff;}

.btn-run{background:var(--accent);color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-weight:600;font-family:inherit;}
.btn-reset{background:#444;color:#fff;border:none;padding:6px 16px;border-radius:6px;cursor:pointer;font-family:inherit;}
.btn-close{background:transparent;color:#aaa;border:1px solid #444;padding:6px 16px;border-radius:6px;cursor:pointer;margin-left:auto;font-family:inherit;}
@media(max-width:900px){#sidebar{transform:translateX(-100%);transition:.2s;z-index:90;}#sidebar.show{transform:translateX(0);}#main{margin-left:0;padding:80px 20px 40px;}.editor-body{grid-template-columns:1fr;}#nav-search{width:110px;}.nav-link{display:none;}#nav-search{display:none;}#links-btn{display:block;}}

<script>
const Q = [{"id": 1, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "What is HTML?", "lesson": "<p>HTML (HyperText Markup Language) is the standard markup language for creating web pages. It describes the <strong>structure</strong> of a web page using a series of elements represented by tags.</p><h3>Key Concepts</h3><ul><li><strong>Tags</strong> — keywords surrounded by angle brackets like <code>&lt;p&gt;</code></li><li><strong>Elements</strong> — opening tag + content + closing tag</li><li><strong>Attributes</strong> — extra info inside the opening tag (id, class, href)</li><li><strong>Nesting</strong> — elements can contain other elements</li></ul><h3>How it Works</h3><p>The browser reads HTML top to bottom and renders each element. HTML provides the skeleton, CSS styles it, and JavaScript makes it interactive.</p>", "code": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <title>My First Page</title>\n</head>\n<body>\n  <h1>Hello, World!</h1>\n  <p>This is my first HTML page.</p>\n  <a href=\"#\">Click me</a>\n</body>\n</html>", "lang": "html"}, {"id": 2, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "HTML4 vs HTML5", "lesson": "<p>HTML5 is the modern version of HTML, replacing HTML4. It introduced semantic elements, native multimedia, graphics, and richer APIs without needing plugins like Flash.</p><h3>What HTML5 Added</h3><ul><li><strong>Semantic tags</strong> — <code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;article&gt;</code></li><li><strong>Media</strong> — native <code>&lt;audio&gt;</code> and <code>&lt;video&gt;</code></li><li><strong>Graphics</strong> — <code>&lt;canvas&gt;</code> and SVG</li><li><strong>Storage</strong> — localStorage and sessionStorage</li><li><strong>Simpler DOCTYPE</strong> — just <code>&lt;!DOCTYPE html&gt;</code></li></ul><p>HTML4 relied on plugins for media and had a long, complex DOCTYPE declaration.</p>", "code": "<!DOCTYPE html>\n<html>\n<body>\n  <header><h1>HTML5 Page</h1></header>\n  <nav>Navigation</nav>\n  <article>\n    <video controls width=\"240\">\n      <source src=\"movie.mp4\" type=\"video/mp4\">\n    </video>\n  </article>\n</body>\n</html>", "lang": "html"}, {"id": 3, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Semantic Tags", "lesson": "<p>Semantic HTML uses tags that describe their <strong>meaning</strong> to both the browser and the developer, instead of generic <code>&lt;div&gt;</code> containers.</p><h3>Common Semantic Elements</h3><ul><li><code>&lt;header&gt;</code> — introductory content / logo</li><li><code>&lt;nav&gt;</code> — navigation links</li><li><code>&lt;main&gt;</code> — primary unique content</li><li><code>&lt;article&gt;</code> — self-contained content</li><li><code>&lt;section&gt;</code> — thematic grouping</li><li><code>&lt;aside&gt;</code> — sidebar / related info</li><li><code>&lt;footer&gt;</code> — footer content</li></ul><p>Semantic tags improve <strong>accessibility</strong> (screen readers), <strong>SEO</strong>, and code readability.</p>", "code": "<!DOCTYPE html>\n<html><body>\n  <header><h1>My Blog</h1></header>\n  <nav><a href=\"#\">Home</a></nav>\n  <main>\n    <article>\n      <h2>Post Title</h2>\n      <p>Post content...</p>\n    </article>\n    <aside>Related links</aside>\n  </main>\n  <footer>&copy; 2026</footer>\n</body></html>", "lang": "html"}, {"id": 4, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "div vs span", "lesson": "<p>Both <code>&lt;div&gt;</code> and <code>&lt;span&gt;</code> are generic containers with no semantic meaning, but they differ in <strong>display type</strong>.</p><ul><li><strong>&lt;div&gt;</strong> — block-level, starts on a new line, takes full width</li><li><strong>&lt;span&gt;</strong> — inline, flows within text, takes only needed width</li></ul><h3>When to Use</h3><p>Use <code>&lt;div&gt;</code> to group larger sections or layout blocks. Use <code>&lt;span&gt;</code> to style a small part of text inside a line.</p>", "code": "<!DOCTYPE html><html><body>\n  <div style=\"background:#cde;padding:8px\">\n    A div is block-level (full width).\n  </div>\n  <p>Text with a\n    <span style=\"color:red\">red span</span>\n    inline.</p>\n</body></html>", "lang": "html"}, {"id": 5, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "DOCTYPE Declaration", "lesson": "<p>The <code>&lt;!DOCTYPE html&gt;</code> declaration is the very first line of an HTML document. It tells the browser which version of HTML to use.</p><h3>Why It Matters</h3><ul><li>Signals HTML5 to the browser</li><li>Prevents <strong>quirks mode</strong> (inconsistent old rendering)</li><li>Ensures standards-compliant rendering</li><li>Must appear before the <code>&lt;html&gt;</code> tag</li></ul><p>Without it, browsers fall back to quirks mode, where box models and CSS behave unpredictably.</p>", "code": "<!DOCTYPE html>\n<html>\n<head><title>Standards Mode</title></head>\n<body>\n  <p>This page renders in standards mode.</p>\n</body>\n</html>", "lang": "html"}, {"id": 6, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Meta Tags", "lesson": "<p>Meta tags live inside <code>&lt;head&gt;</code> and provide metadata about the page — character encoding, viewport, description, and social sharing data.</p><h3>Common Meta Tags</h3><ul><li><code>charset=\"UTF-8\"</code> — character encoding</li><li><code>viewport</code> — responsive scaling on mobile</li><li><code>description</code> — used by search engines</li><li><code>og:title</code> / <code>og:image</code> — social media previews</li></ul>", "code": "<!DOCTYPE html><html>\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n  <meta name=\"description\" content=\"A web dev course\">\n  <meta property=\"og:title\" content=\"Web Dev Course\">\n</head>\n<body><p>Check the head section.</p></body>\n</html>", "lang": "html"}, {"id": 7, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "ID vs Class", "lesson": "<p><code>id</code> and <code>class</code> are attributes used to identify and style elements, but they have different rules.</p><ul><li><strong>id</strong> — must be <em>unique</em> per page, selected with <code>#</code></li><li><strong>class</strong> — reusable across many elements, selected with <code>.</code></li><li><strong>Specificity</strong> — an id (0,1,0,0) beats a class (0,0,1,0)</li><li>JS: <code>getElementById</code> vs <code>querySelectorAll('.cls')</code></li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  #main { color: green; }\n  .box { border: 1px solid #888; padding: 6px; margin:4px; }\n</style></head><body>\n  <h1 id=\"main\">Unique heading</h1>\n  <div class=\"box\">Box 1</div>\n  <div class=\"box\">Box 2</div>\n</body></html>", "lang": "html"}, {"id": 8, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Inline vs Block Elements", "lesson": "<p>Every HTML element has a default display type that controls how it sits in the document flow.</p><h3>Block Elements</h3><p>Take full width and start on a new line: <code>&lt;div&gt;</code>, <code>&lt;p&gt;</code>, <code>&lt;h1&gt;</code>, <code>&lt;ul&gt;</code>.</p><h3>Inline Elements</h3><p>Flow within a line and take only the space they need: <code>&lt;span&gt;</code>, <code>&lt;a&gt;</code>, <code>&lt;img&gt;</code>, <code>&lt;strong&gt;</code>.</p>", "code": "<!DOCTYPE html><html><body>\n  <p style=\"background:#eef\">Block paragraph 1</p>\n  <p style=\"background:#fee\">Block paragraph 2</p>\n  <a href=\"#\">inline link</a>\n  <strong>inline strong</strong>\n  <span>inline span</span>\n</body></html>", "lang": "html"}, {"id": 9, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "HTML Forms", "lesson": "<p>Forms collect user input and send it to a server. The <code>&lt;form&gt;</code> element wraps inputs and defines where and how data is submitted.</p><h3>Key Parts</h3><ul><li><code>action</code> — URL the data is sent to</li><li><code>method</code> — GET or POST</li><li><code>&lt;label&gt;</code> — accessible text for an input</li><li><code>required</code>, <code>placeholder</code> — validation and hints</li></ul>", "code": "<!DOCTYPE html><html><body>\n<form action=\"/submit\" method=\"post\">\n  <label>Name:\n    <input type=\"text\" name=\"name\" placeholder=\"Jane\" required>\n  </label><br><br>\n  <label>Email:\n    <input type=\"email\" name=\"email\" required>\n  </label><br><br>\n  <button type=\"submit\">Send</button>\n</form>\n</body></html>", "lang": "html"}, {"id": 10, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "GET vs POST", "lesson": "<p>GET and POST are the two most common HTTP methods used by forms to send data.</p><ul><li><strong>GET</strong> — data appended to the URL, cacheable, bookmarkable, length-limited, not for sensitive data</li><li><strong>POST</strong> — data sent in the request body, not cached, supports large payloads, better for sensitive data</li></ul><p>Use GET for retrieving/searching, POST for creating or submitting sensitive data.</p>", "code": "<!DOCTYPE html><html><body>\n<h3>GET form (data in URL)</h3>\n<form action=\"/search\" method=\"get\">\n  <input name=\"q\" placeholder=\"search\">\n  <button>GET</button>\n</form>\n<h3>POST form (data in body)</h3>\n<form action=\"/login\" method=\"post\">\n  <input name=\"pw\" type=\"password\">\n  <button>POST</button>\n</form>\n</body></html>", "lang": "html"}, {"id": 11, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "localStorage vs sessionStorage", "lesson": "<p>The Web Storage API lets you store key-value pairs in the browser. Both share the same API but differ in lifetime.</p><ul><li><strong>localStorage</strong> — persists until explicitly cleared, survives browser restarts</li><li><strong>sessionStorage</strong> — cleared when the tab/window closes, isolated per tab</li><li>Both store strings only (use <code>JSON.stringify</code>) and hold about 5MB</li></ul>", "code": "<!DOCTYPE html><html><body>\n<div id=\"out\"></div>\n<script>\n  localStorage.setItem(\"user\", \"Jane\");\n  sessionStorage.setItem(\"temp\", \"42\");\n  document.getElementById(\"out\").innerHTML =\n    \"local: \" + localStorage.getItem(\"user\") +\n    \"<br>session: \" + sessionStorage.getItem(\"temp\");\n<\\/script>\n</body></html>", "lang": "html"}, {"id": 12, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Data Attributes", "lesson": "<p>Custom <code>data-*</code> attributes let you store extra information on any HTML element, accessible from JavaScript via the <code>dataset</code> property.</p><ul><li>Syntax: <code>data-user-id=\"42\"</code></li><li>Read in JS: <code>el.dataset.userId</code> (camelCase)</li><li>Great for passing config to scripts without polluting global state</li></ul>", "code": "<!DOCTYPE html><html><body>\n<button id=\"b\" data-user-id=\"42\" data-role=\"admin\">Info</button>\n<p id=\"out\"></p>\n<script>\n  const b = document.getElementById(\"b\");\n  document.getElementById(\"out\").textContent =\n    \"id=\" + b.dataset.userId + \", role=\" + b.dataset.role;\n<\\/script>\n</body></html>", "lang": "html"}, {"id": 13, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "iframe", "lesson": "<p>An <code>&lt;iframe&gt;</code> embeds another HTML document inside the current page — useful for maps, videos, or external widgets.</p><h3>Key Attributes</h3><ul><li><code>src</code> — URL of the embedded page</li><li><code>sandbox</code> — restricts what the embedded content can do (security)</li><li><code>width</code> / <code>height</code> — dimensions</li></ul><p>Be cautious: iframes can introduce security and clickjacking risks, so use <code>sandbox</code>.</p>", "code": "<!DOCTYPE html><html><body>\n  <h3>Embedded content</h3>\n  <iframe srcdoc=\"<h2>I am inside an iframe!</h2>\"\n          width=\"300\" height=\"120\"\n          sandbox=\"allow-scripts\"></iframe>\n</body></html>", "lang": "html"}, {"id": 14, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Cookies vs localStorage", "lesson": "<p>Both store data in the browser, but they serve different purposes.</p><ul><li><strong>Cookies</strong> — ~4KB, sent to server on every request, support expiry and <code>httpOnly</code></li><li><strong>localStorage</strong> — ~5MB, never sent to server, persists until cleared, JS-only access</li></ul><p>Use cookies for server-side auth/session tokens, localStorage for client-only data.</p>", "code": "<!DOCTYPE html><html><body>\n<p id=\"out\"></p>\n<script>\n  document.cookie = \"theme=dark; max-age=3600\";\n  localStorage.setItem(\"lang\", \"en\");\n  document.getElementById(\"out\").innerHTML =\n    \"cookie: \" + document.cookie +\n    \"<br>local: \" + localStorage.getItem(\"lang\");\n<\\/script>\n</body></html>", "lang": "html"}, {"id": 15, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Void Elements", "lesson": "<p>Void (self-closing) elements have no content and no closing tag. They cannot wrap other elements.</p><h3>Common Void Elements</h3><ul><li><code>&lt;br&gt;</code> — line break</li><li><code>&lt;hr&gt;</code> — horizontal rule</li><li><code>&lt;img&gt;</code> — image</li><li><code>&lt;input&gt;</code> — form field</li><li><code>&lt;meta&gt;</code>, <code>&lt;link&gt;</code> — metadata</li></ul>", "code": "<!DOCTYPE html><html><body>\n  Line one<br>Line two\n  <hr>\n  <img src=\"https://via.placeholder.com/80\" alt=\"placeholder\">\n  <input type=\"text\" placeholder=\"void input\">\n</body></html>", "lang": "html"}, {"id": 16, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "alt Attribute", "lesson": "<p>The <code>alt</code> attribute provides alternative text for images. It is read by screen readers and shown when an image fails to load.</p><ul><li>Improves <strong>accessibility</strong> for visually impaired users</li><li>Helps <strong>SEO</strong> — search engines read alt text</li><li>Acts as fallback text for broken images</li><li>Use empty <code>alt=\"\"</code> for purely decorative images</li></ul>", "code": "<!DOCTYPE html><html><body>\n  <img src=\"broken-link.jpg\"\n       alt=\"A golden retriever puppy playing\"\n       width=\"200\">\n  <p>If the image fails, the alt text shows.</p>\n</body></html>", "lang": "html"}, {"id": 17, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Audio & Video", "lesson": "<p>HTML5 added native <code>&lt;audio&gt;</code> and <code>&lt;video&gt;</code> elements, removing the need for plugins.</p><h3>Useful Attributes</h3><ul><li><code>controls</code> — show play/pause UI</li><li><code>autoplay</code>, <code>muted</code>, <code>loop</code></li><li><code>poster</code> — preview image for video</li><li><code>&lt;source&gt;</code> — provide multiple formats</li></ul>", "code": "<!DOCTYPE html><html><body>\n  <video controls width=\"260\" muted loop\n         poster=\"https://via.placeholder.com/260x140\">\n    <source src=\"movie.mp4\" type=\"video/mp4\">\n    Your browser does not support video.\n  </video>\n  <audio controls>\n    <source src=\"audio.mp3\" type=\"audio/mpeg\">\n  </audio>\n</body></html>", "lang": "html"}, {"id": 18, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "Accessibility (a11y)", "lesson": "<p>Accessibility means building pages usable by everyone, including people using screen readers or keyboards only.</p><h3>Best Practices</h3><ul><li>Use <strong>semantic HTML</strong> (headings, lists, buttons)</li><li>Provide <code>alt</code> text and form <code>&lt;label&gt;</code>s</li><li>Ensure good <strong>color contrast</strong> (WCAG)</li><li>Support <strong>keyboard navigation</strong> and visible focus</li><li>Use ARIA only when native HTML is not enough</li></ul>", "code": "<!DOCTYPE html><html><body>\n  <button>Accessible native button</button>\n  <label for=\"email\">Email</label>\n  <input id=\"email\" type=\"email\">\n  <a href=\"#main\">Skip to content</a>\n</body></html>", "lang": "html"}, {"id": 19, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "ARIA Attributes", "lesson": "<p>ARIA (Accessible Rich Internet Applications) attributes add accessibility information to elements when native HTML semantics are insufficient.</p><h3>Common ARIA</h3><ul><li><code>role</code> — defines element purpose (e.g. <code>role=\"alert\"</code>)</li><li><code>aria-label</code> — accessible name</li><li><code>aria-hidden</code> — hide from screen readers</li><li><code>aria-expanded</code> — collapsible state</li><li><code>aria-describedby</code> — link to descriptive text</li></ul><p>Rule of thumb: prefer native HTML first, use ARIA to fill gaps.</p>", "code": "<!DOCTYPE html><html><body>\n  <button aria-label=\"Close dialog\">&times;</button>\n  <div role=\"alert\">Form saved successfully!</div>\n  <span aria-hidden=\"true\">decorative icon</span>\n</body></html>", "lang": "html"}, {"id": 20, "cat": "HTML", "icon": "🧠", "catId": 1, "title": "strong vs b, em vs i", "lesson": "<p>These tags can look the same visually but differ in <strong>meaning</strong>.</p><ul><li><strong>&lt;strong&gt;</strong> — semantic importance (bold + meaning)</li><li><strong>&lt;b&gt;</strong> — visual bold only, no added meaning</li><li><strong>&lt;em&gt;</strong> — semantic emphasis (italic + meaning)</li><li><strong>&lt;i&gt;</strong> — visual italic only (e.g. technical terms)</li></ul><p>Screen readers may stress <code>strong</code>/<code>em</code> but ignore <code>b</code>/<code>i</code>.</p>", "code": "<!DOCTYPE html><html><body>\n  <p><strong>Warning:</strong> semantic importance.</p>\n  <p><b>Bold</b> visual only.</p>\n  <p><em>Emphasized</em> semantic stress.</p>\n  <p><i>Italic</i> visual only.</p>\n</body></html>", "lang": "html"}, {"id": 21, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "What is CSS?", "lesson": "<p>CSS (Cascading Style Sheets) describes how HTML elements should look. A rule has a <strong>selector</strong>, then <strong>properties</strong> and <strong>values</strong>.</p><h3>Three Ways to Apply CSS</h3><ul><li><strong>Inline</strong> — <code>style</code> attribute on an element</li><li><strong>Internal</strong> — <code>&lt;style&gt;</code> in the head</li><li><strong>External</strong> — linked <code>.css</code> file</li></ul><p>\"Cascading\" means multiple rules can apply and the most specific one wins.</p>", "code": "<!DOCTYPE html><html><head><style>\n  p { color: #0f7a52; font-size: 18px; }\n  .highlight { background: yellow; }\n</style></head><body>\n  <p>Styled paragraph.</p>\n  <p class=\"highlight\">Highlighted.</p>\n</body></html>", "lang": "css"}, {"id": 22, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Inline vs Internal vs External CSS", "lesson": "<p>There are three places to write CSS, each with trade-offs.</p><ul><li><strong>Inline</strong> — quick, but highest specificity and not reusable</li><li><strong>Internal</strong> — page-specific styles in <code>&lt;style&gt;</code></li><li><strong>External</strong> — reusable across pages, cacheable, best practice</li></ul><p>External stylesheets keep structure and presentation separate and improve maintainability.</p>", "code": "<!DOCTYPE html><html><head><style>\n  /* internal */\n  h1 { color: teal; }\n</style></head><body>\n  <h1>Internal styled</h1>\n  <p style=\"color:orange\">Inline styled</p>\n</body></html>", "lang": "css"}, {"id": 23, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Specificity", "lesson": "<p>Specificity decides which CSS rule wins when several target the same element. It is calculated as four numbers (inline, id, class, element).</p><ul><li>Inline style — (1,0,0,0), highest</li><li>ID selector — (0,1,0,0)</li><li>Class / attribute / pseudo-class — (0,0,1,0)</li><li>Element / pseudo-element — (0,0,0,1)</li></ul><p>Higher specificity overrides lower. <code>!important</code> beats everything.</p>", "code": "<!DOCTYPE html><html><head><style>\n  p { color: gray; }        /* low */\n  .note { color: blue; }    /* higher */\n  #x { color: green; }      /* highest */\n</style></head><body>\n  <p id=\"x\" class=\"note\">Green wins.</p>\n</body></html>", "lang": "css"}, {"id": 24, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "The Box Model", "lesson": "<p>Every element is a rectangular box made of four layers, from inside out: <strong>content</strong>, <strong>padding</strong>, <strong>border</strong>, <strong>margin</strong>.</p><ul><li><strong>content</strong> — the actual text/image</li><li><strong>padding</strong> — space inside the border</li><li><strong>border</strong> — the edge</li><li><strong>margin</strong> — space outside the border</li></ul><p><code>box-sizing: border-box</code> makes width include padding and border.</p>", "code": "<!DOCTYPE html><html><head><style>\n  .box { box-sizing: border-box; width: 200px;\n    padding: 20px; border: 4px solid #0f7a52;\n    margin: 16px; background: #cde; }\n</style></head><body>\n  <div class=\"box\">Box model demo</div>\n</body></html>", "lang": "css"}, {"id": 25, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Margin vs Padding", "lesson": "<p>Both create space, but on opposite sides of the border.</p><ul><li><strong>margin</strong> — space <em>outside</em> the border, between elements</li><li><strong>padding</strong> — space <em>inside</em> the border, around content</li><li>Vertical margins can <strong>collapse</strong> (merge) between elements</li><li><code>margin: 0 auto</code> horizontally centers a block</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .a { background:#fdd; padding:20px; margin:10px; }\n  .b { background:#dfd; padding:5px; margin:40px; }\n</style></head><body>\n  <div class=\"a\">Lots of padding</div>\n  <div class=\"b\">Lots of margin</div>\n</body></html>", "lang": "css"}, {"id": 26, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Flexbox", "lesson": "<p>Flexbox is a one-dimensional layout system for arranging items in a row or column with flexible sizing.</p><h3>Key Properties</h3><ul><li><code>display: flex</code> — enable flex on container</li><li><code>flex-direction</code> — row or column</li><li><code>justify-content</code> — align along main axis</li><li><code>align-items</code> — align along cross axis</li><li><code>gap</code> — spacing between items</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .row { display:flex; justify-content:space-between;\n    align-items:center; gap:10px; }\n  .row div { background:#0f7a52; color:#fff; padding:16px; }\n</style></head><body>\n  <div class=\"row\"><div>1</div><div>2</div><div>3</div></div>\n</body></html>", "lang": "css"}, {"id": 27, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Grid", "lesson": "<p>CSS Grid is a two-dimensional layout system controlling both rows and columns simultaneously.</p><ul><li><code>display: grid</code> — enable grid</li><li><code>grid-template-columns</code> — define columns (e.g. <code>1fr 1fr</code>)</li><li><code>fr</code> — fractional unit of free space</li><li><code>gap</code> — spacing between cells</li><li><code>minmax()</code> / <code>auto-fit</code> — responsive grids</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .grid { display:grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap:8px; }\n  .grid div { background:#c07e1a; color:#fff; padding:20px; }\n</style></head><body>\n  <div class=\"grid\"><div>A</div><div>B</div><div>C</div>\n  <div>D</div><div>E</div><div>F</div></div>\n</body></html>", "lang": "css"}, {"id": 28, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Positioning", "lesson": "<p>The <code>position</code> property controls how an element is placed in the document.</p><ul><li><strong>static</strong> — default, normal flow</li><li><strong>relative</strong> — offset from its normal position</li><li><strong>absolute</strong> — positioned relative to nearest positioned ancestor</li><li><strong>fixed</strong> — relative to viewport, stays on scroll</li><li><strong>sticky</strong> — toggles between relative and fixed</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .rel { position:relative; height:120px; background:#eee; }\n  .abs { position:absolute; top:10px; right:10px;\n    background:#0f7a52; color:#fff; padding:8px; }\n</style></head><body>\n  <div class=\"rel\">Relative parent\n    <div class=\"abs\">Absolute child</div>\n  </div>\n</body></html>", "lang": "css"}, {"id": 29, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "z-index", "lesson": "<p><code>z-index</code> controls the stacking order of overlapping elements along the z-axis.</p><ul><li>Higher <code>z-index</code> appears on top</li><li>Only works on <strong>positioned</strong> elements (not static)</li><li>Creates a <strong>stacking context</strong></li><li>A child cannot escape its parent's stacking context</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .box { position:absolute; width:80px; height:80px; }\n  .a { background:#0f7a52; z-index:1; top:20px; left:20px; }\n  .b { background:#c07e1a; z-index:2; top:50px; left:50px; }\n</style></head><body>\n  <div class=\"box a\">1</div><div class=\"box b\">2 on top</div>\n</body></html>", "lang": "css"}, {"id": 30, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Units", "lesson": "<p>CSS offers absolute and relative length units for sizing.</p><ul><li><strong>px</strong> — fixed pixels</li><li><strong>em</strong> — relative to parent font-size</li><li><strong>rem</strong> — relative to root font-size</li><li><strong>%</strong> — relative to parent</li><li><strong>vh / vw</strong> — percentage of viewport height/width</li></ul><p>Use <code>rem</code> for scalable, accessible typography.</p>", "code": "<!DOCTYPE html><html><head><style>\n  .px { font-size:24px; }\n  .rem { font-size:2rem; }\n  .vw { width:50vw; background:#cde; }\n</style></head><body>\n  <p class=\"px\">24px text</p>\n  <p class=\"rem\">2rem text</p>\n  <div class=\"vw\">50vw wide</div>\n</body></html>", "lang": "css"}, {"id": 31, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Pseudo-classes", "lesson": "<p>Pseudo-classes style elements based on their state or position, using a single colon.</p><ul><li><code>:hover</code> — mouse over</li><li><code>:focus</code> — element focused</li><li><code>:nth-child(n)</code> — position in parent</li><li><code>:first-child</code> / <code>:last-child</code></li><li><code>:not()</code> — negation, <code>:checked</code> — checkbox state</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  li:nth-child(odd) { background:#eee; }\n  a:hover { color:#c07e1a; }\n</style></head><body>\n  <ul><li>One</li><li>Two</li><li>Three</li><li>Four</li></ul>\n  <a href=\"#\">Hover me</a>\n</body></html>", "lang": "css"}, {"id": 32, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Pseudo-elements", "lesson": "<p>Pseudo-elements style a specific part of an element, using double colons.</p><ul><li><code>::before</code> / <code>::after</code> — inject content (needs <code>content</code>)</li><li><code>::first-line</code> / <code>::first-letter</code></li><li><code>::placeholder</code> — input placeholder text</li><li><code>::selection</code> — highlighted text</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .tag::before { content:\"\\2605 \"; color:#c07e1a; }\n  p::first-letter { font-size:2em; color:#0f7a52; }\n</style></head><body>\n  <p class=\"tag\">Pseudo-element demo text here.</p>\n</body></html>", "lang": "css"}, {"id": 33, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "visibility:hidden vs display:none", "lesson": "<p>Both hide an element, but treat layout space differently.</p><ul><li><strong>visibility:hidden</strong> — invisible but still occupies space</li><li><strong>display:none</strong> — removed from layout entirely, no space</li><li><code>display:none</code> elements are skipped by screen readers</li><li>Toggling <code>display</code> can affect reflow performance</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .hid { visibility:hidden; }\n  .none { display:none; }\n</style></head><body>\n  <p>Before</p>\n  <p class=\"hid\">hidden (keeps space)</p>\n  <p class=\"none\">none (no space)</p>\n  <p>After</p>\n</body></html>", "lang": "css"}, {"id": 34, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Media Queries", "lesson": "<p>Media queries apply CSS conditionally based on device characteristics like screen width.</p><ul><li><code>@media (max-width: 768px)</code> — phones/tablets</li><li><code>@media (min-width: 1200px)</code> — large screens</li><li><code>orientation: landscape</code></li><li><code>@media print</code> — print styles</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .box { background:#0f7a52; color:#fff; padding:20px; }\n  @media (max-width:600px) { .box { background:#c07e1a; } }\n</style></head><body>\n  <div class=\"box\">Resize result pane to change color.</div>\n</body></html>", "lang": "css"}, {"id": 35, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Responsive Design", "lesson": "<p>Responsive design makes pages adapt to any screen size using flexible layouts and media queries.</p><ul><li><strong>Fluid grids</strong> — percentage/fr widths</li><li><strong>Flexible images</strong> — <code>max-width:100%</code></li><li><strong>Media queries</strong> — breakpoints</li><li><strong>Viewport meta tag</strong> — proper mobile scaling</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  img { max-width:100%; height:auto; }\n  .wrap { display:flex; flex-wrap:wrap; gap:8px; }\n  .wrap div { flex:1 1 150px; background:#cde; padding:20px; }\n</style></head><body>\n  <div class=\"wrap\"><div>A</div><div>B</div><div>C</div></div>\n</body></html>", "lang": "css"}, {"id": 36, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Mobile-First Design", "lesson": "<p>Mobile-first means writing base styles for small screens, then enhancing for larger ones with <code>min-width</code> queries.</p><ul><li>Default CSS targets mobile</li><li>Use <code>@media (min-width: ...)</code> to add complexity</li><li>Improves performance on constrained devices</li><li>Encourages prioritizing essential content</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .nav { display:block; background:#eee; padding:8px; }\n  @media (min-width:600px) {\n    .nav { display:flex; gap:16px; background:#0f7a52; color:#fff; }\n  }\n</style></head><body>\n  <div class=\"nav\"><span>Home</span><span>About</span></div>\n</body></html>", "lang": "css"}, {"id": 37, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Transitions", "lesson": "<p>Transitions smoothly animate a property change over time, commonly on hover.</p><ul><li>Syntax: <code>transition: property duration timing-function delay</code></li><li><code>transition: all 0.3s ease</code></li><li>Triggered by a state change (hover, focus, class)</li><li>Cheap, GPU-friendly for transform/opacity</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .btn { background:#0f7a52; color:#fff; padding:12px 24px;\n    transition: transform .3s ease, background .3s; }\n  .btn:hover { background:#c07e1a; transform:scale(1.1); }\n</style></head><body>\n  <button class=\"btn\">Hover me</button>\n</body></html>", "lang": "css"}, {"id": 38, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Transition vs Animation", "lesson": "<p>Both animate CSS, but differ in control and triggering.</p><ul><li><strong>Transition</strong> — animates between two states, needs a trigger</li><li><strong>Animation</strong> — uses <code>@keyframes</code> with multiple steps</li><li>Animations can loop (<code>infinite</code>) and run automatically</li><li>Animations support more complex multi-stage motion</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  @keyframes spin { to { transform: rotate(360deg); } }\n  .box { width:60px; height:60px; background:#0f7a52;\n    animation: spin 2s linear infinite; }\n</style></head><body>\n  <div class=\"box\"></div>\n</body></html>", "lang": "css"}, {"id": 39, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Transform", "lesson": "<p>The <code>transform</code> property lets you visually manipulate elements without affecting layout flow.</p><ul><li><code>translate(x,y)</code> — move</li><li><code>rotate(deg)</code> — rotate</li><li><code>scale(n)</code> — resize</li><li><code>skew(deg)</code> — slant</li><li><code>transform-origin</code> — pivot point</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .b { width:80px; height:80px; background:#c07e1a; margin:40px;\n    transform: rotate(15deg) scale(1.2); }\n</style></head><body>\n  <div class=\"b\"></div>\n</body></html>", "lang": "css"}, {"id": 40, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "overflow", "lesson": "<p>The <code>overflow</code> property controls content that exceeds its container's size.</p><ul><li><strong>visible</strong> — content spills out (default)</li><li><strong>hidden</strong> — clipped, no scrollbars</li><li><strong>scroll</strong> — always show scrollbars</li><li><strong>auto</strong> — scrollbars only when needed</li><li><code>text-overflow: ellipsis</code> — adds … for clipped text</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .box { width:200px; height:60px; overflow:auto;\n    border:1px solid #888; padding:8px; }\n</style></head><body>\n  <div class=\"box\">Long content that overflows the box. Long content that overflows. More text here to scroll.</div>\n</body></html>", "lang": "css"}, {"id": 41, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Inheritance", "lesson": "<p>Some CSS properties pass down from parent to child automatically; others do not.</p><ul><li><strong>Inherited</strong> — <code>color</code>, <code>font-family</code>, <code>font-size</code></li><li><strong>Not inherited</strong> — <code>margin</code>, <code>padding</code>, <code>border</code></li><li><code>inherit</code> keyword forces inheritance</li><li><code>initial</code> resets to default</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  .parent { color: #0f7a52; font-style: italic; }\n  .child { border: inherit; }\n</style></head><body>\n  <div class=\"parent\">Parent\n    <p class=\"child\">Child inherits color and italic.</p>\n  </div>\n</body></html>", "lang": "css"}, {"id": 42, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "!important", "lesson": "<p><code>!important</code> overrides all other declarations regardless of specificity.</p><ul><li>Beats inline styles and ID selectors</li><li>Useful for debugging or overriding third-party CSS</li><li>Avoid in production — makes code hard to maintain</li><li>Two <code>!important</code> rules fall back to specificity</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  #x { color: green; }\n  p { color: red !important; }\n</style></head><body>\n  <p id=\"x\">Red wins because of !important.</p>\n</body></html>", "lang": "css"}, {"id": 43, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "CSS Preprocessors (SCSS)", "lesson": "<p>Preprocessors like SCSS extend CSS with programming features, compiled into plain CSS.</p><ul><li><strong>Variables</strong> — <code>$primary: #0f7a52;</code></li><li><strong>Nesting</strong> — nest child selectors</li><li><strong>Mixins</strong> — <code>@mixin</code> / <code>@include</code> reusable blocks</li><li><strong>@extend</strong> — share rules between selectors</li></ul><p>The code below shows the compiled CSS result that a browser understands.</p>", "code": "<!DOCTYPE html><html><head><style>\n  /* compiled from SCSS: $primary: #0f7a52; */\n  .card { border:1px solid #0f7a52; padding:12px; }\n  .card .title { color:#0f7a52; font-weight:bold; }\n</style></head><body>\n  <div class=\"card\"><div class=\"title\">Compiled SCSS</div></div>\n</body></html>", "lang": "css"}, {"id": 44, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "SCSS vs SASS", "lesson": "<p>SASS and SCSS are two syntaxes of the same preprocessor.</p><ul><li><strong>SCSS</strong> — uses braces <code>{}</code> and semicolons (CSS-like)</li><li><strong>SASS</strong> — indentation-based, no braces (older)</li><li>SCSS is fully CSS-compatible — any valid CSS is valid SCSS</li><li>SCSS is more widely used today</li></ul>", "code": "<!DOCTYPE html><html><head><style>\n  /* SCSS-style compiled output */\n  $skipped: true; /* shown as comment */\n  button { background:#0f7a52; color:#fff; padding:10px; }\n</style></head><body>\n  <button>SCSS compiled button</button>\n</body></html>", "lang": "css"}, {"id": 45, "cat": "CSS", "icon": "🎨", "catId": 2, "title": "Bootstrap", "lesson": "<p>Bootstrap is a popular CSS framework with a responsive grid and prebuilt components.</p><ul><li>Loaded via CDN <code>&lt;link&gt;</code></li><li>Grid: <code>container</code> &gt; <code>row</code> &gt; <code>col-md-6</code></li><li>Components: <code>btn</code>, <code>card</code>, <code>navbar</code></li><li>Responsive utility classes out of the box</li></ul><p>The demo recreates Bootstrap-like classes manually so it runs offline.</p>", "code": "<!DOCTYPE html><html><head><style>\n  .btn { display:inline-block; padding:8px 16px; border-radius:6px;\n    background:#0d6efd; color:#fff; border:none; }\n  .card { border:1px solid #ddd; border-radius:8px; padding:16px; }\n</style></head><body>\n  <div class=\"card\"><button class=\"btn\">Bootstrap-style</button></div>\n</body></html>", "lang": "css"}, {"id": 46, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "What is JavaScript?", "lesson": "<p>JavaScript is a high-level, interpreted programming language that makes web pages interactive. It runs in the browser and on servers (Node.js).</p><ul><li><strong>Interpreted</strong> — runs without a separate compile step</li><li><strong>Dynamically typed</strong> — variables can hold any type</li><li><strong>Single-threaded</strong> — one call stack, uses the event loop</li><li>Based on the <strong>ECMAScript</strong> standard</li></ul>", "code": "console.log(\"Hello from JavaScript!\");\nlet x = 5;\nx = \"now a string\";\nconsole.log(typeof x, x);", "lang": "js"}, {"id": 47, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "var, let, const", "lesson": "<p>These three keywords declare variables but behave differently.</p><ul><li><strong>var</strong> — function-scoped, hoisted, can be redeclared</li><li><strong>let</strong> — block-scoped, has a temporal dead zone</li><li><strong>const</strong> — block-scoped, cannot be reassigned</li><li>Prefer <code>const</code>, use <code>let</code> when reassigning</li></ul>", "code": "const PI = 3.14;\nlet count = 0;\ncount++;\nconsole.log(PI, count);\n// const PI = 4; // would throw", "lang": "js"}, {"id": 48, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Data Types", "lesson": "<p>JavaScript has primitive types and one complex type (object).</p><ul><li><strong>Primitives</strong> — String, Number, Boolean, null, undefined, Symbol, BigInt</li><li><strong>Object</strong> — arrays, functions, objects</li><li>Use <code>typeof</code> to check a type</li><li>Primitives are immutable; objects are reference types</li></ul>", "code": "console.log(typeof \"hi\");\nconsole.log(typeof 42);\nconsole.log(typeof true);\nconsole.log(typeof undefined);\nconsole.log(typeof {a:1});\nconsole.log(typeof [1,2]);", "lang": "js"}, {"id": 49, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "null vs undefined", "lesson": "<p>Both represent \"no value\" but with different intent.</p><ul><li><strong>undefined</strong> — variable declared but not assigned</li><li><strong>null</strong> — intentional absence of value</li><li><code>typeof undefined</code> is 'undefined', <code>typeof null</code> is 'object'</li><li><code>null == undefined</code> is true, but <code>null === undefined</code> is false</li></ul>", "code": "let a;\nlet b = null;\nconsole.log(a);\nconsole.log(b);\nconsole.log(null == undefined);\nconsole.log(null === undefined);", "lang": "js"}, {"id": 50, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Hoisting", "lesson": "<p>Hoisting moves declarations to the top of their scope before code runs.</p><ul><li><code>var</code> declarations hoist as <code>undefined</code></li><li>Function declarations hoist fully (can call before defining)</li><li><code>let</code>/<code>const</code> hoist but stay in the temporal dead zone</li><li>Function expressions are not hoisted</li></ul>", "code": "console.log(greet());\nfunction greet() { return \"Hi!\"; }\n\nconsole.log(x); // undefined, not error\nvar x = 5;", "lang": "js"}, {"id": 51, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Scope", "lesson": "<p>Scope determines where variables are accessible.</p><ul><li><strong>Global scope</strong> — accessible everywhere</li><li><strong>Function scope</strong> — inside a function</li><li><strong>Block scope</strong> — inside <code>{}</code> for let/const</li><li><strong>Lexical scope</strong> — inner functions access outer variables</li></ul>", "code": "const g = \"global\";\nfunction outer() {\n  const o = \"outer\";\n  function inner() {\n    console.log(g, o);\n  }\n  inner();\n}\nouter();", "lang": "js"}, {"id": 52, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Closures", "lesson": "<p>A closure is a function that remembers variables from its outer scope even after that scope has returned.</p><ul><li>Enables private state and data encapsulation</li><li>Used in counters, factories, and the module pattern</li><li>Each call creates a fresh closure</li><li>Common in event handlers and callbacks</li></ul>", "code": "function makeCounter() {\n  let count = 0;\n  return () => ++count;\n}\nconst c = makeCounter();\nconsole.log(c());\nconsole.log(c());\nconsole.log(c());", "lang": "js"}, {"id": 53, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Callbacks", "lesson": "<p>A callback is a function passed as an argument to be called later.</p><ul><li>Foundation of async JS (timers, events, requests)</li><li>Used by array methods like <code>forEach</code>, <code>map</code></li><li>Can lead to \"callback hell\" when nested deeply</li><li>Promises/async-await improve on callbacks</li></ul>", "code": "function process(value, callback) {\n  callback(value * 2);\n}\nprocess(5, result => console.log(\"Result:\", result));\n\n[1,2,3].forEach(n => console.log(\"n =\", n));", "lang": "js"}, {"id": 54, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Arrow Functions", "lesson": "<p>Arrow functions are a concise syntax for writing functions, introduced in ES6.</p><ul><li>Shorter: <code>(a,b) =&gt; a + b</code></li><li>No own <code>this</code> — inherits from enclosing scope</li><li>No <code>arguments</code> object</li><li>Cannot be used as constructors</li></ul>", "code": "const add = (a, b) => a + b;\nconst square = n => n * n;\nconsole.log(add(2, 3));\nconsole.log(square(4));\nconst nums = [1,2,3].map(n => n * 10);\nconsole.log(nums);", "lang": "js"}, {"id": 55, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "== vs ===", "lesson": "<p>These compare values differently.</p><ul><li><strong>==</strong> — loose equality, performs type coercion</li><li><strong>===</strong> — strict equality, no coercion</li><li><code>0 == '0'</code> is true, but <code>0 === '0'</code> is false</li><li>Always prefer <code>===</code> to avoid surprises</li></ul>", "code": "console.log(0 == \"0\");\nconsole.log(0 === \"0\");\nconsole.log(1 == true);\nconsole.log(1 === true);\nconsole.log(null == undefined);", "lang": "js"}, {"id": 56, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Event Bubbling", "lesson": "<p>When an event fires on an element, it bubbles up through its ancestors to the document root.</p><ul><li>Event triggers on target, then parent, then grandparent...</li><li>Default phase for most events</li><li><code>event.stopPropagation()</code> halts bubbling</li><li>Enables event delegation</li></ul>", "code": "const out = [];\nfunction log(m){ out.push(m); document.body.innerHTML=\"<pre>\"+out.join(\"\\n\")+\"</pre>\"; }\n// simulate parent/child\nconst parent = { onClick(){ log(\"parent clicked (bubbled)\"); } };\nlog(\"Child clicked\");\nparent.onClick();", "lang": "js"}, {"id": 57, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Event Capturing", "lesson": "<p>Capturing is the opposite of bubbling: the event travels top-down from the root to the target first.</p><ul><li>Enabled with <code>addEventListener(type, fn, true)</code></li><li>Runs before the bubbling phase</li><li>Useful to intercept events early</li><li>Most code uses bubbling, not capturing</li></ul>", "code": "console.log(\"Capture phase: document -> parent -> target\");\nconsole.log(\"Then bubble phase: target -> parent -> document\");\n// addEventListener(\"click\", fn, true) uses capture", "lang": "js"}, {"id": 58, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Event Delegation", "lesson": "<p>Event delegation attaches a single listener to a parent and uses <code>event.target</code> to handle child events.</p><ul><li>One listener instead of many — better performance</li><li>Works for dynamically added elements</li><li>Uses event bubbling under the hood</li><li>Check <code>event.target</code> to find the actual element</li></ul>", "code": "function handleClick(target) {\n  if (target === \"delete-btn\") console.log(\"Deleted a row!\");\n}\n// one listener on the list handles all buttons\nhandleClick(\"delete-btn\");", "lang": "js"}, {"id": 59, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "The DOM", "lesson": "<p>The DOM (Document Object Model) is a tree representation of the page that JavaScript can read and modify.</p><ul><li><code>document.querySelector</code> / <code>getElementById</code> — select</li><li><code>createElement</code> / <code>appendChild</code> — add nodes</li><li><code>textContent</code> / <code>innerHTML</code> — change content</li><li><code>remove()</code> — delete nodes</li></ul>", "code": "const div = document.createElement(\"div\");\ndiv.textContent = \"Added via DOM!\";\ndiv.style.color = \"#0f7a52\";\ndocument.body.appendChild(div);\nconsole.log(\"Node added\");", "lang": "js"}, {"id": 60, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Sync vs Async", "lesson": "<p>Synchronous code runs line by line, blocking until each finishes. Asynchronous code lets long tasks run without blocking.</p><ul><li>Sync — blocks the single thread</li><li>Async — uses Web APIs, callback/microtask queues</li><li>Examples: <code>setTimeout</code>, fetch, file I/O</li><li>Managed by the event loop</li></ul>", "code": "console.log(\"1 (sync)\");\nsetTimeout(() => console.log(\"3 (async)\"), 0);\nconsole.log(\"2 (sync)\");", "lang": "js"}, {"id": 61, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Promises", "lesson": "<p>A Promise represents a future value from an async operation. It has three states: pending, fulfilled, rejected.</p><ul><li>Created with <code>new Promise((resolve, reject) =&gt; ...)</code></li><li><code>.then()</code> handles success</li><li><code>.catch()</code> handles errors</li><li><code>.finally()</code> always runs</li></ul>", "code": "const p = new Promise((resolve) => {\n  setTimeout(() => resolve(\"Done!\"), 300);\n});\np.then(v => console.log(v))\n .catch(e => console.log(e))\n .finally(() => console.log(\"Settled\"));", "lang": "js"}, {"id": 62, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "async / await", "lesson": "<p><code>async</code>/<code>await</code> is syntax sugar over promises that makes async code read like synchronous code.</p><ul><li>An <code>async</code> function always returns a promise</li><li><code>await</code> pauses until the promise settles</li><li>Use <code>try</code>/<code>catch</code> for errors</li><li>Cleaner than chained <code>.then()</code></li></ul>", "code": "function wait(ms){ return new Promise(r => setTimeout(r, ms)); }\nasync function run() {\n  console.log(\"start\");\n  await wait(300);\n  console.log(\"after await\");\n}\nrun();", "lang": "js"}, {"id": 63, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "setTimeout / setInterval", "lesson": "<p>Timer functions schedule code to run later.</p><ul><li><code>setTimeout(fn, ms)</code> — run once after delay</li><li><code>setInterval(fn, ms)</code> — run repeatedly</li><li><code>clearTimeout</code> / <code>clearInterval</code> cancel them</li><li>Minimum delay is roughly 4ms</li></ul>", "code": "setTimeout(() => console.log(\"Runs once after 200ms\"), 200);\nlet n = 0;\nconst id = setInterval(() => {\n  console.log(\"tick\", ++n);\n  if (n === 3) clearInterval(id);\n}, 100);", "lang": "js"}, {"id": 64, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "map, filter, reduce", "lesson": "<p>These array methods transform data declaratively without manual loops.</p><ul><li><strong>map</strong> — transform each element, returns new array</li><li><strong>filter</strong> — keep elements that pass a test</li><li><strong>reduce</strong> — accumulate into a single value</li><li>All return new values, leaving the original unchanged</li></ul>", "code": "const nums = [1,2,3,4];\nconsole.log(nums.map(n => n*2));\nconsole.log(nums.filter(n => n%2===0));\nconsole.log(nums.reduce((sum,n) => sum+n, 0));", "lang": "js"}, {"id": 65, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Destructuring", "lesson": "<p>Destructuring extracts values from arrays or objects into variables.</p><ul><li>Objects: <code>const {a, b} = obj</code></li><li>Arrays: <code>const [x, y] = arr</code></li><li>Rename: <code>const {a: alpha} = obj</code></li><li>Defaults: <code>const {c = 10} = obj</code></li></ul>", "code": "const user = { name: \"Jane\", age: 30 };\nconst { name, age } = user;\nconsole.log(name, age);\nconst [first, second] = [10, 20];\nconsole.log(first, second);", "lang": "js"}, {"id": 66, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Spread Operator", "lesson": "<p>The spread operator <code>...</code> expands an iterable into individual elements.</p><ul><li>Copy/merge arrays: <code>[...a, ...b]</code></li><li>Copy/merge objects: <code>{...o1, ...o2}</code></li><li>Pass array as function args: <code>fn(...arr)</code></li><li>Creates shallow copies</li></ul>", "code": "const a = [1,2], b = [3,4];\nconsole.log([...a, ...b]);\nconst o1 = {x:1}, o2 = {y:2};\nconsole.log({...o1, ...o2});\nconsole.log(Math.max(...[5,2,9]));", "lang": "js"}, {"id": 67, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Rest Parameters", "lesson": "<p>Rest parameters collect remaining arguments into a real array.</p><ul><li>Syntax: <code>function f(a, ...rest)</code></li><li><code>rest</code> is a true Array (unlike <code>arguments</code>)</li><li>Must be the last parameter</li><li>Also works in destructuring</li></ul>", "code": "function sum(...nums) {\n  return nums.reduce((t, n) => t + n, 0);\n}\nconsole.log(sum(1,2,3,4));\nconst [first, ...others] = [1,2,3,4];\nconsole.log(first, others);", "lang": "js"}, {"id": 68, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Template Literals", "lesson": "<p>Template literals use backticks for string interpolation and multiline strings.</p><ul><li>Interpolation: <code>`Hello ${name}`</code></li><li>Multiline strings without <code>\\n</code></li><li>Can embed any expression</li><li>Support tagged templates</li></ul>", "code": "const name = \"Jane\", n = 3;\nconsole.log(`Hello ${name}, you have ${n} messages`);\nconsole.log(`Line 1\nLine 2`);", "lang": "js"}, {"id": 69, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Optional Chaining", "lesson": "<p>Optional chaining <code>?.</code> safely accesses nested properties, returning <code>undefined</code> instead of throwing.</p><ul><li><code>obj?.prop</code> — safe property access</li><li><code>obj?.method?.()</code> — safe call</li><li><code>arr?.[0]</code> — safe index</li><li>Pairs well with <code>??</code> (nullish coalescing)</li></ul>", "code": "const user = { profile: { name: \"Jane\" } };\nconsole.log(user?.profile?.name);\nconsole.log(user?.account?.balance);\nconsole.log(user?.account?.balance ?? \"no account\");", "lang": "js"}, {"id": 70, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "The this Keyword", "lesson": "<p><code>this</code> refers to the execution context and its value depends on how a function is called.</p><ul><li>Global scope — the global object (or undefined in strict mode)</li><li>Object method — the object before the dot</li><li>Arrow function — inherits <code>this</code> lexically</li><li>Constructor — the new instance</li></ul>", "code": "const obj = {\n  name: \"Jane\",\n  greet() { return \"Hi, \" + this.name; }\n};\nconsole.log(obj.greet());\nconst arrow = () => this;\nconsole.log(\"arrow this is lexical\");", "lang": "js"}, {"id": 71, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Function Declaration vs Expression", "lesson": "<p>Two ways to define functions with different hoisting behavior.</p><ul><li><strong>Declaration</strong> — <code>function f(){}</code>, fully hoisted</li><li><strong>Expression</strong> — <code>const f = function(){}</code>, not hoisted</li><li>Declarations can be called before they appear</li><li>Expressions follow normal variable rules</li></ul>", "code": "console.log(declared());\nfunction declared() { return \"I am hoisted\"; }\n\nconst expr = function() { return \"not hoisted\"; };\nconsole.log(expr());", "lang": "js"}, {"id": 72, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Prototype", "lesson": "<p>Every JS object has a hidden link to a prototype object from which it inherits properties.</p><ul><li>Accessed via <code>__proto__</code> or <code>Object.getPrototypeOf</code></li><li>Property lookup walks the prototype chain</li><li><code>Object.prototype</code> sits at the top</li><li>Methods like <code>toString</code> live on prototypes</li></ul>", "code": "const arr = [1,2,3];\nconsole.log(arr.__proto__ === Array.prototype);\nconsole.log(typeof arr.map);\nconsole.log(Object.getPrototypeOf(arr) === Array.prototype);", "lang": "js"}, {"id": 73, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Prototypal Inheritance", "lesson": "<p>Objects inherit directly from other objects through the prototype chain.</p><ul><li><code>Object.create(proto)</code> sets the prototype</li><li><code>class</code>/<code>extends</code> is syntax sugar over prototypes</li><li>Shared methods live on the prototype, saving memory</li><li>Differs from classical class-based inheritance</li></ul>", "code": "class Animal {\n  constructor(name){ this.name = name; }\n  speak(){ return this.name + \" makes a sound\"; }\n}\nclass Dog extends Animal {\n  speak(){ return this.name + \" barks\"; }\n}\nconsole.log(new Dog(\"Rex\").speak());", "lang": "js"}, {"id": 74, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "JSON", "lesson": "<p>JSON (JavaScript Object Notation) is a lightweight text format for data exchange.</p><ul><li><code>JSON.stringify(obj)</code> — object to string</li><li><code>JSON.parse(str)</code> — string to object</li><li>Cannot contain functions or <code>undefined</code></li><li>Circular references throw an error</li></ul>", "code": "const obj = { name: \"Jane\", age: 30 };\nconst str = JSON.stringify(obj, null, 2);\nconsole.log(str);\nconst back = JSON.parse(str);\nconsole.log(back.name);", "lang": "js"}, {"id": 75, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "localStorage vs sessionStorage (JS)", "lesson": "<p>Both Web Storage APIs share the same methods but differ in lifetime.</p><ul><li>Both hold about 5MB and store strings only</li><li><strong>localStorage</strong> persists across sessions</li><li><strong>sessionStorage</strong> clears when the tab closes</li><li>API: <code>setItem</code>, <code>getItem</code>, <code>removeItem</code></li></ul>", "code": "// localStorage and sessionStorage share the same API\nconsole.log(\"localStorage.setItem(key, value)\");\nconsole.log(\"localStorage.getItem(key)\");\nconst data = { saved: true };\nconsole.log(JSON.stringify(data));", "lang": "js"}, {"id": 76, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "NaN", "lesson": "<p><code>NaN</code> (Not a Number) results from invalid numeric operations.</p><ul><li><code>typeof NaN</code> is 'number'</li><li><code>NaN !== NaN</code> — it is never equal to itself</li><li>Use <code>Number.isNaN()</code> to test for it</li><li>Produced by things like <code>0/0</code> or <code>Number('abc')</code></li></ul>", "code": "console.log(typeof NaN);\nconsole.log(NaN === NaN);\nconsole.log(Number.isNaN(NaN));\nconsole.log(Number(\"hello\"));", "lang": "js"}, {"id": 77, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Truthy and Falsy", "lesson": "<p>Every value is either truthy or falsy when evaluated in a boolean context.</p><ul><li><strong>Falsy</strong>: <code>false</code>, <code>0</code>, <code>''</code>, <code>null</code>, <code>undefined</code>, <code>NaN</code></li><li>Everything else is truthy (including <code>[]</code> and <code>{}</code>)</li><li>Used in conditions and short-circuit logic</li><li>Convert with <code>Boolean(x)</code> or <code>!!x</code></li></ul>", "code": "[0, \"\", null, undefined, NaN, \"hi\", [], {}].forEach(v => {\n  console.log(JSON.stringify(v), \"->\", Boolean(v));\n});", "lang": "js"}, {"id": 78, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Debounce", "lesson": "<p>Debouncing delays a function until a pause in rapid calls — ideal for search inputs.</p><ul><li>Runs only after N ms with no new calls</li><li>Resets the timer on each call</li><li>Common for input/resize/scroll handlers</li><li>Reduces unnecessary work</li></ul>", "code": "function debounce(fn, ms) {\n  let t;\n  return (...args) => {\n    clearTimeout(t);\n    t = setTimeout(() => fn(...args), ms);\n  };\n}\nconst log = debounce(() => console.log(\"Searched!\"), 200);\nlog(); log(); log(); // only last runs", "lang": "js"}, {"id": 79, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Throttle", "lesson": "<p>Throttling limits a function to run at most once per N ms, no matter how often it is called.</p><ul><li>Guarantees a steady execution rate</li><li>Great for scroll and resize events</li><li>Differs from debounce (which waits for a pause)</li><li>Improves performance on frequent events</li></ul>", "code": "function throttle(fn, ms) {\n  let last = 0;\n  return (...a) => {\n    const now = Date.now();\n    if (now - last >= ms) { last = now; fn(...a); }\n  };\n}\nconst log = throttle(() => console.log(\"scroll handled\"), 100);\nlog(); log();", "lang": "js"}, {"id": 80, "cat": "JavaScript", "icon": "⚡", "catId": 3, "title": "Currying", "lesson": "<p>Currying transforms a function of multiple arguments into a chain of single-argument functions.</p><ul><li><code>f(a, b, c)</code> becomes <code>f(a)(b)(c)</code></li><li>Enables partial application</li><li>Creates reusable specialized functions</li><li>Common in functional programming</li></ul>", "code": "const multiply = a => b => c => a * b * c;\nconsole.log(multiply(2)(3)(4));\nconst double = multiply(2)(1);\nconsole.log(double(5));", "lang": "js"}, {"id": 81, "cat": "React", "icon": "⚛️", "catId": 4, "title": "What is React?", "lesson": "<p>React is a JavaScript library by Facebook for building user interfaces from reusable components.</p><ul><li><strong>Component-based</strong> — UI split into pieces</li><li><strong>Declarative</strong> — describe what UI should look like</li><li><strong>Virtual DOM</strong> — efficient updates via diffing</li><li>Huge ecosystem and community</li></ul>", "code": "// React component (shown as JS)\nfunction App() {\n  return \"<h1>Hello React</h1>\";\n}\nconsole.log(App());", "lang": "js"}, {"id": 82, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Components", "lesson": "<p>Components are independent, reusable pieces of UI that return markup.</p><ul><li>A function that returns JSX</li><li>Reusable and composable</li><li>Receive data via props</li><li>Can be nested to build complex UIs</li></ul>", "code": "function Button(label) {\n  return `<button>${label}</button>`;\n}\nconsole.log(Button(\"Save\"));\nconsole.log(Button(\"Cancel\"));", "lang": "js"}, {"id": 83, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Functional vs Class Components", "lesson": "<p>React supports two component styles.</p><ul><li><strong>Functional</strong> — plain functions + Hooks (modern)</li><li><strong>Class</strong> — ES6 classes + lifecycle methods (legacy)</li><li>Functional components are simpler and now preferred</li><li>Hooks gave functions state and lifecycle abilities</li></ul>", "code": "// Functional (modern)\nfunction Hello() { return \"Hi\"; }\n// Class (legacy)\nclass HelloClass {\n  render() { return \"Hi\"; }\n}\nconsole.log(Hello(), new HelloClass().render());", "lang": "js"}, {"id": 84, "cat": "React", "icon": "⚛️", "catId": 4, "title": "JSX", "lesson": "<p>JSX is a syntax extension that lets you write HTML-like markup inside JavaScript.</p><ul><li>Compiled to <code>React.createElement</code> calls</li><li>Use <code>className</code> instead of <code>class</code></li><li>Embed expressions with <code>{}</code></li><li>Must return a single root element</li></ul>", "code": "// JSX: <h1 className=\"title\">{name}</h1>\n// compiles to:\nconst el = { type: \"h1\", props: { className: \"title\" } };\nconsole.log(JSON.stringify(el));", "lang": "js"}, {"id": 85, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Props", "lesson": "<p>Props pass data from a parent component to a child. They are read-only.</p><ul><li>Data flows one way: parent to child</li><li>Read-only — children must not mutate props</li><li>Can be any type, including functions</li><li>Accessed as the function argument</li></ul>", "code": "function Greeting(props) {\n  return `Hello, ${props.name}`;\n}\nconsole.log(Greeting({ name: \"Jane\" }));", "lang": "js"}, {"id": 86, "cat": "React", "icon": "⚛️", "catId": 4, "title": "State", "lesson": "<p>State is local, mutable data that, when changed, re-renders the component.</p><ul><li>Managed with the <code>useState</code> hook</li><li>Changing state triggers a re-render</li><li>Private to the component</li><li>Should be updated via the setter, not directly</li></ul>", "code": "// const [count, setCount] = useState(0)\nlet count = 0;\nfunction setCount(v){ count = v; console.log(\"re-render:\", count); }\nsetCount(count + 1);\nsetCount(count + 1);", "lang": "js"}, {"id": 87, "cat": "React", "icon": "⚛️", "catId": 4, "title": "State vs Props", "lesson": "<p>Both hold data but differ in ownership and mutability.</p><ul><li><strong>State</strong> — internal, mutable, owned by the component</li><li><strong>Props</strong> — external, read-only, passed from parent</li><li>State changes trigger re-renders</li><li>Props let parents configure children</li></ul>", "code": "console.log(\"Props: passed in, read-only\");\nconsole.log(\"State: internal, changeable\");\nconst props = { title: \"Hi\" };\nlet state = { open: false };\nstate.open = true;\nconsole.log(props, state);", "lang": "js"}, {"id": 88, "cat": "React", "icon": "⚛️", "catId": 4, "title": "useState Hook", "lesson": "<p><code>useState</code> adds local state to a functional component.</p><ul><li>Returns <code>[value, setValue]</code></li><li>Argument is the initial state</li><li>Setter schedules a re-render</li><li>Use a callback for updates based on previous state</li></ul>", "code": "// const [count, setCount] = useState(0)\nlet count = 0;\nconst setCount = fn => { count = fn(count); console.log(count); };\nsetCount(c => c + 1);\nsetCount(c => c + 1);", "lang": "js"}, {"id": 89, "cat": "React", "icon": "⚛️", "catId": 4, "title": "useEffect Hook", "lesson": "<p><code>useEffect</code> runs side effects after render, like data fetching or subscriptions.</p><ul><li>Runs after the component renders</li><li>Dependency array controls when it runs</li><li>Empty array <code>[]</code> = run once on mount</li><li>Return a cleanup function to undo effects</li></ul>", "code": "// useEffect(() => { ... }, [deps])\nfunction effect() { console.log(\"Effect ran after render\"); }\nfunction cleanup() { console.log(\"Cleanup on unmount\"); }\neffect();\ncleanup();", "lang": "js"}, {"id": 90, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Virtual DOM", "lesson": "<p>The Virtual DOM is a lightweight JS copy of the real DOM that React uses to optimize updates.</p><ul><li>React builds a virtual tree on each render</li><li>It diffs new vs previous trees</li><li>Only changed nodes touch the real DOM</li><li>Minimizes expensive DOM operations</li></ul>", "code": "const oldTree = { tag: \"h1\", text: \"Hello\" };\nconst newTree = { tag: \"h1\", text: \"Hi\" };\nif (oldTree.text !== newTree.text)\n  console.log(\"Update only the text node\");", "lang": "js"}, {"id": 91, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Reconciliation", "lesson": "<p>Reconciliation is React's diffing algorithm that decides how to update the DOM efficiently.</p><ul><li>Same element type — update props in place</li><li>Different type — unmount old, mount new</li><li>Lists use keys to track items</li><li>Heuristic O(n) algorithm</li></ul>", "code": "function reconcile(oldType, newType) {\n  return oldType === newType ? \"update props\" : \"remount\";\n}\nconsole.log(reconcile(\"div\",\"div\"));\nconsole.log(reconcile(\"div\",\"span\"));", "lang": "js"}, {"id": 92, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Keys", "lesson": "<p>Keys give list items a stable identity so React can track changes efficiently.</p><ul><li>Must be unique among siblings</li><li>Should be stable (a real id, not array index)</li><li>Help React match items between renders</li><li>Avoid index keys when the list reorders</li></ul>", "code": "const items = [{id:1,t:\"A\"},{id:2,t:\"B\"}];\nitems.forEach(i => console.log(`key=${i.id} -> ${i.t}`));", "lang": "js"}, {"id": 93, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Prop Drilling", "lesson": "<p>Prop drilling is passing props through many intermediate components that do not use them.</p><ul><li>Makes components tightly coupled</li><li>Hard to maintain as trees grow</li><li>Solved by Context API or state libraries</li><li>A code smell in deep hierarchies</li></ul>", "code": "// App -> Page -> Sidebar -> Avatar (all pass user)\nconst user = { name: \"Jane\" };\nfunction Avatar(u){ return u.name; }\nconsole.log(\"Drilled user ->\", Avatar(user));", "lang": "js"}, {"id": 94, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Context API", "lesson": "<p>Context shares values across the component tree without prop drilling.</p><ul><li><code>createContext</code> creates a context</li><li><code>Provider</code> supplies a value</li><li><code>useContext</code> reads the value</li><li>Good for themes, auth, locale</li></ul>", "code": "// const Ctx = createContext()\nconst context = { theme: \"dark\" };\nfunction useContext(c){ return c; }\nconsole.log(useContext(context).theme);", "lang": "js"}, {"id": 95, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Redux", "lesson": "<p>Redux is a predictable state container with a single store.</p><ul><li><strong>Store</strong> — single source of truth</li><li><strong>Actions</strong> — describe what happened</li><li><strong>Reducers</strong> — compute new state</li><li>Hooks: <code>useSelector</code>, <code>useDispatch</code></li></ul>", "code": "function reducer(state, action) {\n  switch(action.type) {\n    case \"INC\": return { count: state.count + 1 };\n    default: return state;\n  }\n}\nconsole.log(reducer({count:0}, {type:\"INC\"}));", "lang": "js"}, {"id": 96, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Redux vs Context", "lesson": "<p>Both share state, but suit different scales.</p><ul><li><strong>Context</strong> — simple, low-frequency updates</li><li><strong>Redux</strong> — complex, frequent updates, large apps</li><li>Redux has DevTools and middleware</li><li>Context can cause re-renders if overused</li></ul>", "code": "console.log(\"Context: small, simple shared state\");\nconsole.log(\"Redux: large apps, devtools, middleware\");", "lang": "js"}, {"id": 97, "cat": "React", "icon": "⚛️", "catId": 4, "title": "React Hooks", "lesson": "<p>Hooks let functional components use state and other React features.</p><ul><li><code>useState</code> — local state</li><li><code>useEffect</code> — side effects</li><li><code>useContext</code>, <code>useRef</code>, <code>useMemo</code>, <code>useCallback</code></li><li>Custom hooks reuse stateful logic</li></ul>", "code": "const hooks = [\"useState\",\"useEffect\",\"useContext\",\"useRef\",\"useMemo\",\"useCallback\"];\nhooks.forEach(h => console.log(h));", "lang": "js"}, {"id": 98, "cat": "React", "icon": "⚛️", "catId": 4, "title": "useRef Hook", "lesson": "<p><code>useRef</code> returns a mutable object whose <code>.current</code> persists across renders without triggering re-renders.</p><ul><li>Access DOM nodes directly</li><li>Store mutable values between renders</li><li>Changing <code>.current</code> does not re-render</li><li>Useful for timers and previous values</li></ul>", "code": "// const ref = useRef(0)\nconst ref = { current: 0 };\nref.current = 42;\nconsole.log(\"ref.current =\", ref.current);", "lang": "js"}, {"id": 99, "cat": "React", "icon": "⚛️", "catId": 4, "title": "useMemo Hook", "lesson": "<p><code>useMemo</code> memoizes an expensive computed value, recalculating only when dependencies change.</p><ul><li>Caches a computed result</li><li>Recomputes only on dependency change</li><li>Avoids redundant heavy calculations</li><li>Do not overuse for cheap operations</li></ul>", "code": "function expensive(n){ console.log(\"computing...\"); return n*n; }\nlet cache = {};\nfunction useMemo(n){ return cache[n] ?? (cache[n]=expensive(n)); }\nconsole.log(useMemo(5));\nconsole.log(useMemo(5)); // cached", "lang": "js"}, {"id": 100, "cat": "React", "icon": "⚛️", "catId": 4, "title": "useCallback Hook", "lesson": "<p><code>useCallback</code> memoizes a function reference so it stays stable across renders.</p><ul><li>Returns the same function unless deps change</li><li>Prevents unnecessary child re-renders</li><li>Pairs with <code>React.memo</code></li><li>Useful when passing callbacks to children</li></ul>", "code": "// const fn = useCallback(() => doThing(), [])\nconst stableFn = () => \"same reference\";\nconsole.log(stableFn());\nconsole.log(\"Reference is reused across renders\");", "lang": "js"}, {"id": 101, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Lazy Loading (React)", "lesson": "<p><code>React.lazy</code> loads components only when needed, reducing the initial bundle.</p><ul><li><code>React.lazy(() =&gt; import('./Comp'))</code></li><li>Wrap in <code>&lt;Suspense&gt;</code> with a fallback</li><li>Improves initial load time</li><li>Often combined with code splitting</li></ul>", "code": "// const Comp = React.lazy(() => import(\"./Comp\"))\nfunction lazyLoad(){ return Promise.resolve(\"Loaded component\"); }\nlazyLoad().then(c => console.log(c));", "lang": "js"}, {"id": 102, "cat": "React", "icon": "⚛️", "catId": 4, "title": "React Router v6", "lesson": "<p>React Router enables client-side navigation in single-page apps.</p><ul><li><code>&lt;BrowserRouter&gt;</code> wraps the app</li><li><code>&lt;Routes&gt;</code> / <code>&lt;Route&gt;</code> define paths</li><li><code>&lt;Link&gt;</code> / <code>&lt;NavLink&gt;</code> navigate</li><li>Hooks: <code>useNavigate</code>, <code>useParams</code></li></ul>", "code": "const routes = { \"/\": \"Home\", \"/about\": \"About\", \"/users/:id\": \"User\" };\nObject.entries(routes).forEach(([p,c]) => console.log(p, \"->\", c));", "lang": "js"}, {"id": 103, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Controlled Components", "lesson": "<p>In a controlled component, React state is the single source of truth for form inputs.</p><ul><li><code>value={state}</code> binds the input</li><li><code>onChange</code> updates state</li><li>React fully controls the value</li><li>Enables validation and conditional logic</li></ul>", "code": "let state = \"\";\nfunction onChange(v){ state = v; console.log(\"state:\", state); }\nonChange(\"h\");\nonChange(\"hi\");", "lang": "js"}, {"id": 104, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Uncontrolled Components", "lesson": "<p>Uncontrolled components let the DOM hold the form state, accessed via a ref.</p><ul><li>Use <code>ref</code> to read <code>inputRef.current.value</code></li><li>Use <code>defaultValue</code> instead of <code>value</code></li><li>Less code for simple forms</li><li>Harder to validate on each keystroke</li></ul>", "code": "// const ref = useRef()\nconst inputRef = { current: { value: \"typed text\" } };\nconsole.log(\"Read on submit:\", inputRef.current.value);", "lang": "js"}, {"id": 105, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Lifting State Up", "lesson": "<p>When two components need the same data, move that state to their nearest common parent.</p><ul><li>Shared state lives in the common ancestor</li><li>Passed down as props</li><li>Children notify parent via callbacks</li><li>Keeps a single source of truth</li></ul>", "code": "let shared = 0;\nfunction childUpdate(v){ shared = v; console.log(\"parent state:\", shared); }\nchildUpdate(5);", "lang": "js"}, {"id": 106, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Higher-Order Components", "lesson": "<p>A HOC is a function that takes a component and returns an enhanced component.</p><ul><li>Pattern for reusing component logic</li><li><code>withAuth(Component)</code> wraps behavior</li><li>Does not modify the original component</li><li>Largely replaced by custom hooks</li></ul>", "code": "function withLog(Comp) {\n  return (props) => { console.log(\"rendering\"); return Comp(props); };\n}\nconst Hello = () => \"Hello\";\nconsole.log(withLog(Hello)());", "lang": "js"}, {"id": 107, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Custom Hooks", "lesson": "<p>Custom hooks extract reusable stateful logic into a function starting with \"use\".</p><ul><li>Can call other hooks inside</li><li>Share logic across components</li><li>Naming must start with <code>use</code></li><li>Example: <code>useFetch</code>, <code>useToggle</code></li></ul>", "code": "function useToggle(initial){\n  let state = initial;\n  const toggle = () => { state = !state; return state; };\n  return [state, toggle];\n}\nconst [on, toggle] = useToggle(false);\nconsole.log(toggle(), toggle());", "lang": "js"}, {"id": 108, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Strict Mode", "lesson": "<p><code>React.StrictMode</code> highlights potential problems during development.</p><ul><li>Detects unsafe lifecycles and side effects</li><li>Double-invokes some functions in dev only</li><li>No effect in production</li><li>Helps prepare for concurrent features</li></ul>", "code": "console.log(\"StrictMode: dev-only checks\");\nconsole.log(\"Double-invokes render to surface side effects\");", "lang": "js"}, {"id": 109, "cat": "React", "icon": "⚛️", "catId": 4, "title": "Server-Side Rendering", "lesson": "<p>SSR renders React components to HTML on the server before sending to the browser.</p><ul><li><code>ReactDOMServer.renderToString</code></li><li>Faster perceived initial load</li><li>Better SEO — crawlers see full HTML</li><li>Followed by hydration on the client</li></ul>", "code": "// ReactDOMServer.renderToString(<App/>)\nfunction renderToString(){ return \"<div id=root><h1>Hello</h1></div>\"; }\nconsole.log(renderToString());", "lang": "js"}, {"id": 110, "cat": "React", "icon": "⚛️", "catId": 4, "title": "CSR vs SSR", "lesson": "<p>Two rendering strategies with different trade-offs.</p><ul><li><strong>CSR</strong> — browser renders via JS; slower first paint, SEO harder</li><li><strong>SSR</strong> — server sends HTML; faster first paint, better SEO</li><li>CSR shifts work to the client</li><li>SSR adds server load but improves UX</li></ul>", "code": "console.log(\"CSR: JS builds the page in the browser\");\nconsole.log(\"SSR: server sends ready HTML, then hydrates\");", "lang": "js"}, {"id": 111, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "What is Node.js?", "lesson": "<p>Node.js is a runtime that executes JavaScript outside the browser using Chrome's V8 engine.</p><ul><li>Server-side JavaScript</li><li>Event-driven and non-blocking I/O</li><li>Single-threaded with an event loop</li><li>Great for scalable network apps</li></ul>", "code": "const os = \"Node runs JS on the server\";\nconsole.log(os);\nconsole.log(\"V8 engine, event-driven, non-blocking\");", "lang": "js"}, {"id": 112, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Why Use Node.js?", "lesson": "<p>Node is popular for building fast, scalable backend services.</p><ul><li>Fast non-blocking I/O</li><li>Huge npm ecosystem</li><li>Full-stack JavaScript (one language)</li><li>Ideal for real-time apps and microservices</li></ul>", "code": "const reasons = [\"fast I/O\",\"npm\",\"full-stack JS\",\"real-time\"];\nreasons.forEach(r => console.log(\"-\", r));", "lang": "js"}, {"id": 113, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "npm", "lesson": "<p>npm is the default package manager for Node.js.</p><ul><li><code>npm install pkg</code> adds dependencies</li><li><code>package.json</code> tracks them</li><li><code>devDependencies</code> for dev-only tools</li><li><code>npx</code> runs packages without installing globally</li></ul>", "code": "const pkg = { name:\"app\", dependencies:{ express:\"^4.0.0\" } };\nconsole.log(JSON.stringify(pkg, null, 2));", "lang": "js"}, {"id": 114, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "CommonJS vs ES Modules", "lesson": "<p>Node supports two module systems.</p><ul><li><strong>CommonJS</strong> — <code>require()</code> / <code>module.exports</code></li><li><strong>ES Modules</strong> — <code>import</code> / <code>export</code></li><li>ESM needs <code>.mjs</code> or <code>type: module</code></li><li>ESM is the modern standard</li></ul>", "code": "// CommonJS\n// const x = require(\"x\"); module.exports = y;\n// ES Modules\n// import x from \"x\"; export default y;\nconsole.log(\"Two module systems in Node\");", "lang": "js"}, {"id": 115, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Express.js", "lesson": "<p>Express is a minimal, flexible web framework for Node.</p><ul><li>Routing: <code>app.get</code>, <code>app.
