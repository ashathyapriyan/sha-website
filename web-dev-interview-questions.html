<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>200 Web Dev Interview Questions — sha.dev</title>
<meta name="description" content="200 web development interview questions with full answers and live code editors. HTML, CSS, JavaScript, React, Node.js, Databases, Security, APIs, DevOps and more." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f8f8f2;--text:#111;--muted:#555;--accent:#0f7a52;--accent2:#0a5e3e;
    --orange:#c07e1a;--card:#fff;--border:#e0e0d4;--side:#fbfbf6;--code:#1e2128;
  }
  body.dark{
    --bg:#15171c;--text:#e8e8e2;--muted:#9a9a92;--card:#1e2128;--border:#2c2f37;
    --side:#1a1c22;--code:#0d0f13;
  }
  html{scroll-behavior:smooth}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:inherit;text-decoration:none}

  nav{position:fixed;top:0;left:0;right:0;height:58px;z-index:100;
    background:var(--card);border-bottom:1px solid var(--border);
    display:flex;align-items:center;gap:18px;padding:0 18px}
  .logo{font-size:1.15rem;font-weight:800;color:var(--accent)}
  .logo span{color:var(--orange)}
  .nav-back{font-size:.85rem;color:var(--muted)}
  .nav-back:hover{color:var(--accent)}
  .nav-spacer{flex:1}
  .progress-wrap{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted)}
  .progress-bar{width:120px;height:7px;background:var(--border);border-radius:6px;overflow:hidden}
  .progress-fill{height:100%;width:0;background:var(--accent);transition:width .3s}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}

  .layout{display:flex;padding-top:58px;min-height:100vh}

  aside{width:280px;flex-shrink:0;background:var(--side);border-right:1px solid var(--border);
    position:fixed;top:58px;bottom:0;left:0;overflow-y:auto;padding:14px}
  .search-box{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;
    background:var(--card);color:var(--text);font-size:.85rem;margin-bottom:12px;font-family:inherit}
  .search-box:focus{outline:none;border-color:var(--accent)}
  .cat{margin-bottom:6px}
  .cat-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
    border-radius:8px;font-weight:700;font-size:.85rem;user-select:none}
  .cat-head:hover{background:var(--border)}
  .cat-head .chev{margin-left:auto;font-size:.7rem;transition:transform .2s;color:var(--muted)}
  .cat.open .chev{transform:rotate(90deg)}
  .cat-count{font-size:.7rem;color:var(--muted);font-weight:500}
  .q-list{display:none;flex-direction:column;margin:2px 0 6px 6px;border-left:1px solid var(--border)}
  .cat.open .q-list{display:flex}
  .q-item{padding:6px 10px 6px 14px;font-size:.8rem;color:var(--muted);cursor:pointer;
    border-radius:0 6px 6px 0;display:flex;align-items:flex-start;gap:6px;line-height:1.35}
  .q-item:hover{background:var(--border);color:var(--text)}
  .q-item.active{background:var(--accent);color:#fff;font-weight:600}
  .q-item .qid{font-variant-numeric:tabular-nums;opacity:.7;flex-shrink:0}
  .q-item.active .qid{opacity:.9}
  .q-item .check{margin-left:auto;color:var(--accent);flex-shrink:0;visibility:hidden}
  .q-item.done .check{visibility:visible}
  .q-item.active.done .check{color:#fff}

  main{margin-left:280px;flex:1;padding:32px 40px 80px;max-width:100%}
  .crumb{font-size:.78rem;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .crumb .ic{margin-right:6px}
  h1.q-title{font-size:1.7rem;font-weight:800;line-height:1.25;margin-bottom:18px;max-width:760px}
  .answer{max-width:760px;font-size:.98rem}
  .answer p{margin-bottom:12px}
  .answer ul,.answer ol{margin:0 0 14px 22px}
  .answer li{margin-bottom:5px}
  .answer code{background:var(--border);padding:2px 6px;border-radius:5px;font-size:.85em;
    font-family:ui-monospace,Menlo,Consolas,monospace}
  .answer strong{color:var(--accent)}
  body.dark .answer strong{color:#3ec98a}
  .answer table{border-collapse:collapse;margin:0 0 16px;width:100%;font-size:.88rem}
  .answer th,.answer td{border:1px solid var(--border);padding:7px 10px;text-align:left}
  .answer th{background:var(--border)}

  .editor-section{margin-top:26px;max-width:980px}
  .editor-label{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;margin-bottom:8px}
  .editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .editor-pane,.preview-pane{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--code)}
  .pane-head{font-size:.72rem;font-weight:600;color:#9aa;padding:6px 12px;
    background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.07);
    display:flex;align-items:center;justify-content:space-between}
  textarea.editor{width:100%;min-height:240px;background:var(--code);color:#e6e6e6;border:none;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem;line-height:1.55;
    padding:12px;resize:vertical}
  textarea.editor:focus{outline:none}
  .preview-pane{background:#fff}
  iframe.preview{width:100%;min-height:240px;border:none;background:#fff}
  .run-bar{margin-top:10px;display:flex;gap:10px;align-items:center}
  .btn{font-family:inherit;font-size:.83rem;font-weight:600;border:none;border-radius:8px;
    padding:9px 16px;cursor:pointer}
  .btn-run{background:var(--accent);color:#fff}
  .btn-run:hover{background:var(--accent2)}
  .btn-reset{background:var(--border);color:var(--text)}

  .nav-btns{display:flex;justify-content:space-between;gap:12px;margin-top:40px;max-width:980px}
  .navbtn{background:var(--card);border:1px solid var(--border);border-radius:10px;
    padding:12px 18px;cursor:pointer;font-family:inherit;font-size:.85rem;color:var(--text);
    display:flex;flex-direction:column;gap:2px;min-width:150px;text-align:left}
  .navbtn:hover{border-color:var(--accent)}
  .navbtn.next{text-align:right;align-items:flex-end}
  .navbtn .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .navbtn .ttl{font-weight:600;font-size:.85rem}
  .navbtn:disabled{opacity:.35;cursor:default}

  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn-done{background:var(--accent);color:#fff}
  .btn-done.is-done{background:var(--border);color:var(--text)}
  .btn-share{background:var(--card);border:1px solid var(--border);color:var(--text)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);
    color:#fff;padding:10px 20px;border-radius:10px;font-size:.85rem;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:200}
  .toast.show{opacity:1}

  .overlay{display:none;position:fixed;inset:58px 0 0;background:rgba(0,0,0,.4);z-index:90}
  .overlay.show{display:block}

  .hamburger{background:none;border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:8px;cursor:pointer;align-items:center;justify-content:center;font-size:1.1rem;display:none}

  @media(max-width:900px){
    aside{transform:translateX(-100%);transition:transform .25s;z-index:95;width:280px}
    aside.open{transform:translateX(0)}
    main{margin-left:0;padding:24px 18px 70px}
    .hamburger{display:flex}
    .editor-grid{grid-template-columns:1fr}
    .progress-wrap .ptext{display:none}
    .nav-back{display:none}
  }
</style>
</head>

<script>
const ICONS={HTML:"🧠",CSS:"🎨",JavaScript:"⚡",React:"⚛️","Node.js":"🟢",Databases:"🗄️",Security:"🔒",APIs:"🔌",DevOps:"🚀",Advanced:"🧩"};
const QUESTIONS=[
{id:1,category:"HTML",question:"What is HTML?",lang:"html",
answer:`<p><strong>HTML (HyperText Markup Language)</strong> is the standard markup language used to create the structure and content of web pages. It is not a programming language — it describes the structure of a document using <em>elements</em> made of <em>tags</em>.</p>
<ul><li><strong>HyperText</strong> – links that connect documents to each other.</li><li><strong>Markup</strong> – tags like <code>&lt;p&gt;</code>, <code>&lt;h1&gt;</code>, <code>&lt;div&gt;</code> that "mark up" content.</li></ul>
<p>The browser reads the HTML and <strong>renders</strong> it into the visual page you see. CSS adds styling and JavaScript adds behaviour, but HTML is always the foundation.</p>`,
code:`<!DOCTYPE html>\n<html>\n<body>\n  <h1>Hello World</h1>\n  <p>This is my first HTML page!</p>\n  <a href="#">A hyperlink</a>\n</body>\n</html>`},
{id:2,category:"HTML",question:"Difference between HTML4 and HTML5?",lang:"html",
answer:`<p><strong>HTML5</strong> is the modern version and introduced major improvements over HTML4:</p>
<table><tr><th>HTML4</th><th>HTML5</th></tr>
<tr><td>Long, complex doctype</td><td>Simple <code>&lt;!DOCTYPE html&gt;</code></td></tr>
<tr><td>No semantic tags</td><td><code>header, nav, footer, article, section</code></td></tr>
<tr><td>Needed Flash for media</td><td>Native <code>&lt;audio&gt;</code> & <code>&lt;video&gt;</code></td></tr>
<tr><td>No drawing API</td><td><code>&lt;canvas&gt;</code> & SVG</td></tr>
<tr><td>Only cookies</td><td>localStorage & sessionStorage</td></tr>
<tr><td>Basic form inputs</td><td>email, date, range, color inputs</td></tr></table>`,
code:`<!DOCTYPE html>\n<html>\n<body>\n  <header>HTML5 semantic header</header>\n  <video controls width="250">\n    <source src="movie.mp4" type="video/mp4">\n  </video>\n  <input type="email" placeholder="HTML5 email input">\n</body>\n</html>`},
{id:3,category:"HTML",question:"What are semantic tags in HTML5?",lang:"html",
answer:`<p><strong>Semantic tags</strong> describe their meaning to the browser and developer — unlike <code>&lt;div&gt;</code> which is generic. They improve <strong>accessibility</strong> and <strong>SEO</strong>.</p>
<ul><li><code>&lt;header&gt;</code> – top section / intro</li><li><code>&lt;nav&gt;</code> – navigation links</li><li><code>&lt;main&gt;</code> – main unique content</li><li><code>&lt;article&gt;</code> – self-contained content</li><li><code>&lt;section&gt;</code> – thematic grouping</li><li><code>&lt;aside&gt;</code> – sidebar / related content</li><li><code>&lt;figure&gt;</code> & <code>&lt;figcaption&gt;</code> – media with caption</li><li><code>&lt;footer&gt;</code> – bottom section</li></ul>`,
code:`<header><h1>My Blog</h1></header>\n<nav><a href="#">Home</a> <a href="#">About</a></nav>\n<main>\n  <article>\n    <h2>Post Title</h2>\n    <p>Article content here.</p>\n  </article>\n  <aside>Related links</aside>\n</main>\n<footer>© 2026 sha.dev</footer>`},
{id:4,category:"HTML",question:"div vs span?",lang:"html",
answer:`<p>Both are generic containers with no semantic meaning, but they differ in display:</p>
<ul><li><code>&lt;div&gt;</code> – a <strong>block-level</strong> element. Takes full width and starts on a new line. Used for layout sections/wrappers.</li><li><code>&lt;span&gt;</code> – an <strong>inline</strong> element. Flows within text and only takes as much width as its content. Used to style part of a line of text.</li></ul>`,
code:`<div style="background:#0f7a52;color:#fff;padding:8px">\n  I am a DIV (block, full width)\n</div>\n<p>This text has a \n  <span style="color:#c07e1a;font-weight:bold">SPAN</span>\n  inside it (inline).</p>`},
{id:5,category:"HTML",question:"Purpose of DOCTYPE?",lang:"html",
answer:`<p>The <code>&lt;!DOCTYPE html&gt;</code> declaration tells the browser <strong>which version of HTML</strong> the document uses. It must be the very first line.</p>
<ul><li>It triggers <strong>standards mode</strong> rendering.</li><li>Without it, browsers fall back to <strong>quirks mode</strong>, emulating old buggy behaviour and breaking layouts.</li><li>In HTML5 it is short and version-less: <code>&lt;!DOCTYPE html&gt;</code>.</li></ul>`,
code:`<!DOCTYPE html>\n<html>\n<head><title>Standards Mode</title></head>\n<body>\n  <p>This page renders in standards mode.</p>\n</body>\n</html>`},
{id:6,category:"HTML",question:"What are meta tags?",lang:"html",
answer:`<p><strong>Meta tags</strong> live inside <code>&lt;head&gt;</code> and provide metadata about the page (not visible content) used by browsers, search engines and social platforms.</p>
<ul><li><code>charset</code> – character encoding (UTF-8).</li><li><code>viewport</code> – responsive scaling on mobile.</li><li><code>description</code> – SEO snippet shown in search results.</li><li><code>keywords</code> – legacy SEO keywords.</li><li><code>og:*</code> (Open Graph) – preview cards on social media.</li></ul>`,
code:`<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <meta name="description" content="Learn web dev with sha.dev">\n  <meta property="og:title" content="200 Interview Questions">\n</head>`},
{id:7,category:"HTML",question:"ID vs Class?",lang:"css",
answer:`<table><tr><th>ID</th><th>Class</th></tr>
<tr><td>Unique — one per page</td><td>Reusable — many elements</td></tr>
<tr><td>Selected with <code>#name</code></td><td>Selected with <code>.name</code></td></tr>
<tr><td>Higher CSS specificity (100)</td><td>Lower specificity (10)</td></tr>
<tr><td><code>getElementById()</code></td><td><code>getElementsByClassName()</code></td></tr></table>
<p>Use <strong>classes</strong> for styling and IDs for unique anchors/JS hooks.</p>`,
code:`<style>\n  #header { color: #0f7a52; }   /* unique */\n  .box { background:#eee; padding:8px } /* reusable */\n</style>\n<h1 id="header">Unique ID</h1>\n<div class="box">Box 1</div>\n<div class="box">Box 2</div>`},
{id:8,category:"HTML",question:"Inline vs block elements?",lang:"html",
answer:`<ul><li><strong>Block elements</strong> start on a new line and take the full available width. Examples: <code>div, p, h1-h6, ul, section, header</code>.</li><li><strong>Inline elements</strong> stay in the text flow and only take the width of their content. Examples: <code>span, a, strong, em, img, b</code>.</li></ul>
<p>You can switch them with the CSS <code>display</code> property (e.g. <code>display:inline-block</code>).</p>`,
code:`<p>Block elements:</p>\n<div style="background:#cde">Block 1</div>\n<div style="background:#dec">Block 2</div>\n<p>Inline: <span style="background:#cde">A</span>\n<span style="background:#dec">B</span></p>`},
{id:9,category:"HTML",question:"Forms in HTML?",lang:"html",
answer:`<p>The <code>&lt;form&gt;</code> element collects user input and submits it to a server.</p>
<ul><li><code>action</code> – URL the data is sent to.</li><li><code>method</code> – GET or POST.</li><li>Inputs: <code>text, email, password, checkbox, radio, number, date, file</code>.</li><li>Built-in validation: <code>required, minlength, pattern, type="email"</code>.</li></ul>`,
code:`<form action="/submit" method="post">\n  <label>Name: <input type="text" required></label><br>\n  <label>Email: <input type="email" required></label><br>\n  <label>Age: <input type="number" min="1"></label><br>\n  <button type="submit">Send</button>\n</form>`},
{id:10,category:"HTML",question:"GET vs POST?",lang:"none",
answer:`<table><tr><th>GET</th><th>POST</th></tr>
<tr><td>Data in URL query string</td><td>Data in request body</td></tr>
<tr><td>Visible & bookmarkable</td><td>Hidden from URL</td></tr>
<tr><td>Limited length (~2KB)</td><td>No practical size limit</td></tr>
<tr><td>Cacheable</td><td>Not cached</td></tr>
<tr><td>For reading/idempotent</td><td>For creating/changing data</td></tr></table>
<p>Never send passwords or sensitive data with GET.</p>`,
code:`// GET — params in URL\nfetch('/search?q=react');\n\n// POST — data in body\nfetch('/login', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ user: 'sha', pass: 'secret' })\n});`},
{id:11,category:"HTML",question:"localStorage vs sessionStorage?",lang:"js",
answer:`<p>Both store key-value string pairs in the browser (~5-10 MB), but differ in lifetime:</p>
<ul><li><strong>localStorage</strong> – persists <em>forever</em> until manually cleared. Shared across all tabs of the same origin.</li><li><strong>sessionStorage</strong> – lasts only for the <em>tab session</em>. Cleared when the tab closes and is not shared between tabs.</li></ul>`,
code:`// localStorage – persists\nlocalStorage.setItem('theme', 'dark');\nconsole.log(localStorage.getItem('theme'));\n\n// sessionStorage – per tab\nsessionStorage.setItem('step', '2');\nconsole.log(sessionStorage.getItem('step'));`},
{id:12,category:"HTML",question:"What are data attributes?",lang:"js",
answer:`<p><strong>Custom data attributes</strong> (<code>data-*</code>) let you store extra information on any HTML element. They are read in JavaScript via the <code>dataset</code> API.</p>
<ul><li>Must start with <code>data-</code> followed by a lowercase name.</li><li><code>data-user-id</code> becomes <code>element.dataset.userId</code> (camelCase).</li><li>Useful for passing data to JS without globals.</li></ul>`,
code:`<button id="b" data-user-id="42" data-role="admin">Click</button>\n<script>\n  const b = document.getElementById('b');\n  document.body.innerHTML += b.dataset.userId + ' / ' + b.dataset.role;\n<\/script>`},
{id:13,category:"HTML",question:"What is an iframe?",lang:"html",
answer:`<p>An <code>&lt;iframe&gt;</code> (inline frame) embeds another HTML document inside the current page — e.g. YouTube videos, maps, or ads.</p>
<ul><li><strong>Security concern:</strong> external content can be malicious, so use the <code>sandbox</code> attribute to restrict scripts, forms and popups.</li><li>Same-origin policy prevents JS from freely accessing cross-origin iframe content.</li></ul>`,
code:`<iframe \n  srcdoc="<h2 style='color:#0f7a52'>Embedded page!</h2>"\n  sandbox="allow-scripts"\n  width="100%" height="120">\n</iframe>`},
{id:14,category:"HTML",question:"Cookies vs localStorage?",lang:"none",
answer:`<table><tr><th>Cookies</th><th>localStorage</th></tr>
<tr><td>~4 KB limit</td><td>~5-10 MB limit</td></tr>
<tr><td>Sent to server on every request</td><td>Stays only in browser</td></tr>
<tr><td>Has expiry date</td><td>No expiry (manual)</td></tr>
<tr><td>Good for auth/sessions</td><td>Good for app data/preferences</td></tr></table>`,
code:`// Cookie (sent to server)\ndocument.cookie = "token=abc; max-age=3600; path=/";\n\n// localStorage (client only)\nlocalStorage.setItem('lang', 'en');`},
{id:15,category:"HTML",question:"What are void elements?",lang:"html",
answer:`<p><strong>Void (empty) elements</strong> have no closing tag and cannot contain children. They are self-closing.</p>
<p>Common void elements: <code>&lt;br&gt;</code>, <code>&lt;hr&gt;</code>, <code>&lt;img&gt;</code>, <code>&lt;input&gt;</code>, <code>&lt;meta&gt;</code>, <code>&lt;link&gt;</code>, <code>&lt;area&gt;</code>, <code>&lt;source&gt;</code>.</p>`,
code:`<img src="logo.png" alt="logo">\nLine one<br>Line two\n<hr>\n<input type="text" placeholder="no closing tag">`},
{id:16,category:"HTML",question:"The alt attribute?",lang:"html",
answer:`<p>The <code>alt</code> attribute on <code>&lt;img&gt;</code> provides <strong>alternative text</strong>:</p>
<ul><li><strong>Accessibility</strong> – screen readers read it aloud for blind users.</li><li><strong>Broken images</strong> – shown if the image fails to load.</li><li><strong>SEO</strong> – search engines use it to understand images.</li></ul>
<p>Decorative images should use empty <code>alt=""</code>.</p>`,
code:`<img src="broken-link.png" alt="A green sha.dev logo">\n<!-- If the image fails, the alt text shows -->`},
{id:17,category:"HTML",question:"Audio and video tags?",lang:"html",
answer:`<p>HTML5 added native media playback without plugins:</p>
<ul><li><code>controls</code> – show play/pause UI.</li><li><code>autoplay</code> – start automatically (often muted is required).</li><li><code>loop</code> – repeat.</li><li><code>&lt;source&gt;</code> – provide multiple formats (mp4, webm, ogg).</li></ul>`,
code:`<audio controls>\n  <source src="song.mp3" type="audio/mpeg">\n  Your browser does not support audio.\n</audio>\n\n<video controls width="250" loop muted>\n  <source src="clip.mp4" type="video/mp4">\n</video>`},
{id:18,category:"HTML",question:"Accessibility in HTML?",lang:"html",
answer:`<p><strong>Accessibility (a11y)</strong> means building pages usable by everyone, including people with disabilities.</p>
<ul><li>Use <strong>semantic HTML</strong> so screen readers understand structure.</li><li>Always provide <code>alt</code> text and form <code>&lt;label&gt;</code>s.</li><li>Ensure <strong>keyboard navigation</strong> (tab order, focus states).</li><li>Maintain sufficient <strong>colour contrast</strong>.</li><li>Add ARIA attributes where native semantics are missing.</li></ul>`,
code:`<label for="email">Email</label>\n<input id="email" type="email">\n\n<button aria-label="Close menu">✕</button>\n<img src="chart.png" alt="Sales rose 20% in Q1">`},
{id:19,category:"HTML",question:"ARIA attributes?",lang:"html",
answer:`<p><strong>ARIA (Accessible Rich Internet Applications)</strong> attributes add accessibility info to elements when native HTML isn't enough (e.g. custom widgets).</p>
<ul><li><code>role</code> – defines what an element is (<code>role="button"</code>).</li><li><code>aria-label</code> – accessible name for icon-only elements.</li><li><code>aria-hidden="true"</code> – hide decorative content from screen readers.</li><li><code>aria-expanded</code> – open/closed state of dropdowns.</li></ul>`,
code:`<div role="button" tabindex="0" aria-label="Play video">▶</div>\n<span aria-hidden="true">🎨</span>\n<button aria-expanded="false">Menu</button>`},
{id:20,category:"HTML",question:"strong vs b?",lang:"html",
answer:`<p>Both render bold text but differ in <strong>meaning</strong>:</p>
<ul><li><code>&lt;strong&gt;</code> – <strong>semantic</strong> importance; screen readers may emphasise it.</li><li><code>&lt;b&gt;</code> – purely <strong>visual</strong> bold with no added importance.</li></ul>
<p>Same applies to <code>&lt;em&gt;</code> (semantic emphasis) vs <code>&lt;i&gt;</code> (visual italic). Prefer semantic tags.</p>`,
code:`<p><strong>This is important</strong> (semantic)</p>\n<p><b>This is just bold</b> (visual only)</p>`},

{id:21,category:"CSS",question:"What is CSS?",lang:"css",
answer:`<p><strong>CSS (Cascading Style Sheets)</strong> is the language used to style and lay out HTML. It controls colours, fonts, spacing, positioning, animations and responsiveness.</p>
<p>"Cascading" means rules cascade and combine, with conflicts resolved by <strong>specificity</strong> and source order. CSS separates presentation from structure.</p>`,
code:`<style>\n  h1 { color: #0f7a52; font-family: sans-serif; }\n  p  { background: #f0f0e8; padding: 10px; border-radius: 8px; }\n</style>\n<h1>Styled with CSS</h1>\n<p>This paragraph has a background and padding.</p>`},
{id:22,category:"CSS",question:"Inline vs internal vs external CSS?",lang:"css",
answer:`<ul><li><strong>Inline</strong> – <code>style</code> attribute on an element. Highest specificity, hard to maintain.</li><li><strong>Internal</strong> – <code>&lt;style&gt;</code> block in the <code>&lt;head&gt;</code>. Page-specific.</li><li><strong>External</strong> – separate <code>.css</code> file linked with <code>&lt;link&gt;</code>. Reusable & cacheable — the recommended approach.</li></ul>`,
code:`<!-- Inline -->\n<p style="color:red">Inline</p>\n\n<!-- Internal -->\n<style> p { color: green; } </style>\n\n<!-- External -->\n<link rel="stylesheet" href="styles.css">`},
{id:23,category:"CSS",question:"CSS Specificity?",lang:"css",
answer:`<p><strong>Specificity</strong> decides which conflicting rule wins. Calculated as (inline, IDs, classes, elements):</p>
<ul><li>Inline style → 1000</li><li>ID <code>#id</code> → 100</li><li>Class/attribute/pseudo-class <code>.cls</code> → 10</li><li>Element/pseudo-element <code>div</code> → 1</li></ul>
<p>Higher total wins. Ties are broken by source order (later wins). <code>!important</code> overrides all.</p>`,
code:`<style>\n  p { color: gray; }        /* 1 */\n  .text { color: blue; }    /* 10 */\n  #para { color: green; }   /* 100 wins */\n</style>\n<p id="para" class="text">What colour am I?</p>`},
{id:24,category:"CSS",question:"The CSS Box Model?",lang:"css",
answer:`<p>Every element is a box made of four layers (inside-out):</p>
<ul><li><strong>Content</strong> – text/image.</li><li><strong>Padding</strong> – space inside, around content.</li><li><strong>Border</strong> – edge around padding.</li><li><strong>Margin</strong> – space outside, between elements.</li></ul>
<p>With <code>box-sizing:border-box</code> the width includes padding + border, which is more intuitive.</p>`,
code:`<style>\n  .box {\n    width: 200px; padding: 20px;\n    border: 5px solid #0f7a52;\n    margin: 15px; background: #d6efe4;\n    box-sizing: border-box;\n  }\n</style>\n<div class="box">Box model demo</div>`},
{id:25,category:"CSS",question:"Margin vs padding?",lang:"css",
answer:`<ul><li><strong>Margin</strong> – space <em>outside</em> the border; pushes other elements away. Margins can collapse vertically.</li><li><strong>Padding</strong> – space <em>inside</em> the border, between content and edge; part of the clickable/background area.</li></ul>`,
code:`<style>\n  .pad { padding: 25px; background:#cce; }\n  .mar { margin: 25px; background:#ecc; }\n</style>\n<div class="pad">Padding (inside)</div>\n<div class="mar">Margin (outside)</div>`},
{id:26,category:"CSS",question:"What is Flexbox?",lang:"css",
answer:`<p><strong>Flexbox</strong> is a one-dimensional layout system for arranging items in a row or column.</p>
<ul><li><code>display:flex</code> on the container.</li><li><code>flex-direction</code> – row | column.</li><li><code>justify-content</code> – aligns along the <strong>main axis</strong>.</li><li><code>align-items</code> – aligns along the <strong>cross axis</strong>.</li><li><code>gap</code> – spacing between items.</li></ul>`,
code:`<style>\n  .flex {\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    gap: 10px; background:#eee; padding:10px;\n  }\n  .flex div { background:#0f7a52; color:#fff; padding:14px; }\n</style>\n<div class="flex"><div>1</div><div>2</div><div>3</div></div>`},
{id:27,category:"CSS",question:"What is CSS Grid?",lang:"css",
answer:`<p><strong>CSS Grid</strong> is a two-dimensional layout system (rows AND columns) — ideal for page layouts.</p>
<ul><li><code>display:grid</code></li><li><code>grid-template-columns: 1fr 1fr 1fr</code> – three equal columns.</li><li><code>grid-gap / gap</code> – spacing.</li><li><code>grid-area</code> / named areas for complex layouts.</li></ul>`,
code:`<style>\n  .grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 8px;\n  }\n  .grid div { background:#c07e1a; color:#fff; padding:18px; text-align:center; }\n</style>\n<div class="grid">\n  <div>A</div><div>B</div><div>C</div>\n  <div>D</div><div>E</div><div>F</div>\n</div>`},
{id:28,category:"CSS",question:"CSS Positioning?",lang:"css",
answer:`<ul><li><strong>static</strong> – default, normal flow.</li><li><strong>relative</strong> – offset relative to its normal position; keeps space.</li><li><strong>absolute</strong> – removed from flow, positioned relative to nearest positioned ancestor.</li><li><strong>fixed</strong> – relative to the viewport; stays on scroll.</li><li><strong>sticky</strong> – relative until a scroll threshold, then fixed.</li></ul>`,
code:`<style>\n  .rel { position: relative; height:100px; background:#eee; }\n  .abs { position: absolute; top:10px; right:10px;\n         background:#0f7a52; color:#fff; padding:6px; }\n</style>\n<div class="rel">Relative parent\n  <div class="abs">Absolute child</div>\n</div>`},
{id:29,category:"CSS",question:"What is z-index?",lang:"css",
answer:`<p><strong>z-index</strong> controls the stacking order of overlapping elements along the z-axis. Higher values appear in front.</p>
<ul><li>Only works on <strong>positioned</strong> elements (relative, absolute, fixed, sticky).</li><li>Creates a <strong>stacking context</strong>; children are stacked within their parent's context.</li></ul>`,
code:`<style>\n  .a,.b { position:absolute; width:80px; height:80px; }\n  .a { background:#0f7a52; z-index:1; }\n  .b { background:#c07e1a; left:40px; top:40px; z-index:2; }\n</style>\n<div class="a"></div><div class="b"></div>`},
{id:30,category:"CSS",question:"em, rem, %, px, vh, vw units?",lang:"css",
answer:`<ul><li><strong>px</strong> – absolute pixels.</li><li><strong>em</strong> – relative to the <em>parent's</em> font-size.</li><li><strong>rem</strong> – relative to the <em>root</em> (<code>html</code>) font-size — predictable.</li><li><strong>%</strong> – relative to the parent's size.</li><li><strong>vh / vw</strong> – 1% of the viewport height / width.</li></ul>`,
code:`<style>\n  html { font-size:16px; }\n  .px  { font-size:24px; }\n  .rem { font-size:2rem; }   /* 32px */\n  .vw  { width:50vw; background:#0f7a52; color:#fff; }\n</style>\n<p class="px">px</p><p class="rem">rem</p>\n<div class="vw">50vw wide</div>`},
{id:31,category:"CSS",question:"Pseudo-classes?",lang:"css",
answer:`<p><strong>Pseudo-classes</strong> select elements based on state or position, written with a single colon.</p>
<ul><li><code>:hover</code> – mouse over.</li><li><code>:focus</code> – focused input.</li><li><code>:nth-child(n)</code> – nth element.</li><li><code>:not(sel)</code> – everything except.</li><li><code>:first-child / :last-child</code></li></ul>`,
code:`<style>\n  li:hover { color:#0f7a52; }\n  li:nth-child(odd) { background:#f0f0e8; }\n  li:first-child { font-weight:bold; }\n</style>\n<ul><li>One</li><li>Two</li><li>Three</li><li>Four</li></ul>`},
{id:32,category:"CSS",question:"Pseudo-elements?",lang:"css",
answer:`<p><strong>Pseudo-elements</strong> style a specific part of an element, written with a double colon <code>::</code>.</p>
<ul><li><code>::before / ::after</code> – insert generated content (need <code>content</code>).</li><li><code>::placeholder</code> – style input placeholder text.</li><li><code>::selection</code> – style highlighted text.</li><li><code>::first-line / ::first-letter</code></li></ul>`,
code:`<style>\n  .quote::before { content:"\\201C "; color:#c07e1a; }\n  .quote::after  { content:" \\201D"; color:#c07e1a; }\n  p::first-letter { font-size:2em; color:#0f7a52; }\n</style>\n<p class="quote">Styled with pseudo-elements.</p>`},
{id:33,category:"CSS",question:"visibility:hidden vs display:none?",lang:"css",
answer:`<ul><li><code>visibility:hidden</code> – element is invisible but <strong>still occupies space</strong>.</li><li><code>display:none</code> – element is <strong>removed</strong> from layout entirely; no space reserved and not read by most screen readers.</li></ul>`,
code:`<style>\n  .hide-v { visibility:hidden; }\n  .hide-d { display:none; }\n  div { background:#0f7a52;color:#fff;padding:6px;margin:3px }\n</style>\n<div>Visible</div>\n<div class="hide-v">visibility:hidden (space stays)</div>\n<div class="hide-d">display:none (gone)</div>\n<div>After</div>`},
{id:34,category:"CSS",question:"Media queries?",lang:"css",
answer:`<p><strong>Media queries</strong> apply CSS conditionally based on device characteristics like screen width — the core of responsive design.</p>
<ul><li><code>@media (max-width: 600px)</code> – styles for small screens.</li><li><code>@media (min-width: 768px)</code> – mobile-first approach.</li><li>Common breakpoints: 480, 768, 1024, 1200px.</li></ul>`,
code:`<style>\n  .box { background:#0f7a52; color:#fff; padding:20px; }\n  @media (max-width: 500px) {\n    .box { background:#c07e1a; }\n  }\n</style>\n<div class="box">Resize me — I turn orange when narrow!</div>`},
{id:35,category:"CSS",question:"Responsive design?",lang:"css",
answer:`<p><strong>Responsive design</strong> makes pages adapt to any screen size. Three pillars:</p>
<ul><li><strong>Fluid grids</strong> – widths in % / fr / flex instead of fixed px.</li><li><strong>Flexible images</strong> – <code>max-width:100%</code>.</li><li><strong>Media queries</strong> – adjust layout at breakpoints.</li></ul>
<p>Always include the viewport meta tag.</p>`,
code:`<style>\n  img { max-width:100%; height:auto; }\n  .row { display:flex; flex-wrap:wrap; gap:10px; }\n  .row > div { flex:1 1 150px; background:#0f7a52;color:#fff;padding:14px; }\n</style>\n<div class="row"><div>A</div><div>B</div><div>C</div></div>`},
{id:36,category:"CSS",question:"Mobile-first design?",lang:"css",
answer:`<p><strong>Mobile-first</strong> means writing base styles for small screens, then adding complexity for larger screens with <code>min-width</code> media queries.</p>
<ul><li>Better performance — mobile loads minimal CSS.</li><li>Forces prioritising essential content.</li><li>Progressive enhancement instead of graceful degradation.</li></ul>`,
code:`<style>\n  .nav { display:block; }\n  @media (min-width: 768px) {\n    .nav { display:flex; gap:20px; }\n  }\n</style>\n<div class="nav"><span>Home</span><span>About</span></div>`},
{id:37,category:"CSS",question:"CSS transitions?",lang:"css",
answer:`<p><strong>Transitions</strong> smoothly animate a property change over time.</p>
<ul><li><code>transition: property duration timing-function delay;</code></li><li>Timing functions: <code>ease, linear, ease-in-out, cubic-bezier()</code>.</li></ul>`,
code:`<style>\n  .btn {\n    background:#0f7a52; color:#fff; padding:12px 20px;\n    transition: all 0.4s ease;\n  }\n  .btn:hover {\n    background:#c07e1a; transform: scale(1.1);\n  }\n</style>\n<button class="btn">Hover me</button>`},
{id:38,category:"CSS",question:"Transition vs animation?",lang:"css",
answer:`<ul><li><strong>Transition</strong> – animates <em>between two states</em> and needs a trigger (e.g. hover). One-shot.</li><li><strong>Animation</strong> – uses <code>@keyframes</code> with multiple steps, can run automatically, <strong>loop</strong>, and play without interaction.</li></ul>`,
code:`<style>\n  @keyframes spin { to { transform: rotate(360deg); } }\n  .loader {\n    width:40px; height:40px; border:5px solid #eee;\n    border-top-color:#0f7a52; border-radius:50%;\n    animation: spin 1s linear infinite;\n  }\n</style>\n<div class="loader"></div>`},
{id:39,category:"CSS",question:"CSS Transform?",lang:"css",
answer:`<p><strong>transform</strong> changes an element's shape/position without affecting layout flow.</p>
<ul><li><code>translate(x,y)</code> – move.</li><li><code>rotate(deg)</code> – spin.</li><li><code>scale(n)</code> – resize.</li><li><code>skew(deg)</code> – slant.</li></ul>
<p>Transforms are GPU-accelerated and great for performance.</p>`,
code:`<style>\n  div { width:80px;height:80px;background:#0f7a52;color:#fff;margin:20px; display:inline-flex;align-items:center;justify-content:center }\n  .r { transform: rotate(20deg); }\n  .s { transform: scale(1.3); }\n  .k { transform: skewX(15deg); }\n</style>\n<div class="r">rot</div><div class="s">scale</div><div class="k">skew</div>`},
{id:40,category:"CSS",question:"Overflow property?",lang:"css",
answer:`<p><strong>overflow</strong> controls what happens when content is bigger than its box.</p>
<ul><li><code>visible</code> – content spills out (default).</li><li><code>hidden</code> – clipped, no scrollbar.</li><li><code>scroll</code> – always shows scrollbars.</li><li><code>auto</code> – scrollbar only when needed.</li></ul>`,
code:`<style>\n  .box { width:160px; height:70px; border:2px solid #0f7a52; overflow:auto; }\n</style>\n<div class="box">\n  This is a lot of text that overflows the small box so a scrollbar appears thanks to overflow:auto.\n</div>`},
{id:41,category:"CSS",question:"CSS inheritance?",lang:"css",
answer:`<p>Some CSS properties are <strong>inherited</strong> by child elements automatically, others are not.</p>
<ul><li><strong>Inherited:</strong> <code>color, font-family, font-size, line-height, visibility</code>.</li><li><strong>Not inherited:</strong> <code>margin, padding, border, background, width</code>.</li><li>Force with <code>inherit</code>, or reset with <code>initial</code>.</li></ul>`,
code:`<style>\n  .parent { color:#0f7a52; font-family:monospace; }\n</style>\n<div class="parent">\n  Parent\n  <p>Child inherits green monospace text</p>\n</div>`},
{id:42,category:"CSS",question:"The !important rule?",lang:"css",
answer:`<p><code>!important</code> overrides <strong>all other declarations</strong> regardless of specificity. It should be used sparingly because it breaks the natural cascade and is hard to override.</p>
<p>Only an <code>!important</code> rule with higher specificity (or a later one) can beat another <code>!important</code>.</p>`,
code:`<style>\n  p { color: green !important; }\n  #x { color: red; }   /* loses to !important */\n</style>\n<p id="x">I am green because of !important</p>`},
{id:43,category:"CSS",question:"CSS preprocessors?",lang:"none",
answer:`<p><strong>Preprocessors</strong> (SASS/SCSS, LESS) extend CSS with programming features, compiled into plain CSS.</p>
<ul><li><strong>Variables</strong> – reusable values.</li><li><strong>Nesting</strong> – mirror HTML structure.</li><li><strong>Mixins</strong> – reusable rule blocks.</li><li><strong>Functions & math</strong>.</li></ul>`,
code:`// SCSS example (compiles to CSS)\n$primary: #0f7a52;\n\n.card {\n  color: $primary;\n  .title { font-weight: bold; } // nesting\n  &:hover { opacity: 0.8; }     // parent ref\n}`},
{id:44,category:"CSS",question:"SCSS vs SASS?",lang:"none",
answer:`<p>Both are syntaxes of the Sass preprocessor:</p>
<ul><li><strong>SASS</strong> – older, indentation-based, no braces or semicolons.</li><li><strong>SCSS</strong> – newer, CSS-like with braces <code>{}</code> and semicolons. Any valid CSS is valid SCSS, so it's more popular.</li></ul>`,
code:`// SASS (indented)\n.box\n  color: red\n  font-size: 14px\n\n// SCSS (CSS-like)\n.box {\n  color: red;\n  font-size: 14px;\n}`},
{id:45,category:"CSS",question:"What is Bootstrap?",lang:"html",
answer:`<p><strong>Bootstrap</strong> is a popular CSS framework that provides ready-made, responsive components and a 12-column grid system, letting you build UIs fast.</p>
<ul><li><strong>Grid:</strong> <code>container, row, col-*</code>.</li><li>Pre-styled components: buttons, navbars, cards, modals.</li><li>Utility classes for spacing, colours, flex.</li></ul>`,
code:`<!-- Bootstrap grid concept -->\n<div class="container">\n  <div class="row">\n    <div class="col-6">Half</div>\n    <div class="col-6">Half</div>\n  </div>\n  <button class="btn btn-primary">Bootstrap button</button>\n</div>`},

{id:46,category:"JavaScript",question:"What is JavaScript?",lang:"js",
answer:`<p><strong>JavaScript</strong> is a high-level, interpreted, dynamically-typed scripting language that adds interactivity and behaviour to web pages. It runs in the browser (and on servers via Node.js).</p>
<ul><li>Single-threaded with an event loop (async).</li><li>Multi-paradigm: functional, object-oriented, event-driven.</li><li>The only language natively understood by browsers.</li></ul>`,
code:`document.body.innerHTML = "<h2>Hello from JS!</h2>";\nlet sum = 0;\nfor (let i = 1; i <= 5; i++) sum += i;\nconsole.log("Sum 1..5 =", sum);\ndocument.body.innerHTML += "Sum = " + sum;`},
{id:47,category:"JavaScript",question:"var, let, const?",lang:"js",
answer:`<table><tr><th></th><th>var</th><th>let</th><th>const</th></tr>
<tr><td>Scope</td><td>function</td><td>block</td><td>block</td></tr>
<tr><td>Reassign</td><td>yes</td><td>yes</td><td>no</td></tr>
<tr><td>Hoisting</td><td>yes (undefined)</td><td>TDZ</td><td>TDZ</td></tr>
<tr><td>Redeclare</td><td>yes</td><td>no</td><td>no</td></tr></table>
<p>Use <code>const</code> by default, <code>let</code> when reassigning, avoid <code>var</code>.</p>`,
code:`const PI = 3.14;\nlet count = 0;\ncount++;\nconsole.log(PI, count);\nif (true) { let x = 1; }\nconsole.log("const & let are block-scoped");`},
{id:48,category:"JavaScript",question:"JavaScript data types?",lang:"js",
answer:`<p>JS has <strong>7 primitive types</strong> plus objects:</p>
<ul><li><strong>string, number, boolean</strong></li><li><strong>null</strong> – intentional empty.</li><li><strong>undefined</strong> – not assigned.</li><li><strong>symbol</strong> – unique identifier.</li><li><strong>bigint</strong> – huge integers.</li><li><strong>object</strong> – arrays, functions, objects (reference type).</li></ul>`,
code:`console.log(typeof "hi");      // string\nconsole.log(typeof 42);        // number\nconsole.log(typeof true);      // boolean\nconsole.log(typeof undefined); // undefined\nconsole.log(typeof null);      // object (quirk!)\nconsole.log(typeof {});        // object\nconsole.log(typeof 10n);       // bigint`},
{id:49,category:"JavaScript",question:"null vs undefined?",lang:"js",
answer:`<ul><li><strong>undefined</strong> – a variable declared but not assigned, or a missing property/return. Set by JS.</li><li><strong>null</strong> – an intentional "no value" assigned by the developer.</li></ul>
<p><code>null == undefined</code> is <code>true</code> (loose) but <code>null === undefined</code> is <code>false</code>.</p>`,
code:`let a;\nconsole.log(a);            // undefined\nlet b = null;\nconsole.log(b);            // null\nconsole.log(null == undefined);  // true\nconsole.log(null === undefined); // false`},
{id:50,category:"JavaScript",question:"What is hoisting?",lang:"js",
answer:`<p><strong>Hoisting</strong> moves variable and function <em>declarations</em> to the top of their scope during compilation.</p>
<ul><li><code>var</code> is hoisted and initialised to <code>undefined</code>.</li><li><code>let/const</code> are hoisted but in the <strong>Temporal Dead Zone</strong> — using them early throws an error.</li><li>Function declarations are fully hoisted (callable before definition).</li></ul>`,
code:`console.log(x); // undefined (var hoisted)\nvar x = 5;\n\ngreet();        // works! function hoisted\nfunction greet() { console.log("Hi"); }`},
{id:51,category:"JavaScript",question:"Scope in JavaScript?",lang:"js",
answer:`<p><strong>Scope</strong> determines where variables are accessible.</p>
<ul><li><strong>Global</strong> – accessible everywhere.</li><li><strong>Function</strong> – inside a function only.</li><li><strong>Block</strong> – inside <code>{}</code> for let/const.</li><li><strong>Lexical scope</strong> – inner functions can access variables of outer functions where they were defined.</li></ul>`,
code:`let g = "global";\nfunction outer() {\n  let o = "outer";\n  function inner() {\n    console.log(g, o); // lexical access\n  }\n  inner();\n}\nouter();`},
{id:52,category:"JavaScript",question:"What is a closure?",lang:"js",
answer:`<p>A <strong>closure</strong> is a function that "remembers" the variables from its outer (lexical) scope even after that outer function has finished executing.</p>
<p>Used for data privacy, factories, and maintaining state (e.g. counters).</p>`,
code:`function makeCounter() {\n  let count = 0;          // private\n  return function() {\n    count++;\n    return count;\n  };\n}\nconst c = makeCounter();\nconsole.log(c(), c(), c()); // 1 2 3`},
{id:53,category:"JavaScript",question:"What is a callback function?",lang:"js",
answer:`<p>A <strong>callback</strong> is a function passed as an argument to another function, to be executed later — often after an async operation completes.</p>
<p>They power event handlers, timers and array methods. Nesting many callbacks creates "callback hell", solved by Promises/async-await.</p>`,
code:`function greet(name, callback) {\n  console.log("Hi " + name);\n  callback();\n}\ngreet("Sha", function() {\n  console.log("Callback executed!");\n});\n\n[1,2,3].forEach(n => console.log(n)); // callback`},
{id:54,category:"JavaScript",question:"Arrow functions?",lang:"js",
answer:`<p><strong>Arrow functions</strong> are a concise function syntax introduced in ES6.</p>
<ul><li>Shorter syntax, implicit return for single expressions.</li><li>No own <code>this</code> — they inherit <code>this</code> from the enclosing scope.</li><li>No <code>arguments</code> object; cannot be used as constructors.</li></ul>`,
code:`const add = (a, b) => a + b;           // implicit return\nconst square = n => n * n;             // single param\nconst greet = () => console.log("Hi"); // no params\nconsole.log(add(2,3), square(4));`},
{id:55,category:"JavaScript",question:"== vs ===?",lang:"js",
answer:`<ul><li><code>==</code> (loose equality) – compares after <strong>type coercion</strong>.</li><li><code>===</code> (strict equality) – compares value <strong>and</strong> type, no coercion.</li></ul>
<p>Always prefer <code>===</code> to avoid surprising coercion bugs.</p>`,
code:`console.log(5 == "5");   // true  (coerced)\nconsole.log(5 === "5");  // false (different type)\nconsole.log(0 == false); // true\nconsole.log(0 === false);// false\nconsole.log(null == undefined);  // true`},
{id:56,category:"JavaScript",question:"Event bubbling?",lang:"html",
answer:`<p><strong>Event bubbling</strong> is the default phase where an event fires on the target element first, then propagates <em>upward</em> through its ancestors to the document root.</p>
<p>Stop it with <code>event.stopPropagation()</code>.</p>`,
code:`<div id="parent" style="padding:20px;background:#eee">\n  <button id="child">Click me</button>\n</div>\n<script>\n  parent.onclick = () => parent.append(" Parent(bubbled)");\n  child.onclick  = () => child.after(" Child-first");\n<\/script>`},
{id:57,category:"JavaScript",question:"Event capturing?",lang:"html",
answer:`<p><strong>Event capturing</strong> (trickling) is the opposite of bubbling — the event travels <em>downward</em> from the root to the target first.</p>
<p>Enable it by passing <code>true</code> (or <code>{capture:true}</code>) as the third argument to <code>addEventListener</code>.</p>`,
code:`<div id="p" style="padding:20px;background:#ddd">\n  <button id="c">Click</button>\n</div>\n<script>\n  p.addEventListener('click', () => p.append(' Parent-captures'), true);\n  c.addEventListener('click', () => c.after(' Child'));\n<\/script>`},
{id:58,category:"JavaScript",question:"Event delegation?",lang:"html",
answer:`<p><strong>Event delegation</strong> attaches a single listener to a parent element and uses bubbling to handle events from many children — including ones added dynamically.</p>
<p>More efficient than adding a listener to each child.</p>`,
code:`<ul id="list">\n  <li>Item 1</li><li>Item 2</li><li>Item 3</li>\n</ul>\n<script>\n  list.addEventListener('click', e => {\n    if (e.target.tagName === 'LI')\n      e.target.textContent += " ✓clicked";\n  });\n<\/script>`},
{id:59,category:"JavaScript",question:"What is the DOM?",lang:"js",
answer:`<p>The <strong>DOM (Document Object Model)</strong> is a tree representation of an HTML document that JavaScript can read and manipulate. Each tag becomes a node/object.</p>
<p>JS can select, create, modify, and delete elements, and respond to events through DOM APIs.</p>`,
code:`const h = document.createElement('h2');\nh.textContent = "Created via DOM";\nh.style.color = "#0f7a52";\ndocument.body.appendChild(h);\nconsole.log("Element added to the DOM");`},
{id:60,category:"JavaScript",question:"Synchronous vs asynchronous?",lang:"js",
answer:`<ul><li><strong>Synchronous</strong> – code runs line by line, <em>blocking</em> until each finishes.</li><li><strong>Asynchronous</strong> – long tasks (timers, network) run in the background; their callbacks run later via the <strong>event loop</strong> without blocking.</li></ul>`,
code:`console.log("1");\nsetTimeout(() => console.log("3 (async, later)"), 0);\nconsole.log("2");\n// Output: 1, 2, 3`},
{id:61,category:"JavaScript",question:"What is a Promise?",lang:"js",
answer:`<p>A <strong>Promise</strong> represents the eventual result of an async operation. It has three states: <strong>pending → fulfilled / rejected</strong>.</p>
<ul><li><code>.then()</code> – handle success.</li><li><code>.catch()</code> – handle errors.</li><li><code>.finally()</code> – always runs.</li></ul>`,
code:`const p = new Promise((resolve, reject) => {\n  setTimeout(() => resolve("Done!"), 500);\n});\np.then(res => console.log(res))\n .catch(err => console.log(err))\n .finally(() => console.log("Finished"));`},
{id:62,category:"JavaScript",question:"async / await?",lang:"js",
answer:`<p><strong>async/await</strong> is syntactic sugar over Promises that makes async code read like synchronous code.</p>
<ul><li><code>async</code> functions always return a Promise.</li><li><code>await</code> pauses until the Promise settles.</li><li>Use <code>try/catch</code> for error handling.</li></ul>`,
code:`function wait(ms){return new Promise(r=>setTimeout(r,ms));}\nasync function run() {\n  console.log("Start");\n  await wait(500);\n  console.log("After 0.5s");\n}\nrun();`},
{id:63,category:"JavaScript",question:"setTimeout?",lang:"js",
answer:`<p><code>setTimeout(fn, ms)</code> schedules a function to run once after a minimum delay. The callback is placed in the <strong>macrotask queue</strong> and runs after the call stack is clear, so the delay is a minimum, not exact.</p>
<p><code>setInterval</code> repeats; <code>clearTimeout</code> cancels.</p>`,
code:`console.log("Now");\nsetTimeout(() => {\n  console.log("Runs after 1 second");\n}, 1000);`},
{id:64,category:"JavaScript",question:"map(), filter(), reduce()?",lang:"js",
answer:`<ul><li><strong>map()</strong> – transforms each element, returns a new array of the same length.</li><li><strong>filter()</strong> – keeps elements that pass a test.</li><li><strong>reduce()</strong> – boils the array down to a single value (sum, object, etc.).</li></ul>`,
code:`const nums = [1,2,3,4,5];\nconst doubled = nums.map(n => n * 2);\nconst evens   = nums.filter(n => n % 2 === 0);\nconst total   = nums.reduce((acc, n) => acc + n, 0);\nconsole.log(doubled, evens, total);`},
{id:65,category:"JavaScript",question:"Destructuring?",lang:"js",
answer:`<p><strong>Destructuring</strong> unpacks values from arrays or properties from objects into variables.</p>
<ul><li>Supports default values and renaming.</li><li>Works in function parameters too.</li></ul>`,
code:`const [a, b] = [10, 20];\nconst { name, age = 18 } = { name: "Sha" };\nconst { name: who } = { name: "Sha" }; // rename\nconsole.log(a, b, name, age, who);`},
{id:66,category:"JavaScript",question:"Spread operator?",lang:"js",
answer:`<p>The <strong>spread operator</strong> <code>...</code> expands an iterable into individual elements. Used to copy/merge arrays and objects or pass array items as arguments.</p>`,
code:`const arr1 = [1,2], arr2 = [3,4];\nconst merged = [...arr1, ...arr2];        // [1,2,3,4]\nconst obj = { ...{a:1}, b:2 };            // {a:1,b:2}\nconsole.log(Math.max(...[5,9,2]));        // 9\nconsole.log(merged, obj);`},
{id:67,category:"JavaScript",question:"Rest operator?",lang:"js",
answer:`<p>The <strong>rest operator</strong> <code>...</code> collects multiple elements into a single array. Same syntax as spread but used in <em>function parameters</em> or the left side of destructuring.</p>`,
code:`function sum(...nums) {\n  return nums.reduce((a, n) => a + n, 0);\n}\nconsole.log(sum(1,2,3,4)); // 10\n\nconst [first, ...rest] = [1,2,3,4];\nconsole.log(first, rest);  // 1  [2,3,4]`},
{id:68,category:"JavaScript",question:"Template literals?",lang:"js",
answer:`<p><strong>Template literals</strong> use backticks and allow:</p>
<ul><li><strong>Interpolation</strong> with <code>\${expression}</code>.</li><li><strong>Multiline</strong> strings without <code>\\n</code>.</li><li>Embedded expressions and function calls.</li></ul>`,
code:`const name = "Sha", score = 95;\nconst msg = \`Hi \${name}, you scored \${score}%!\`;\nconst multi = \`Line 1\nLine 2\`;\nconsole.log(msg);\nconsole.log(multi);`},
{id:69,category:"JavaScript",question:"Optional chaining?",lang:"js",
answer:`<p><strong>Optional chaining</strong> <code>?.</code> safely accesses nested properties. If a reference is <code>null</code> or <code>undefined</code>, it short-circuits to <code>undefined</code> instead of throwing.</p>`,
code:`const user = { profile: { name: "Sha" } };\nconsole.log(user.profile?.name);     // "Sha"\nconsole.log(user.address?.city);     // undefined\nconsole.log(user.getName?.());       // undefined (no error)`},
{id:70,category:"JavaScript",question:"The this keyword?",lang:"js",
answer:`<p><code>this</code> refers to the object that is executing the current function — its value depends on how the function is called.</p>
<ul><li>Method call → the object.</li><li>Plain function → global/undefined (strict).</li><li>Arrow function → inherits from enclosing scope.</li><li><code>call/apply/bind</code> set <code>this</code> explicitly.</li></ul>`,
code:`const obj = {\n  name: "Sha",\n  greet() { return "Hi " + this.name; }\n};\nconsole.log(obj.greet());\n\nfunction f(){ return this.x; }\nconsole.log(f.call({x:5})); // 5`},
{id:71,category:"JavaScript",question:"Function declaration vs expression?",lang:"js",
answer:`<ul><li><strong>Declaration</strong> – <code>function foo(){}</code>. Fully hoisted, callable before its line.</li><li><strong>Expression</strong> – <code>const foo = function(){}</code>. Only the variable is hoisted, not the assignment, so it can't be called early.</li></ul>`,
code:`declared();  // works (hoisted)\nfunction declared(){ console.log("declaration"); }\n\nconst expressed = function(){ console.log("expression"); };\nexpressed();`},
{id:72,category:"JavaScript",question:"Prototype?",lang:"js",
answer:`<p>Every JS object has an internal link to a <strong>prototype</strong> object. When you access a property not on the object itself, JS looks up the <strong>prototype chain</strong> until found or it reaches <code>null</code>.</p>
<p>This is how methods like <code>.toString()</code> are available everywhere.</p>`,
code:`function Person(name){ this.name = name; }\nPerson.prototype.greet = function(){\n  return "Hi " + this.name;\n};\nconst p = new Person("Sha");\nconsole.log(p.greet()); // from prototype`},
{id:73,category:"JavaScript",question:"Prototypal inheritance?",lang:"js",
answer:`<p><strong>Prototypal inheritance</strong> lets one object inherit properties/methods from another via the prototype chain — using <code>Object.create()</code> or ES6 <code>class</code> syntax (which is sugar over prototypes).</p>`,
code:`class Animal {\n  constructor(name){ this.name = name; }\n  speak(){ return this.name + " makes a sound"; }\n}\nclass Dog extends Animal {\n  speak(){ return this.name + " barks"; }\n}\nconsole.log(new Dog("Rex").speak());`},
{id:74,category:"JavaScript",question:"What is JSON?",lang:"js",
answer:`<p><strong>JSON (JavaScript Object Notation)</strong> is a lightweight, text-based data format for exchanging data, especially with APIs.</p>
<ul><li><code>JSON.stringify()</code> – object → JSON string.</li><li><code>JSON.parse()</code> – JSON string → object.</li><li>Keys must be double-quoted; only basic data types allowed.</li></ul>`,
code:`const obj = { name: "Sha", skills: ["JS","React"] };\nconst str = JSON.stringify(obj);\nconsole.log(str);\nconst back = JSON.parse(str);\nconsole.log(back.skills[0]); // JS`},
{id:75,category:"JavaScript",question:"localStorage vs sessionStorage (Web Storage)?",lang:"js",
answer:`<p>The Web Storage API stores string key/value pairs in the browser:</p>
<ul><li><strong>localStorage</strong> – persistent, survives browser restarts, shared across tabs of an origin.</li><li><strong>sessionStorage</strong> – per-tab, cleared when the tab closes.</li></ul>
<p>Methods: <code>setItem, getItem, removeItem, clear</code>. Store objects with JSON.</p>`,
code:`localStorage.setItem('user', JSON.stringify({id:1}));\nconst u = JSON.parse(localStorage.getItem('user'));\nconsole.log(u.id);\n\nsessionStorage.setItem('temp', 'value');\nconsole.log(sessionStorage.getItem('temp'));`},
{id:76,category:"JavaScript",question:"What is NaN?",lang:"js",
answer:`<p><strong>NaN (Not a Number)</strong> is a special numeric value representing an invalid math result. Its type is <code>number</code> and, oddly, <code>NaN !== NaN</code>.</p>
<ul><li><code>isNaN()</code> – coerces then checks (loose).</li><li><code>Number.isNaN()</code> – strict, no coercion (preferred).</li></ul>`,
code:`console.log(0/0);            // NaN\nconsole.log(NaN === NaN);   // false\nconsole.log(isNaN("abc"));  // true (coerced)\nconsole.log(Number.isNaN("abc")); // false (strict)`},
{id:77,category:"JavaScript",question:"Truthy and falsy values?",lang:"js",
answer:`<p>Values are coerced to boolean in conditions.</p>
<p><strong>Falsy values (8):</strong> <code>false</code>, <code>0</code>, <code>-0</code>, <code>0n</code>, <code>""</code>, <code>null</code>, <code>undefined</code>, <code>NaN</code>.</p>
<p>Everything else is <strong>truthy</strong> — including <code>"0"</code>, <code>[]</code>, and <code>{}</code>.</p>`,
code:`if ("hi")  console.log("truthy string");\nif ([])    console.log("empty array is truthy");\nconsole.log(Boolean(null), Boolean("x"));\nconsole.log(Boolean(0), Boolean(""));`},
{id:78,category:"JavaScript",question:"What is debounce?",lang:"js",
answer:`<p><strong>Debounce</strong> delays running a function until a pause in events. If the event keeps firing, the timer resets — so the function only runs once after activity stops.</p>
<p>Great for search-as-you-type and window resize.</p>`,
code:`function debounce(fn, delay) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), delay);\n  };\n}\nconst log = debounce(() => console.log("Fired!"), 300);\nlog(); log(); log(); // only last runs`},
{id:79,category:"JavaScript",question:"What is throttle?",lang:"js",
answer:`<p><strong>Throttle</strong> limits a function to run at most once per time interval, no matter how often the event fires. Useful for scroll and mousemove handlers.</p>
<p>Debounce waits for a pause; throttle runs at a steady rate.</p>`,
code:`function throttle(fn, limit) {\n  let wait = false;\n  return (...args) => {\n    if (!wait) {\n      fn(...args);\n      wait = true;\n      setTimeout(() => wait = false, limit);\n    }\n  };\n}\nconst log = throttle(() => console.log("tick"), 1000);\nlog(); log(); // only first runs immediately`},
{id:80,category:"JavaScript",question:"What is currying?",lang:"js",
answer:`<p><strong>Currying</strong> transforms a function with multiple arguments into a sequence of functions each taking one argument: <code>f(a,b,c)</code> → <code>f(a)(b)(c)</code>.</p>
<p>Enables partial application and reusable specialised functions.</p>`,
code:`const add = a => b => c => a + b + c;\nconsole.log(add(1)(2)(3)); // 6\n\nconst add5 = add(5);\nconsole.log(add5(10)(2));  // 17`},

{id:81,category:"React",question:"What is React?",lang:"js",
answer:`<p><strong>React</strong> is a JavaScript library by Meta for building user interfaces with reusable <strong>components</strong>. It uses a <strong>Virtual DOM</strong> for efficient updates and a declarative programming model.</p>
<ul><li>Component-based & composable.</li><li>One-way data flow.</li><li>JSX syntax.</li></ul>`,
code:`// React component (conceptual)\nfunction App() {\n  return <h1>Hello React</h1>;\n}\n// ReactDOM.render(<App />, root);\nconsole.log("React builds UIs from components");`},
{id:82,category:"React",question:"What are components?",lang:"js",
answer:`<p><strong>Components</strong> are independent, reusable pieces of UI. They accept inputs (<strong>props</strong>) and return React elements describing what to render.</p>
<p>Two types: <strong>function components</strong> (modern, with hooks) and <strong>class components</strong> (legacy).</p>`,
code:`function Button({ label }) {\n  return <button>{label}</button>;\n}\nfunction App() {\n  return (\n    <div>\n      <Button label="Save" />\n      <Button label="Delete" />\n    </div>\n  );\n}`},
{id:83,category:"React",question:"Functional vs class components?",lang:"js",
answer:`<table><tr><th>Functional</th><th>Class</th></tr>
<tr><td>Plain functions</td><td>ES6 classes</td></tr>
<tr><td>Use Hooks for state</td><td>this.state / lifecycle</td></tr>
<tr><td>Less boilerplate</td><td>More verbose</td></tr>
<tr><td>Modern standard</td><td>Legacy</td></tr></table>`,
code:`// Functional\nfunction Hello({name}) { return <p>Hi {name}</p>; }\n\n// Class\nclass Hello extends React.Component {\n  render() { return <p>Hi {this.props.name}</p>; }\n}`},
{id:84,category:"React",question:"What is JSX?",lang:"js",
answer:`<p><strong>JSX (JavaScript XML)</strong> is a syntax extension that lets you write HTML-like markup inside JavaScript. It compiles to <code>React.createElement()</code> calls.</p>
<ul><li>Use <code>{}</code> to embed JS expressions.</li><li><code>className</code> instead of <code>class</code>.</li><li>Must return a single root element.</li></ul>`,
code:`const name = "Sha";\nconst el = <h1 className="title">Hi {name}!</h1>;\n// compiles to:\n// React.createElement('h1', {className:'title'}, 'Hi ', name, '!')`},
{id:85,category:"React",question:"What are props?",lang:"js",
answer:`<p><strong>Props</strong> (properties) are read-only inputs passed from a parent component to a child. They make components configurable and reusable.</p>
<p>Props are <strong>immutable</strong> — a child must never modify its own props.</p>`,
code:`function Greeting(props) {\n  return <h2>Hello, {props.name}!</h2>;\n}\n// Usage:\n// <Greeting name="Sha" />\n// <Greeting name="Priya" />`},
{id:86,category:"React",question:"What is state?",lang:"js",
answer:`<p><strong>State</strong> is mutable data managed inside a component. When state changes, React <strong>re-renders</strong> the component to reflect the new data.</p>
<p>In function components, use the <code>useState</code> hook.</p>`,
code:`function Counter() {\n  const [count, setCount] = React.useState(0);\n  return (\n    <button onClick={() => setCount(count + 1)}>\n      Clicked {count} times\n    </button>\n  );\n}`},
{id:87,category:"React",question:"State vs props?",lang:"js",
answer:`<table><tr><th>State</th><th>Props</th></tr>
<tr><td>Internal to component</td><td>Passed from parent</td></tr>
<tr><td>Mutable (via setState)</td><td>Read-only</td></tr>
<tr><td>Triggers re-render</td><td>Configures component</td></tr></table>
<p>Props flow down; state is local memory.</p>`,
code:`function Child({ label }) {        // props\n  const [on, setOn] = useState(false); // state\n  return <button onClick={()=>setOn(!on)}>\n    {label}: {on ? "ON" : "OFF"}\n  </button>;\n}`},
{id:88,category:"React",question:"useState hook?",lang:"js",
answer:`<p><code>useState</code> adds state to function components. It returns an array: the current value and a setter function.</p>
<ul><li>Setter triggers a re-render.</li><li>For updates based on previous state, pass a function.</li></ul>`,
code:`function App() {\n  const [name, setName] = React.useState("Sha");\n  return (\n    <input\n      value={name}\n      onChange={e => setName(e.target.value)}\n    />\n  );\n}`},
{id:89,category:"React",question:"useEffect hook?",lang:"js",
answer:`<p><code>useEffect</code> runs <strong>side effects</strong> (data fetching, subscriptions, timers) after render.</p>
<ul><li>Dependency array controls when it runs: <code>[]</code> = once on mount, <code>[x]</code> = when x changes, none = every render.</li><li>Return a cleanup function for unmount.</li></ul>`,
code:`useEffect(() => {\n  const id = setInterval(() => console.log("tick"), 1000);\n  return () => clearInterval(id); // cleanup\n}, []); // run once on mount`},
{id:90,category:"React",question:"Virtual DOM?",lang:"js",
answer:`<p>The <strong>Virtual DOM</strong> is a lightweight in-memory copy of the real DOM. When state changes, React builds a new virtual tree, <strong>diffs</strong> it against the previous one, and updates only the changed real DOM nodes.</p>
<p>This minimises expensive direct DOM operations.</p>`,
code:`// 1. State changes\n// 2. New virtual DOM created\n// 3. Diff with old virtual DOM\n// 4. Patch only changed real nodes\nconsole.log("Efficient updates via diffing");`},
{id:91,category:"React",question:"Reconciliation?",lang:"js",
answer:`<p><strong>Reconciliation</strong> is React's algorithm for diffing the new and old Virtual DOM trees to figure out the minimal set of changes.</p>
<ul><li>Compares elements by type.</li><li>Uses <strong>keys</strong> to match list items efficiently.</li><li>Different types → tear down and rebuild.</li></ul>`,
code:`// keys help reconciliation match items\n// {items.map(item =>\n//   <li key={item.id}>{item.text}</li>\n// )}\nconsole.log("Stable keys = efficient list updates");`},
{id:92,category:"React",question:"Keys in React?",lang:"js",
answer:`<p><strong>Keys</strong> are special string attributes that help React identify which list items changed, were added, or removed — making list re-renders efficient and stable.</p>
<p>Use a stable, unique ID. Avoid using the array index when the list can reorder.</p>`,
code:`const users = [{id:1,name:'A'},{id:2,name:'B'}];\n// return (\n//   <ul>\n//     {users.map(u => <li key={u.id}>{u.name}</li>)}\n//   </ul>\n// );\nconsole.log("Keys must be unique & stable");`},
{id:93,category:"React",question:"Prop drilling?",lang:"js",
answer:`<p><strong>Prop drilling</strong> is passing props through many intermediate components that don't use them, just to reach a deeply nested child. It makes code verbose and hard to maintain.</p>
<p>Solved with <strong>Context API</strong> or state libraries like Redux.</p>`,
code:`// data passes through every level\n// <App data={x}>\n//   <Page data={x}>\n//     <Section data={x}>\n//       <Widget data={x} /> // finally used here\nconsole.log("Avoid with Context API");`},
{id:94,category:"React",question:"Context API?",lang:"js",
answer:`<p>The <strong>Context API</strong> shares data globally without prop drilling.</p>
<ul><li><code>createContext()</code> – create a context.</li><li><code>&lt;Provider value={...}&gt;</code> – supply data.</li><li><code>useContext()</code> – consume data anywhere below.</li></ul>`,
code:`const ThemeContext = React.createContext('light');\nfunction App() {\n  return (\n    <ThemeContext.Provider value="dark">\n      <Child />\n    </ThemeContext.Provider>\n  );\n}\nfunction Child() {\n  const theme = React.useContext(ThemeContext);\n  return <p>Theme: {theme}</p>;\n}`},
{id:95,category:"React",question:"What is Redux?",lang:"js",
answer:`<p><strong>Redux</strong> is a predictable state-management library using a single global <strong>store</strong>.</p>
<ul><li><strong>Store</strong> – holds all state.</li><li><strong>Action</strong> – an object describing what happened.</li><li><strong>Reducer</strong> – pure function: (state, action) → new state.</li><li>One-way data flow, time-travel debugging.</li></ul>`,
code:`function reducer(state = {count:0}, action) {\n  switch(action.type) {\n    case 'INC': return {count: state.count + 1};\n    default: return state;\n  }\n}\nconsole.log(reducer({count:0}, {type:'INC'}));`},
{id:96,category:"React",question:"Redux vs Context API?",lang:"js",
answer:`<table><tr><th>Context API</th><th>Redux</th></tr>
<tr><td>Built into React</td><td>External library</td></tr>
<tr><td>Simple shared state</td><td>Complex global state</td></tr>
<tr><td>Can cause extra re-renders</td><td>Optimised selectors</td></tr>
<tr><td>No devtools/middleware</td><td>DevTools, middleware, thunks</td></tr></table>
<p>Use Context for small apps/themes; Redux for large apps with heavy state logic.</p>`,
code:`// Context: lightweight, built-in\n// Redux: store + actions + reducers + middleware\nconsole.log("Choose based on app complexity");`},
{id:97,category:"React",question:"React Hooks?",lang:"js",
answer:`<p><strong>Hooks</strong> let function components use state and lifecycle features. Common hooks:</p>
<ul><li><code>useState</code> – state.</li><li><code>useEffect</code> – side effects.</li><li><code>useContext</code> – context.</li><li><code>useRef</code> – refs/mutable values.</li><li><code>useMemo / useCallback</code> – memoisation.</li></ul>
<p>Rules: only call hooks at the top level of components.</p>`,
code:`function App() {\n  const [count, setCount] = useState(0);\n  useEffect(() => { document.title = count; }, [count]);\n  return <button onClick={()=>setCount(count+1)}>{count}</button>;\n}`},
{id:98,category:"React",question:"useRef hook?",lang:"js",
answer:`<p><code>useRef</code> returns a mutable object whose <code>.current</code> property persists across renders <strong>without causing re-renders</strong>.</p>
<ul><li>Access DOM elements directly.</li><li>Store mutable values (timers, previous values).</li></ul>`,
code:`function Input() {\n  const inputRef = React.useRef(null);\n  const focus = () => inputRef.current.focus();\n  return (\n    <>\n      <input ref={inputRef} />\n      <button onClick={focus}>Focus</button>\n    </>\n  );\n}`},
{id:99,category:"React",question:"useMemo hook?",lang:"js",
answer:`<p><code>useMemo</code> <strong>memoises</strong> (caches) the result of an expensive calculation, recomputing only when its dependencies change. This avoids wasteful recalculation on every render.</p>`,
code:`const expensive = React.useMemo(() => {\n  return hugeArray.filter(x => x > 100).length;\n}, [hugeArray]);\n// recalculates only when hugeArray changes`},
{id:100,category:"React",question:"useCallback hook?",lang:"js",
answer:`<p><code>useCallback</code> memoises a <strong>function reference</strong> so it isn't recreated on every render. Useful when passing callbacks to memoised child components to prevent unnecessary re-renders.</p>
<p><code>useCallback(fn, deps)</code> ≈ <code>useMemo(() => fn, deps)</code>.</p>`,
code:`const handleClick = React.useCallback(() => {\n  console.log("clicked", id);\n}, [id]);\n// same function reference until id changes`},
{id:101,category:"React",question:"Lazy loading in React?",lang:"js",
answer:`<p><strong>Lazy loading</strong> defers loading components until they're needed, splitting the bundle for faster initial load.</p>
<ul><li><code>React.lazy()</code> – dynamically import a component.</li><li><code>&lt;Suspense fallback={...}&gt;</code> – show a loader while it loads.</li></ul>`,
code:`const Profile = React.lazy(() => import('./Profile'));\nfunction App() {\n  return (\n    <Suspense fallback={<p>Loading...</p>}>\n      <Profile />\n    </Suspense>\n  );\n}`},
{id:102,category:"React",question:"React Router?",lang:"js",
answer:`<p><strong>React Router</strong> enables client-side routing — navigating between views without full page reloads.</p>
<ul><li><code>&lt;Routes&gt;</code> / <code>&lt;Route&gt;</code> – map paths to components.</li><li><code>&lt;Link&gt;</code> – navigation.</li><li><code>useNavigate</code>, <code>useParams</code> – programmatic routing.</li></ul>`,
code:`<BrowserRouter>\n  <Routes>\n    <Route path="/" element={<Home/>} />\n    <Route path="/about" element={<About/>} />\n  </Routes>\n</BrowserRouter>`},
{id:103,category:"React",question:"Controlled components?",lang:"js",
answer:`<p>A <strong>controlled component</strong> has its form value driven by React state. The input's <code>value</code> comes from state and updates via <code>onChange</code> — React is the single source of truth.</p>`,
code:`function Form() {\n  const [text, setText] = React.useState("");\n  return (\n    <input\n      value={text}\n      onChange={e => setText(e.target.value)}\n    />\n  );\n}`},
{id:104,category:"React",question:"Uncontrolled components?",lang:"js",
answer:`<p>An <strong>uncontrolled component</strong> keeps its own state in the DOM. You read the value when needed using a <strong>ref</strong>, rather than tracking every keystroke in React state.</p>
<p>Useful for simple forms and integrating non-React code.</p>`,
code:`function Form() {\n  const inputRef = React.useRef();\n  const submit = () => alert(inputRef.current.value);\n  return (\n    <>\n      <input ref={inputRef} defaultValue="hi" />\n      <button onClick={submit}>Submit</button>\n    </>\n  );\n}`},
{id:105,category:"React",question:"Lifting state up?",lang:"js",
answer:`<p><strong>Lifting state up</strong> means moving shared state to the closest common ancestor of components that need it, then passing it down via props. This keeps components in sync with a single source of truth.</p>`,
code:`function Parent() {\n  const [value, setValue] = React.useState("");\n  return (\n    <>\n      <Input value={value} onChange={setValue} />\n      <Display value={value} />\n    </>\n  );\n}`},
{id:106,category:"React",question:"Higher-Order Components (HOC)?",lang:"js",
answer:`<p>A <strong>HOC</strong> is a function that takes a component and returns a new enhanced component. It's a pattern for reusing cross-cutting logic (auth, logging, data).</p>`,
code:`function withLogger(Component) {\n  return function(props) {\n    console.log("Rendering", Component.name);\n    return <Component {...props} />;\n  };\n}\nconst EnhancedButton = withLogger(Button);`},
{id:107,category:"React",question:"Custom hooks?",lang:"js",
answer:`<p><strong>Custom hooks</strong> extract reusable stateful logic into a function whose name starts with <code>use</code>. They can call other hooks and be shared across components.</p>`,
code:`function useCounter(start = 0) {\n  const [count, setCount] = React.useState(start);\n  const inc = () => setCount(c => c + 1);\n  return { count, inc };\n}\n// const { count, inc } = useCounter(10);`},
{id:108,category:"React",question:"React Strict Mode?",lang:"js",
answer:`<p><strong>StrictMode</strong> is a development-only wrapper that highlights potential problems: unsafe lifecycles, deprecated APIs, and side-effect bugs.</p>
<p>It intentionally <strong>double-invokes</strong> render and effect functions in dev to surface impurities. It renders no visible UI and has no production effect.</p>`,
code:`<React.StrictMode>\n  <App />\n</React.StrictMode>\n// helps catch bugs during development`},
{id:109,category:"React",question:"Server-Side Rendering (SSR)?",lang:"js",
answer:`<p><strong>SSR</strong> renders React components to HTML on the server and sends a fully-formed page to the browser. The client then "hydrates" it to make it interactive.</p>
<ul><li>Faster first paint and better SEO.</li><li>Frameworks: Next.js, Remix.</li></ul>`,
code:`// Server\nimport { renderToString } from 'react-dom/server';\nconst html = renderToString(<App />);\n// send html to browser, then hydrate on client`},
{id:110,category:"React",question:"CSR vs SSR?",lang:"js",
answer:`<table><tr><th>CSR</th><th>SSR</th></tr>
<tr><td>Browser renders JS</td><td>Server renders HTML</td></tr>
<tr><td>Blank page first, then JS fills</td><td>Content visible immediately</td></tr>
<tr><td>Weaker SEO</td><td>Better SEO</td></tr>
<tr><td>Less server load</td><td>More server load</td></tr></table>`,
code:`// CSR: <div id="root"></div> + bundle.js renders\n// SSR: server sends full HTML, client hydrates\nconsole.log("Trade-off: SEO/speed vs server cost");`},

{id:111,category:"Node.js",question:"What is Node.js?",lang:"js",
answer:`<p><strong>Node.js</strong> is a runtime that lets JavaScript run outside the browser, on the server, built on Chrome's V8 engine. It uses a <strong>non-blocking, event-driven</strong> model — ideal for scalable I/O-heavy apps.</p>`,
code:`console.log("Running on Node.js!");\n// const os = require('os');\n// console.log("Platform:", os.platform());`},
{id:112,category:"Node.js",question:"Node.js vs browser JavaScript?",lang:"js",
answer:`<ul><li><strong>Browser JS</strong> – has <code>window</code>, <code>document</code>, DOM APIs; sandboxed.</li><li><strong>Node JS</strong> – has <code>global</code>, <code>process</code>, file system, networking; no DOM. Uses CommonJS/ESM modules.</li></ul>`,
code:`// Node-only globals\n// console.log(process.version);\n// console.log(__dirname);\n// const fs = require('fs'); // file system access\nconsole.log("Node has no DOM, browser has no fs");`},
{id:113,category:"Node.js",question:"The event loop in Node?",lang:"js",
answer:`<p>The <strong>event loop</strong> lets single-threaded Node handle many concurrent operations. It offloads I/O to the system, then processes callbacks in phases (timers, I/O, check) when the call stack is empty.</p>
<p>Order: synchronous → microtasks (Promises, <code>process.nextTick</code>) → macrotasks.</p>`,
code:`console.log("1 sync");\nPromise.resolve().then(() => console.log("3 microtask"));\nsetTimeout(() => console.log("4 macrotask"), 0);\nconsole.log("2 sync");`},
{id:114,category:"Node.js",question:"What is npm?",lang:"none",
answer:`<p><strong>npm (Node Package Manager)</strong> is the default package manager for Node. It installs, manages and shares reusable JavaScript packages.</p>
<ul><li><code>package.json</code> – project metadata & dependencies.</li><li><code>npm install</code> – install packages.</li><li><code>dependencies</code> vs <code>devDependencies</code>.</li></ul>`,
code:`# install a package\nnpm install express\n\n# install dev dependency\nnpm install --save-dev nodemon\n\n# run a script\nnpm run start`},
{id:115,category:"Node.js",question:"CommonJS vs ES Modules?",lang:"js",
answer:`<ul><li><strong>CommonJS</strong> – Node's original system: <code>require()</code> and <code>module.exports</code>. Synchronous.</li><li><strong>ES Modules (ESM)</strong> – standard: <code>import/export</code>. Asynchronous, supports tree-shaking. Enabled via <code>.mjs</code> or <code>"type":"module"</code>.</li></ul>`,
code:`// CommonJS\nconst fs = require('fs');\nmodule.exports = myFunc;\n\n// ES Modules\nimport fs from 'fs';\nexport default myFunc;`},
{id:116,category:"Node.js",question:"What is Express.js?",lang:"js",
answer:`<p><strong>Express.js</strong> is a minimal, flexible web framework for Node that simplifies building servers and REST APIs with routing and middleware.</p>`,
code:`const express = require('express');\nconst app = express();\n\napp.get('/', (req, res) => {\n  res.send('Hello from Express!');\n});\n\napp.listen(3000, () => console.log('Port 3000'));`},
{id:117,category:"Node.js",question:"What is middleware in Express?",lang:"js",
answer:`<p><strong>Middleware</strong> are functions that run during the request-response cycle. They have access to <code>req</code>, <code>res</code>, and <code>next()</code>, and can modify requests, end responses, or pass control onward.</p>
<p>Used for logging, auth, body parsing, error handling.</p>`,
code:`app.use((req, res, next) => {\n  console.log(req.method + ' ' + req.url);\n  next(); // pass to next middleware\n});\n\napp.use(express.json()); // body parser`},
{id:118,category:"Node.js",question:"Synchronous vs asynchronous in Node?",lang:"js",
answer:`<p>Node prefers <strong>asynchronous</strong>, non-blocking APIs so the single thread isn't held up by slow I/O.</p>
<ul><li>Sync (e.g. <code>fs.readFileSync</code>) blocks the event loop.</li><li>Async (callbacks/Promises) lets other work proceed.</li></ul>`,
code:`const fs = require('fs');\n// Async (preferred)\nfs.readFile('a.txt', 'utf8', (err, data) => {\n  console.log(data);\n});\n// Sync (blocks)\n// const data = fs.readFileSync('a.txt','utf8');`},
{id:119,category:"Node.js",question:"What are streams in Node?",lang:"js",
