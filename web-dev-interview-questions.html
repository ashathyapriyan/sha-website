post</code>, etc.</li><li>Middleware via <code>app.use</code></li><li>Request/response objects <code>req</code>, <code>res</code></li><li>Foundation for REST APIs</li></ul>", "code": "// app.get(\"/\", (req, res) => res.send(\"Hello\"))\nfunction handler(req, res){ res.send = m => console.log(\"Sent:\", m); res.send(\"Hello\"); }\nhandler({}, {});", "lang": "js"}, {"id": 116, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Middleware", "lesson": "<p>Middleware functions run during the request-response cycle.</p><ul><li>Signature: <code>(req, res, next)</code></li><li>Run in order; call <code>next()</code> to continue</li><li>Used for logging, auth, parsing</li><li>Examples: morgan, cors, <code>express.json()</code></li></ul>", "code": "function logger(req, res, next){ console.log(\"Request received\"); next(); }\nlogger({}, {}, () => console.log(\"Next middleware\"));", "lang": "js"}, {"id": 117, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "REST API", "lesson": "<p>REST is an architectural style for designing networked APIs.</p><ul><li>Stateless requests</li><li>Resource-based URLs</li><li>HTTP methods map to CRUD</li><li>Returns JSON with status codes</li></ul>", "code": "const routes = { \"GET /users\":\"list\", \"POST /users\":\"create\", \"DELETE /users/:id\":\"delete\" };\nObject.entries(routes).forEach(([k,v]) => console.log(k, \"->\", v));", "lang": "js"}, {"id": 118, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "PUT vs PATCH", "lesson": "<p>Both update resources but differ in scope.</p><ul><li><strong>PUT</strong> — replaces the entire resource</li><li><strong>PATCH</strong> — partial update of some fields</li><li>PUT is idempotent</li><li>PATCH sends only changed fields</li></ul>", "code": "const user = { name:\"Jane\", age:30 };\nconst patched = { ...user, age:31 }; // PATCH\nconsole.log(\"PATCH:\", patched);\nconsole.log(\"PUT replaces the whole object\");", "lang": "js"}, {"id": 119, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "JWT", "lesson": "<p>JSON Web Tokens are compact, signed tokens for stateless authentication.</p><ul><li>Structure: <code>header.payload.signature</code></li><li>Each part is Base64-encoded</li><li>Signed with a secret or key pair</li><li>Verified on each request, no server session</li></ul>", "code": "const jwt = \"header.payload.signature\";\nconst [h,p,s] = jwt.split(\".\");\nconsole.log(\"header:\", h, \"payload:\", p, \"sig:\", s);", "lang": "js"}, {"id": 120, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Authentication vs Authorization", "lesson": "<p>Two related but distinct security concepts.</p><ul><li><strong>Authentication</strong> — who are you? (login)</li><li><strong>Authorization</strong> — what can you do? (permissions)</li><li>Authn comes before authz</li><li>Example: login (authn) then admin check (authz)</li></ul>", "code": "function authn(user){ return user.loggedIn; }\nfunction authz(user){ return user.role === \"admin\"; }\nconst u = { loggedIn:true, role:\"admin\" };\nconsole.log(\"auth:\", authn(u), \"authorized:\", authz(u));", "lang": "js"}, {"id": 121, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "CORS", "lesson": "<p>CORS controls which origins can access your API from the browser.</p><ul><li>Server sends <code>Access-Control-Allow-Origin</code></li><li>Browsers send a preflight <code>OPTIONS</code> request</li><li>Blocks cross-origin requests by default</li><li>Use the <code>cors</code> npm package in Express</li></ul>", "code": "const headers = { \"Access-Control-Allow-Origin\": \"*\" };\nconsole.log(\"CORS header:\", JSON.stringify(headers));", "lang": "js"}, {"id": 122, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "dotenv", "lesson": "<p>dotenv loads environment variables from a <code>.env</code> file into <code>process.env</code>.</p><ul><li>Keep secrets out of source code</li><li><code>dotenv.config()</code> loads the file</li><li>Access via <code>process.env.KEY</code></li><li>Never commit <code>.env</code> to git</li></ul>", "code": "// .env: API_KEY=secret123\nconst processEnv = { API_KEY: \"secret123\" };\nconsole.log(\"Key:\", processEnv.API_KEY);", "lang": "js"}, {"id": 123, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Event Loop", "lesson": "<p>The event loop lets Node handle many operations on a single thread.</p><ul><li>Phases: timers, I/O callbacks, poll, check, close</li><li>Microtasks (promises) run after each phase</li><li>Enables non-blocking concurrency</li><li>Long sync code blocks the loop</li></ul>", "code": "console.log(\"1 sync\");\nPromise.resolve().then(() => console.log(\"3 microtask\"));\nsetTimeout(() => console.log(\"4 timer\"), 0);\nconsole.log(\"2 sync\");", "lang": "js"}, {"id": 124, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Non-blocking I/O", "lesson": "<p>Node performs I/O asynchronously so the thread is never idle waiting.</p><ul><li><code>fs.readFile</code> is async by default</li><li>Does not block other operations</li><li>Uses callbacks, promises, or async/await</li><li>Key to Node's scalability</li></ul>", "code": "function readFile(cb){ setTimeout(() => cb(\"file contents\"), 100); }\nconsole.log(\"Reading...\");\nreadFile(data => console.log(\"Got:\", data));\nconsole.log(\"Not blocked\");", "lang": "js"}, {"id": 125, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "package.json", "lesson": "<p><code>package.json</code> is the manifest describing a Node project.</p><ul><li><code>name</code>, <code>version</code>, <code>main</code></li><li><code>scripts</code> for tasks like <code>npm start</code></li><li><code>dependencies</code> and <code>devDependencies</code></li><li>Created with <code>npm init -y</code></li></ul>", "code": "const pkg = { name:\"app\", version:\"1.0.0\", scripts:{ start:\"node index.js\" } };\nconsole.log(JSON.stringify(pkg, null, 2));", "lang": "js"}, {"id": 126, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "nodemon", "lesson": "<p>nodemon is a development tool that auto-restarts the server on file changes.</p><ul><li>Install: <code>npm i -D nodemon</code></li><li>Run: <code>nodemon app.js</code></li><li>Watches files and reloads</li><li>Speeds up development feedback</li></ul>", "code": "console.log(\"nodemon app.js\");\nconsole.log(\"File changed -> server restarting...\");", "lang": "js"}, {"id": 127, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Streams", "lesson": "<p>Streams process data piece by piece instead of loading it all into memory.</p><ul><li>Types: Readable, Writable, Duplex, Transform</li><li><code>pipe()</code> connects streams</li><li>Efficient for large files</li><li>Backpressure handles flow control</li></ul>", "code": "const chunks = [\"chunk1\",\"chunk2\",\"chunk3\"];\nchunks.forEach(c => console.log(\"Processing\", c));\nconsole.log(\"Streamed without loading all at once\");", "lang": "js"}, {"id": 128, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Buffer", "lesson": "<p>Buffers handle raw binary data in Node.</p><ul><li><code>Buffer.from('text')</code> creates a buffer</li><li><code>buf.toString('utf8')</code> decodes it</li><li>Fixed-size chunks of memory</li><li>Used for files, streams, and network data</li></ul>", "code": "// Buffer.from(\"Hi\")\nconst bytes = \"Hi\".split(\"\").map(c => c.charCodeAt(0));\nconsole.log(\"Bytes:\", bytes);\nconsole.log(\"Back:\", bytes.map(b => String.fromCharCode(b)).join(\"\"));", "lang": "js"}, {"id": 129, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Async Middleware & Error Handling", "lesson": "<p>Async middleware must catch errors and pass them to Express's error handler.</p><ul><li>Wrap in <code>try/catch</code></li><li>Call <code>next(err)</code> on failure</li><li>Express has a dedicated error middleware</li><li>Avoids unhandled promise rejections</li></ul>", "code": "async function mw(req, res, next){\n  try { throw new Error(\"DB fail\"); }\n  catch(e){ next(e); }\n}\nmw({}, {}, err => console.log(\"Handled:\", err.message));", "lang": "js"}, {"id": 130, "cat": "Node.js", "icon": "🌐", "catId": 5, "title": "Rate Limiting", "lesson": "<p>Rate limiting restricts how many requests a client can make in a time window.</p><ul><li>Prevents abuse and brute-force attacks</li><li><code>express-rate-limit</code> middleware</li><li>Configure window and max requests</li><li>Returns <code>429 Too Many Requests</code></li></ul>", "code": "const limit = { windowMs: 15*60*1000, max: 100 };\nlet count = 101;\nconsole.log(count > limit.max ? \"429 Too Many Requests\" : \"OK\");", "lang": "js"}, {"id": 131, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "SQL", "lesson": "<p>SQL (Structured Query Language) manages data in relational databases.</p><ul><li><code>SELECT</code> — read data</li><li><code>INSERT</code> — add rows</li><li><code>UPDATE</code> / <code>DELETE</code> — modify/remove</li><li>DDL, DML, and DCL categories</li></ul>", "code": "const query = \"SELECT name FROM users WHERE age > 18\";\nconsole.log(query);\nconsole.log(\"Returns matching rows\");", "lang": "js"}, {"id": 132, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "SQL vs NoSQL", "lesson": "<p>Two database paradigms with different data models.</p><ul><li><strong>SQL</strong> — relational tables, fixed schema</li><li><strong>NoSQL</strong> — documents/key-value, flexible schema</li><li>SQL scales vertically; NoSQL scales horizontally</li><li>SQL for structured data, NoSQL for flexibility</li></ul>", "code": "console.log(\"SQL: tables, rows, JOINs, schema\");\nconsole.log(\"NoSQL: documents, flexible, horizontal scaling\");", "lang": "js"}, {"id": 133, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Primary Key", "lesson": "<p>A primary key uniquely identifies each row in a table.</p><ul><li>Must be unique and NOT NULL</li><li>Only one per table</li><li>Often auto-incremented</li><li>Used to reference rows</li></ul>", "code": "const users = [{id:1,name:\"A\"},{id:2,name:\"B\"}];\nconsole.log(\"Primary keys:\", users.map(u => u.id));", "lang": "js"}, {"id": 134, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Foreign Key", "lesson": "<p>A foreign key links one table to another's primary key.</p><ul><li>References a PK in another table</li><li>Enforces referential integrity</li><li>Prevents orphaned records</li><li>Supports CASCADE on delete/update</li></ul>", "code": "const orders = [{id:1, userId:2}];\nconst users = [{id:2, name:\"Jane\"}];\nconst order = orders[0];\nconsole.log(\"Order belongs to:\", users.find(u => u.id === order.userId).name);", "lang": "js"}, {"id": 135, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Normalization", "lesson": "<p>Normalization organizes data to reduce redundancy.</p><ul><li><strong>1NF</strong> — atomic values, no repeating groups</li><li><strong>2NF</strong> — no partial dependencies</li><li><strong>3NF</strong> — no transitive dependencies</li><li>Trade-off: fewer duplicates vs more JOINs</li></ul>", "code": "console.log(\"1NF: atomic columns\");\nconsole.log(\"2NF: no partial key dependency\");\nconsole.log(\"3NF: no transitive dependency\");", "lang": "js"}, {"id": 136, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "SQL Joins", "lesson": "<p>Joins combine rows from multiple tables based on related columns.</p><ul><li><strong>INNER</strong> — only matching rows</li><li><strong>LEFT</strong> — all left + matched right</li><li><strong>RIGHT</strong> — all right + matched left</li><li><strong>FULL OUTER</strong> — all rows from both</li></ul>", "code": "const q = \"SELECT * FROM users INNER JOIN orders ON users.id = orders.userId\";\nconsole.log(q);", "lang": "js"}, {"id": 137, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "INNER vs LEFT JOIN", "lesson": "<p>The most common joins, differing in how they handle non-matches.</p><ul><li><strong>INNER JOIN</strong> — only rows with a match in both</li><li><strong>LEFT JOIN</strong> — all left rows, NULLs for missing right</li><li>INNER can drop rows; LEFT keeps them</li><li>Choose based on whether you need unmatched rows</li></ul>", "code": "console.log(\"INNER: users WITH orders only\");\nconsole.log(\"LEFT: all users, orders may be NULL\");", "lang": "js"}, {"id": 138, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Indexing", "lesson": "<p>Indexes speed up data retrieval at the cost of slower writes.</p><ul><li>Usually a B-tree structure</li><li>Speeds up <code>SELECT</code> and <code>WHERE</code></li><li>Slows <code>INSERT</code>/<code>UPDATE</code></li><li>Created with <code>CREATE INDEX</code></li></ul>", "code": "console.log(\"CREATE INDEX idx_email ON users(email)\");\nconsole.log(\"Faster lookups, slower writes\");", "lang": "js"}, {"id": 139, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Aggregate Functions", "lesson": "<p>Aggregate functions compute a single value over a set of rows.</p><ul><li><code>COUNT</code>, <code>SUM</code>, <code>AVG</code>, <code>MIN</code>, <code>MAX</code></li><li><code>GROUP BY</code> groups rows</li><li><code>HAVING</code> filters groups</li><li><code>WHERE</code> filters before grouping</li></ul>", "code": "const ages = [20, 30, 40];\nconsole.log(\"COUNT:\", ages.length);\nconsole.log(\"AVG:\", ages.reduce((a,b)=>a+b,0)/ages.length);", "lang": "js"}, {"id": 140, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "DELETE vs DROP vs TRUNCATE", "lesson": "<p>Three ways to remove data, with different scopes.</p><ul><li><strong>DELETE</strong> — removes rows, can use WHERE, rollback-able</li><li><strong>TRUNCATE</strong> — removes all rows fast, no WHERE</li><li><strong>DROP</strong> — removes the entire table</li><li>DELETE logs each row; TRUNCATE is faster</li></ul>", "code": "console.log(\"DELETE FROM t WHERE id=1  -- one row\");\nconsole.log(\"TRUNCATE TABLE t          -- all rows\");\nconsole.log(\"DROP TABLE t              -- whole table\");", "lang": "js"}, {"id": 141, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "MongoDB", "lesson": "<p>MongoDB is a popular document-oriented NoSQL database.</p><ul><li>Stores BSON documents in collections</li><li>Schema-less and flexible</li><li>Scales horizontally</li><li>MongoDB Atlas is the cloud service</li></ul>", "code": "const doc = { _id:1, name:\"Jane\", tags:[\"a\",\"b\"] };\nconsole.log(JSON.stringify(doc));", "lang": "js"}, {"id": 142, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "MongoDB vs MySQL", "lesson": "<p>A document database versus a relational database.</p><ul><li><strong>MongoDB</strong> — documents, flexible, horizontal scaling</li><li><strong>MySQL</strong> — tables, fixed schema, vertical scaling</li><li>MySQL excels at complex relations and ACID</li><li>MongoDB suits rapidly changing data</li></ul>", "code": "console.log(\"MongoDB: { name: \\\"Jane\\\" } document\");\nconsole.log(\"MySQL: rows in a users table\");", "lang": "js"}, {"id": 143, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Schema", "lesson": "<p>A schema defines the structure and rules of your data.</p><ul><li>SQL: <code>CREATE TABLE</code> with column types</li><li>MongoDB: optional via Mongoose schemas</li><li>Enforces validation and types</li><li>Documents the data model</li></ul>", "code": "const userSchema = { name:\"String\", age:\"Number\", email:\"String\" };\nconsole.log(\"Schema:\", JSON.stringify(userSchema));", "lang": "js"}, {"id": 144, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "ORM", "lesson": "<p>An ORM maps database tables to programming objects.</p><ul><li>Write queries in your language, not raw SQL</li><li>Examples: Sequelize, Prisma, TypeORM</li><li>Handles migrations and relations</li><li>Adds type safety and convenience</li></ul>", "code": "// User.findAll({ where: { active: true } })\nconst users = [{name:\"A\",active:true},{name:\"B\",active:false}];\nconsole.log(users.filter(u => u.active));", "lang": "js"}, {"id": 145, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Sequelize", "lesson": "<p>Sequelize is a promise-based ORM for SQL databases in Node.</p><ul><li>Define models with attributes</li><li><code>Model.findAll({ where: {} })</code></li><li>Supports associations (hasMany, belongsTo)</li><li>Built-in migrations</li></ul>", "code": "// User.findAll({ where: { role: \"admin\" } })\nconst rows = [{role:\"admin\"},{role:\"user\"}];\nconsole.log(rows.filter(r => r.role === \"admin\"));", "lang": "js"}, {"id": 146, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Mongoose", "lesson": "<p>Mongoose is an ODM for MongoDB in Node.</p><ul><li><code>new Schema({})</code> defines structure</li><li><code>Model.find().populate()</code> joins references</li><li>Middleware hooks (pre/post save)</li><li>Built-in validation</li></ul>", "code": "// const s = new Schema({ name: String })\nconst schema = { name: \"String\" };\nconsole.log(\"Mongoose schema:\", JSON.stringify(schema));", "lang": "js"}, {"id": 147, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "ACID", "lesson": "<p>ACID guarantees reliable database transactions.</p><ul><li><strong>Atomicity</strong> — all or nothing</li><li><strong>Consistency</strong> — valid state transitions</li><li><strong>Isolation</strong> — concurrent transactions do not interfere</li><li><strong>Durability</strong> — committed data survives crashes</li></ul>", "code": "const acid = [\"Atomicity\",\"Consistency\",\"Isolation\",\"Durability\"];\nacid.forEach(p => console.log(p));", "lang": "js"}, {"id": 148, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Transactions", "lesson": "<p>A transaction groups operations into a single atomic unit.</p><ul><li><code>BEGIN</code> starts it</li><li><code>COMMIT</code> saves changes</li><li><code>ROLLBACK</code> undoes on failure</li><li>Ensures data integrity (e.g. bank transfers)</li></ul>", "code": "console.log(\"BEGIN\");\nconsole.log(\"UPDATE accounts SET bal = bal - 100 WHERE id = 1\");\nconsole.log(\"UPDATE accounts SET bal = bal + 100 WHERE id = 2\");\nconsole.log(\"COMMIT\");", "lang": "js"}, {"id": 149, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Sharding", "lesson": "<p>Sharding splits data across multiple servers horizontally.</p><ul><li>Each shard holds a subset of data</li><li>A shard key decides distribution</li><li>Improves write scalability</li><li>Used by MongoDB and large systems</li></ul>", "code": "function shard(userId){ return \"shard-\" + (userId % 3); }\nconsole.log(shard(7), shard(8), shard(9));", "lang": "js"}, {"id": 150, "cat": "Databases", "icon": "🗄️", "catId": 6, "title": "Replication", "lesson": "<p>Replication copies data to multiple servers for reliability and read scaling.</p><ul><li>Primary handles writes; replicas serve reads</li><li>Automatic failover if primary dies</li><li>Improves availability</li><li>Replication lag can cause stale reads</li></ul>", "code": "console.log(\"Primary: writes\");\nconsole.log(\"Replicas: reads + failover\");", "lang": "js"}, {"id": 151, "cat": "Security", "icon": "🔒", "catId": 7, "title": "HTTPS", "lesson": "<p>HTTPS is HTTP layered over TLS encryption.</p><ul><li>Runs on port 443</li><li>Encrypts data in transit</li><li>Uses certificates from a CA</li><li>HSTS forces HTTPS-only</li></ul>", "code": "console.log(\"https:// encrypts traffic with TLS\");\nconsole.log(\"Certificate verifies server identity\");", "lang": "js"}, {"id": 152, "cat": "Security", "icon": "🔒", "catId": 7, "title": "HTTP vs HTTPS", "lesson": "<p>The difference is encryption.</p><ul><li><strong>HTTP</strong> — plaintext, port 80</li><li><strong>HTTPS</strong> — encrypted, port 443</li><li>HTTP is vulnerable to man-in-the-middle</li><li>Browsers warn on insecure pages</li></ul>", "code": "console.log(\"HTTP: readable by attackers\");\nconsole.log(\"HTTPS: encrypted end-to-end\");", "lang": "js"}, {"id": 153, "cat": "Security", "icon": "🔒", "catId": 7, "title": "SSL/TLS", "lesson": "<p>TLS (successor to SSL) provides encrypted, authenticated connections.</p><ul><li>TLS 1.3 is the current standard</li><li>Handshake exchanges keys</li><li>Combines asymmetric and symmetric encryption</li><li>Certificates prove identity</li></ul>", "code": "console.log(\"1. Handshake: exchange keys\");\nconsole.log(\"2. Symmetric encryption for data\");", "lang": "js"}, {"id": 154, "cat": "Security", "icon": "🔒", "catId": 7, "title": "XSS (Cross-Site Scripting)", "lesson": "<p>XSS injects malicious scripts into pages viewed by other users.</p><ul><li>Types: stored, reflected, DOM-based</li><li>Sanitize and escape user input</li><li>Use a Content Security Policy</li><li>Avoid <code>innerHTML</code> with untrusted data</li></ul>", "code": "function escape(s){ return s.replace(/</g,\"&lt;\").replace(/>/g,\"&gt;\"); }\nconsole.log(escape(\"<script>alert(1)<\\/script>\"));", "lang": "js"}, {"id": 155, "cat": "Security", "icon": "🔒", "catId": 7, "title": "CSRF", "lesson": "<p>CSRF tricks an authenticated user into making unwanted requests.</p><ul><li>Exploits the user's active session</li><li>Mitigation: CSRF tokens</li><li><code>SameSite</code> cookie attribute</li><li>Verify the request origin</li></ul>", "code": "const token = \"csrf-\" + Math.random().toString(36).slice(2);\nconsole.log(\"CSRF token:\", token);\nconsole.log(\"SameSite=Strict cookies help too\");", "lang": "js"}, {"id": 156, "cat": "Security", "icon": "🔒", "catId": 7, "title": "SQL Injection", "lesson": "<p>SQL injection inserts malicious SQL through unsanitized input.</p><ul><li>Classic payload: <code>' OR '1'='1</code></li><li>Defense: parameterized queries</li><li>Use prepared statements or an ORM</li><li>Never concatenate user input into SQL</li></ul>", "code": "const unsafe = \"SELECT * FROM users WHERE name = '\" + \"x' OR '1'='1\" + \"'\";\nconsole.log(\"Vulnerable:\", unsafe);\nconsole.log(\"Safe: WHERE name = ? with params\");", "lang": "js"}, {"id": 157, "cat": "Security", "icon": "🔒", "catId": 7, "title": "API Security", "lesson": "<p>APIs need multiple layers of protection.</p><ul><li>HTTPS everywhere</li><li>Authentication with JWT/OAuth</li><li>Rate limiting and input validation</li><li>CORS and security headers (helmet)</li></ul>", "code": "const checklist = [\"HTTPS\",\"JWT\",\"rate limit\",\"validation\",\"CORS\"];\nchecklist.forEach(c => console.log(\"[x]\", c));", "lang": "js"}, {"id": 158, "cat": "Security", "icon": "🔒", "catId": 7, "title": "Hashing", "lesson": "<p>Hashing is a one-way transformation used to store passwords safely.</p><ul><li>Cannot be reversed</li><li>Algorithms: SHA-256, bcrypt</li><li>Add a salt to prevent rainbow tables</li><li>Compare hashes, never store plaintext</li></ul>", "code": "function simpleHash(s){ let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return h; }\nconsole.log(\"hash:\", simpleHash(\"password\"));", "lang": "js"}, {"id": 159, "cat": "Security", "icon": "🔒", "catId": 7, "title": "Encryption vs Hashing", "lesson": "<p>Both protect data but serve different goals.</p><ul><li><strong>Encryption</strong> — reversible with a key (AES)</li><li><strong>Hashing</strong> — one-way, irreversible (SHA)</li><li>Encrypt data you need to read back</li><li>Hash passwords you only need to verify</li></ul>", "code": "console.log(\"Encryption: encrypt -> decrypt (reversible)\");\nconsole.log(\"Hashing: one-way, verify only\");", "lang": "js"}, {"id": 160, "cat": "Security", "icon": "🔒", "catId": 7, "title": "bcrypt", "lesson": "<p>bcrypt is an adaptive password-hashing function.</p><ul><li>Includes a salt automatically</li><li>Cost factor (salt rounds) slows attackers</li><li><code>bcrypt.hash(pw, rounds)</code></li><li><code>bcrypt.compare(pw, hash)</code> to verify</li></ul>", "code": "// bcrypt.hash(\"pw\", 10)\nconsole.log(\"$2b$10$saltAndHashHere...\");\nconsole.log(\"bcrypt.compare verifies a password\");", "lang": "js"}, {"id": 161, "cat": "Security", "icon": "🔒", "catId": 7, "title": "OAuth 2.0", "lesson": "<p>OAuth 2.0 is an authorization framework for delegated access.</p><ul><li>Issues access tokens to third parties</li><li>Multiple grant flows (auth code, client credentials)</li><li>Powers \"Login with Google/GitHub\"</li><li>Separates authorization from credentials</li></ul>", "code": "const flow = [\"redirect to provider\",\"user consents\",\"get auth code\",\"exchange for token\"];\nflow.forEach((s,i) => console.log((i+1)+\".\", s));", "lang": "js"}, {"id": 162, "cat": "Security", "icon": "🔒", "catId": 7, "title": "JWT Security", "lesson": "<p>Securing JWTs requires careful handling.</p><ul><li>Short expiry (e.g. 15 minutes)</li><li>Send only over HTTPS</li><li>Use refresh tokens for renewal</li><li>Prefer strong algorithms (RS256)</li></ul>", "code": "const jwt = { exp: \"15m\", alg: \"RS256\", https: true };\nconsole.log(\"Secure JWT config:\", JSON.stringify(jwt));", "lang": "js"}, {"id": 163, "cat": "Security", "icon": "🔒", "catId": 7, "title": "Content Security Policy", "lesson": "<p>CSP is an HTTP header that restricts which resources can load.</p><ul><li>Whitelists script/style/image sources</li><li>Mitigates XSS attacks</li><li>Set via the <code>Content-Security-Policy</code> header</li><li>Can report violations</li></ul>", "code": "const csp = \"default-src 'self'; script-src 'self'\";\nconsole.log(\"CSP:\", csp);", "lang": "js"}, {"id": 164, "cat": "Security", "icon": "🔒", "catId": 7, "title": "Brute Force Protection", "lesson": "<p>Brute force attacks try many password combinations.</p><ul><li>Rate limit login attempts</li><li>Account lockout after failures</li><li>Add CAPTCHA</li><li>Enforce strong passwords and 2FA</li></ul>", "code": "let attempts = 6;\nconsole.log(attempts > 5 ? \"Account locked\" : \"Try again\");", "lang": "js"}, {"id": 165, "cat": "Security", "icon": "🔒", "catId": 7, "title": "Two-Factor Authentication", "lesson": "<p>2FA adds a second verification step beyond a password.</p><ul><li>TOTP apps (Google Authenticator)</li><li>SMS or email codes</li><li>Hardware keys (WebAuthn/FIDO2)</li><li>Backup codes for recovery</li></ul>", "code": "const code = Math.floor(100000 + Math.random()*900000);\nconsole.log(\"Your 2FA code:\", code);", "lang": "js"}, {"id": 166, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "What is an API?", "lesson": "<p>An API (Application Programming Interface) is a contract that lets software systems communicate.</p><ul><li>Defines requests and responses</li><li>Hides internal implementation</li><li>Styles: REST, GraphQL, gRPC</li><li>Enables integration between services</li></ul>", "code": "const api = { endpoint:\"/users\", method:\"GET\", returns:\"JSON\" };\nconsole.log(JSON.stringify(api));", "lang": "js"}, {"id": 167, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "REST vs GraphQL", "lesson": "<p>Two approaches to building APIs.</p><ul><li><strong>REST</strong> — multiple endpoints per resource</li><li><strong>GraphQL</strong> — single endpoint, client picks fields</li><li>GraphQL avoids over/under-fetching</li><li>REST is simpler and widely cached</li></ul>", "code": "console.log(\"REST: GET /users/1 then GET /users/1/posts\");\nconsole.log(\"GraphQL: one query selects exactly needed fields\");", "lang": "js"}, {"id": 168, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "RESTful API Principles", "lesson": "<p>RESTful APIs follow a set of constraints.</p><ul><li>Stateless requests</li><li>Uniform interface</li><li>Resource-based URLs</li><li>Standard HTTP methods and JSON</li></ul>", "code": "const rest = [\"stateless\",\"uniform interface\",\"resource URLs\",\"HTTP verbs\"];\nrest.forEach(r => console.log(\"-\", r));", "lang": "js"}, {"id": 169, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "HTTP Status Codes", "lesson": "<p>Status codes communicate the result of a request.</p><ul><li><strong>1xx</strong> — informational</li><li><strong>2xx</strong> — success</li><li><strong>3xx</strong> — redirection</li><li><strong>4xx</strong> — client error</li><li><strong>5xx</strong> — server error</li></ul>", "code": "const codes = { \"2xx\":\"success\",\"3xx\":\"redirect\",\"4xx\":\"client error\",\"5xx\":\"server error\" };\nObject.entries(codes).forEach(([k,v]) => console.log(k, v));", "lang": "js"}, {"id": 170, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Common Status Codes", "lesson": "<p>Key codes every developer should know.</p><ul><li><strong>200</strong> OK, <strong>201</strong> Created</li><li><strong>400</strong> Bad Request, <strong>401</strong> Unauthorized</li><li><strong>403</strong> Forbidden, <strong>404</strong> Not Found</li><li><strong>500</strong> Internal Server Error</li></ul>", "code": "const codes = {200:\"OK\",201:\"Created\",400:\"Bad Request\",401:\"Unauthorized\",403:\"Forbidden\",404:\"Not Found\",500:\"Server Error\"};\nObject.entries(codes).forEach(([k,v]) => console.log(k, v));", "lang": "js"}, {"id": 171, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "API Testing", "lesson": "<p>API testing verifies endpoints behave correctly.</p><ul><li>Manual: Postman, Insomnia</li><li>Automated: Jest + Supertest</li><li>Check status, body, and headers</li><li>Use mock servers and contract tests</li></ul>", "code": "function testStatus(actual, expected){ return actual === expected ? \"PASS\" : \"FAIL\"; }\nconsole.log(\"GET /users:\", testStatus(200, 200));", "lang": "js"}, {"id": 172, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Postman", "lesson": "<p>Postman is a popular API client for building and testing requests.</p><ul><li>Organize requests into collections</li><li>Environments with variables</li><li>Write tests with <code>pm.test()</code></li><li>Automate with the collection runner</li></ul>", "code": "// pm.test(\"status 200\", () => pm.response.to.have.status(200))\nconsole.log(\"Postman: collections, envs, tests\");", "lang": "js"}, {"id": 173, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "WebSocket", "lesson": "<p>WebSockets provide a persistent, full-duplex connection for real-time data.</p><ul><li>Protocol: <code>ws://</code> / <code>wss://</code></li><li>Both client and server can push</li><li>Libraries like socket.io</li><li>Great for chat and live updates</li></ul>", "code": "console.log(\"Client <-> Server: persistent connection\");\nconsole.log(\"Server can push without a request\");", "lang": "js"}, {"id": 174, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Polling vs WebSocket", "lesson": "<p>Two ways to get updates from a server.</p><ul><li><strong>Polling</strong> — repeated requests, wasteful</li><li><strong>WebSocket</strong> — server pushes, efficient</li><li>Polling has latency between intervals</li><li>WebSockets keep a live channel open</li></ul>", "code": "console.log(\"Polling: ask every 5s (may be empty)\");\nconsole.log(\"WebSocket: instant push when data changes\");", "lang": "js"}, {"id": 175, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Microservices", "lesson": "<p>Microservices split an app into small, independent services.</p><ul><li>Each service owns its data</li><li>Communicate via REST or events</li><li>Deployed independently (often Docker)</li><li>Scales individual parts</li></ul>", "code": "const services = [\"auth\",\"orders\",\"payments\",\"notifications\"];\nservices.forEach(s => console.log(s + \"-service\"));", "lang": "js"}, {"id": 176, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Monolithic Architecture", "lesson": "<p>A monolith is a single, unified application deployed as one unit.</p><ul><li>Simpler to start and deploy</li><li>All code in one codebase</li><li>Harder to scale individual parts</li><li>Good for small teams and MVPs</li></ul>", "code": "console.log(\"Monolith: one deployable app\");\nconsole.log(\"Pros: simple. Cons: scaling, coupling\");", "lang": "js"}, {"id": 177, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Caching", "lesson": "<p>Caching stores expensive results for faster repeat access.</p><ul><li>Layers: in-memory, Redis, CDN</li><li>TTL controls expiry</li><li>Cache invalidation is hard</li><li>Reduces load and latency</li></ul>", "code": "const cache = {};\nfunction get(key, compute){ return cache[key] ?? (cache[key] = compute()); }\nconsole.log(get(\"x\", () => { console.log(\"computing\"); return 42; }));\nconsole.log(get(\"x\", () => 99)); // cached", "lang": "js"}, {"id": 178, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Redis", "lesson": "<p>Redis is an in-memory key-value data store.</p><ul><li>Extremely fast (in-memory)</li><li>Used for caching, sessions, queues</li><li>Supports pub/sub</li><li>Optional persistence to disk</li></ul>", "code": "// redis.set(\"user:1\", JSON.stringify(user))\nconst store = {};\nstore[\"user:1\"] = JSON.stringify({name:\"Jane\"});\nconsole.log(store[\"user:1\"]);", "lang": "js"}, {"id": 179, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "CDN", "lesson": "<p>A CDN serves static assets from servers near the user.</p><ul><li>Edge servers distributed globally</li><li>Reduces latency</li><li>Offloads traffic from the origin</li><li>Providers: Cloudflare, AWS CloudFront</li></ul>", "code": "console.log(\"User -> nearest edge server -> cached asset\");\nconsole.log(\"Faster delivery, less origin load\");", "lang": "js"}, {"id": 180, "cat": "APIs & Backend", "icon": "🚀", "catId": 8, "title": "Load Balancing", "lesson": "<p>Load balancing distributes traffic across multiple servers.</p><ul><li>Algorithms: round-robin, least-connections</li><li>Improves availability and scale</li><li>Tools: Nginx, HAProxy, cloud LBs</li><li>Health checks remove unhealthy servers</li></ul>", "code": "const servers = [\"s1\",\"s2\",\"s3\"];\nlet i = 0;\nfunction next(){ return servers[i++ % servers.length]; }\nconsole.log(next(), next(), next(), next());", "lang": "js"}, {"id": 181, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Git", "lesson": "<p>Git is a distributed version control system tracking code changes.</p><ul><li>Commits are snapshots of your project</li><li>Branches enable parallel work</li><li>Each commit has a SHA hash</li><li>History lives in the <code>.git</code> directory</li></ul>", "code": "console.log(\"git add .\");\nconsole.log(\"git commit -m \\\"message\\\"\");\nconsole.log(\"git push\");", "lang": "js"}, {"id": 182, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Git vs GitHub", "lesson": "<p>Often confused, but distinct.</p><ul><li><strong>Git</strong> — the local version control tool</li><li><strong>GitHub</strong> — cloud hosting for Git repos</li><li>GitHub adds PRs, Actions, collaboration</li><li>Alternatives: GitLab, Bitbucket</li></ul>", "code": "console.log(\"Git: runs on your machine\");\nconsole.log(\"GitHub: hosts repos, PRs, CI/CD\");", "lang": "js"}, {"id": 183, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Version Control", "lesson": "<p>Version control tracks every change to your code over time.</p><ul><li>Revert to any previous state</li><li>Collaborate without overwriting work</li><li>Branching strategies organize work</li><li>Full history and accountability</li></ul>", "code": "const history = [\"init\",\"add feature\",\"fix bug\"];\nhistory.forEach((c,i) => console.log(\"commit \"+(i+1)+\":\", c));", "lang": "js"}, {"id": 184, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Git Branching", "lesson": "<p>Branches let you develop features in isolation.</p><ul><li><code>git branch</code> / <code>git checkout</code></li><li><code>git merge</code> / <code>git rebase</code></li><li>Feature branches keep main stable</li><li>Strategies: GitFlow, trunk-based</li></ul>", "code": "console.log(\"git checkout -b feature/login\");\nconsole.log(\"git merge feature/login\");", "lang": "js"}, {"id": 185, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Merge Conflicts", "lesson": "<p>A conflict happens when two branches change the same lines.</p><ul><li>Git marks conflicts with <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code></li><li>You manually pick the correct code</li><li>Remove markers and commit</li><li>Communication prevents conflicts</li></ul>", "code": "const conflict = \"<<<<<<< HEAD\\nmy change\\n=======\\ntheir change\\n>>>>>>>\";\nconsole.log(conflict);", "lang": "js"}, {"id": 186, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "CI/CD", "lesson": "<p>CI/CD automates building, testing, and deploying code.</p><ul><li><strong>CI</strong> — integrate and test on each push</li><li><strong>CD</strong> — automatically deploy</li><li>Tools: GitHub Actions, Jenkins, GitLab CI</li><li>Fast feedback and reliable releases</li></ul>", "code": "const pipeline = [\"build\",\"test\",\"deploy\"];\npipeline.forEach((s,i) => console.log(\"Stage \"+(i+1)+\":\", s));", "lang": "js"}, {"id": 187, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Docker", "lesson": "<p>Docker packages apps with their dependencies into portable containers.</p><ul><li>A <code>Dockerfile</code> defines the image</li><li>Containers are lightweight and isolated</li><li><code>docker-compose</code> runs multi-container apps</li><li>\"Works on my machine\" solved</li></ul>", "code": "console.log(\"FROM node:18\");\nconsole.log(\"COPY . /app\");\nconsole.log(\"CMD [\\\"node\\\", \\\"index.js\\\"]\");", "lang": "js"}, {"id": 188, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Kubernetes", "lesson": "<p>Kubernetes orchestrates containers at scale.</p><ul><li>Manages pods, services, deployments</li><li>Auto-scaling and self-healing</li><li>Load balancing via services</li><li>Ingress routes external traffic</li></ul>", "code": "const k8s = [\"pods\",\"services\",\"deployments\",\"ingress\"];\nk8s.forEach(o => console.log(o));", "lang": "js"}, {"id": 189, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "Cloud Hosting", "lesson": "<p>Cloud hosting runs apps on remote managed infrastructure.</p><ul><li><strong>IaaS</strong> — VMs (raw infra)</li><li><strong>PaaS</strong> — managed platform</li><li><strong>SaaS</strong> — ready software</li><li>Serverless: Vercel, Lambda, Cloud Run</li></ul>", "code": "console.log(\"IaaS: VMs\");\nconsole.log(\"PaaS: managed runtime\");\nconsole.log(\"Serverless: functions on demand\");", "lang": "js"}, {"id": 190, "cat": "DevOps", "icon": "☁️", "catId": 9, "title": "AWS vs Azure vs GCP", "lesson": "<p>The three major cloud providers with comparable services.</p><ul><li><strong>AWS</strong> — EC2, S3, Lambda</li><li><strong>Azure</strong> — VM, Blob, Functions</li><li><strong>GCP</strong> — GCE, GCS, Cloud Run</li><li>Compute, storage, and serverless in each</li></ul>", "code": "const map = { compute:\"EC2 / VM / GCE\", storage:\"S3 / Blob / GCS\" };\nconsole.log(JSON.stringify(map, null, 2));", "lang": "js"}, {"id": 191, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Progressive Web Apps", "lesson": "<p>PWAs are web apps that behave like native apps.</p><ul><li>Installable to the home screen</li><li>Require HTTPS + manifest + service worker</li><li>Work offline via caching</li><li>Support push notifications</li></ul>", "code": "const manifest = { name:\"My PWA\", display:\"standalone\", start_url:\"/\" };\nconsole.log(JSON.stringify(manifest));", "lang": "js"}, {"id": 192, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Service Workers", "lesson": "<p>A service worker is a background script that intercepts network requests.</p><ul><li>Enables offline support via caching</li><li>Intercepts <code>fetch</code> events</li><li>Supports background sync and push</li><li>Runs separately from the page</li></ul>", "code": "// self.addEventListener(\"fetch\", e => e.respondWith(cache))\nconsole.log(\"SW intercepts fetch and serves cache\");", "lang": "js"}, {"id": 193, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Lazy Loading", "lesson": "<p>Lazy loading defers loading resources until they are needed.</p><ul><li>Images: <code>loading=\"lazy\"</code></li><li>Components: <code>React.lazy</code></li><li>Uses the Intersection Observer API</li><li>Speeds up initial page load</li></ul>", "code": "// <img loading=\"lazy\">\nconsole.log(\"Load images only when near viewport\");", "lang": "js"}, {"id": 194, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Code Splitting", "lesson": "<p>Code splitting breaks a bundle into smaller chunks loaded on demand.</p><ul><li>Use dynamic <code>import()</code></li><li>Webpack creates separate chunks</li><li>Often route-based</li><li>Reduces initial bundle size</li></ul>", "code": "// import(\"./module\").then(m => m.run())\nfunction load(){ return Promise.resolve(\"chunk loaded\"); }\nload().then(r => console.log(r));", "lang": "js"}, {"id": 195, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Tree Shaking", "lesson": "<p>Tree shaking removes unused code from the final bundle.</p><ul><li>Requires ES modules (static imports)</li><li>Eliminates dead code</li><li>Enabled in production builds</li><li>Smaller, faster bundles</li></ul>", "code": "// import { used } from \"lib\"  // unused exports dropped\nconsole.log(\"Only imported functions ship to the bundle\");", "lang": "js"}, {"id": 196, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "SSR in Next.js", "lesson": "<p>Next.js offers multiple rendering strategies.</p><ul><li><code>getServerSideProps</code> — per request (SSR)</li><li><code>getStaticProps</code> — at build time (SSG)</li><li>ISR — incremental static regeneration</li><li>Choose based on data freshness needs</li></ul>", "code": "console.log(\"getServerSideProps: runs every request\");\nconsole.log(\"getStaticProps: runs at build time\");", "lang": "js"}, {"id": 197, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Hydration", "lesson": "<p>Hydration attaches React's interactivity to server-rendered HTML.</p><ul><li>Server sends static HTML</li><li>React attaches event listeners</li><li>Page becomes interactive</li><li>HTML mismatches cause hydration errors</li></ul>", "code": "console.log(\"1. Server HTML displayed\");\nconsole.log(\"2. React hydrates -> interactive\");", "lang": "js"}, {"id": 198, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Webpack", "lesson": "<p>Webpack is a module bundler for JavaScript applications.</p><ul><li><strong>Entry/Output</strong> — start and result</li><li><strong>Loaders</strong> — transform files</li><li><strong>Plugins</strong> — extend the build</li><li>HMR for fast development</li></ul>", "code": "const config = { entry:\"./src/index.js\", output:\"./dist/bundle.js\" };\nconsole.log(JSON.stringify(config));", "lang": "js"}, {"id": 199, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "Babel", "lesson": "<p>Babel transpiles modern JavaScript into backward-compatible code.</p><ul><li>Converts ES6+ to ES5</li><li><code>@babel/preset-env</code> targets browsers</li><li>Transforms JSX</li><li>Configured via <code>.babelrc</code></li></ul>", "code": "// const f = () => 1  -->  var f = function(){ return 1; }\nconsole.log(\"Babel: ES6+ -> ES5 for old browsers\");", "lang": "js"}, {"id": 200, "cat": "Advanced", "icon": "🧩", "catId": 10, "title": "TypeScript", "lesson": "<p>TypeScript is a typed superset of JavaScript that compiles to JS.</p><ul><li>Adds static types and interfaces</li><li>Catches errors at compile time</li><li>Generics and type inference</li><li>Compiled with <code>tsc</code></li></ul>", "code": "// TypeScript: function add(a: number, b: number): number\nfunction add(a, b){ return a + b; }\nconsole.log(add(2, 3));\nconsole.log(\"Types catch bugs before runtime\");", "lang": "js"}];
let currentId = 1;
let done = JSON.parse(localStorage.getItem('wdcourse_done') || '[]');

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function buildSidebar(){
  const cats = {};
  Q.forEach(q=>{(cats[q.catId]=cats[q.catId]||{icon:q.icon,cat:q.cat,items:[]}).items.push(q);});
  let html='';
  Object.keys(cats).sort((a,b)=>a-b).forEach(cid=>{
    const c=cats[cid];
    html+=`<div class="cat-header" onclick="toggleCat(${cid})"><span>${c.icon} ${c.cat} (${c.items.length})</span><span>&#9662;</span></div>`;
    html+=`<div class="cat-questions" id="cat-${cid}">`;
    c.items.forEach(q=>{
      html+=`<a class="q-link" id="link-${q.id}" onclick="navigate(${q.id})">${q.id}. ${q.title}</a>`;
    });
    html+='</div>';
  });
  document.getElementById('sidebar-list').innerHTML=html;
}
function toggleCat(cid){document.getElementById('cat-'+cid).classList.toggle('collapsed');}

function updateSidebar(id){
  document.querySelectorAll('.q-link').forEach(el=>{
    const qid=parseInt(el.id.replace('link-',''));
    el.classList.toggle('active',qid===id);
    el.classList.toggle('done',done.includes(qid));
  });
}

function renderLesson(q){
  const editorBlock = q.lang!=='none' ? `
    <div class="example-label">&#128203; Example</div>
    <pre class="code-box">${escHtml(q.code)}</pre>
    <button class="try-btn" onclick="openEditor(${q.id})">Try it Yourself &raquo;</button>
    <div class="editor-wrap" id="editor-${q.id}">
      <div class="editor-toolbar"><span>${q.lang.toUpperCase()} Editor</span></div>
      <div class="editor-body">
        <textarea id="ta-${q.id}" spellcheck="false">${escHtml(q.code)}</textarea>
        <iframe id="ifr-${q.id}" sandbox="allow-scripts allow-modals"></iframe>
      </div>
      <div class="editor-actions">
        <button class="btn-run" onclick="runCode(${q.id})">&#9654; Run</button>
        <button class="btn-reset" onclick="resetCode(${q.id})">&#8635; Reset</button>
        <button class="btn-close" onclick="closeEditor(${q.id})">&#10005; Close Editor</button>
      </div>
    </div>` : '';
  document.getElementById('main').innerHTML=`
    <div class="breadcrumb">${q.icon} ${q.cat} &rsaquo; Question ${q.id}</div>
    <div class="lesson-nav">
      ${q.id>1?`<button onclick="navigate(${q.id-1})">&larr; Prev</button>`:'<span></span>'}
      <span class="counter">${q.id} / 200</span>
      ${q.id<200?`<button onclick="navigate(${q.id+1})">Next &rarr;</button>`:'<span></span>'}
    </div>
    <h1>${q.title}</h1>
    <div class="lesson-content">${q.lesson}</div>
    ${editorBlock}
    <div class="lesson-nav bottom">
      ${q.id>1?`<button onclick="navigate(${q.id-1})">&larr; Prev</button>`:'<span></span>'}
      <button class="mark-done" onclick="markDone(${q.id})">${done.includes(q.id)?'✓ Completed':'Mark as Complete'}</button>
      ${q.id<200?`<button onclick="navigate(${q.id+1})">Next &rarr;</button>`:'<span></span>'}
    </div>`;
  const ta=document.getElementById('ta-'+q.id);
  if(ta){
    ta.addEventListener('keydown',e=>{
      if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;ta.value=ta.value.substring(0,s)+'  '+ta.value.substring(ta.selectionEnd);ta.selectionStart=ta.selectionEnd=s+2;}
    });
    ta.addEventListener('input',()=>debounceRun(q.id));
  }
}

function navigate(id){
  currentId=id;
  const q=Q.find(x=>x.id===id);
  renderLesson(q);
  updateSidebar(id);
  updateProgress();
  history.replaceState(null,'','#q'+id);
  window.scrollTo(0,0);
  if(window.innerWidth<=900) document.getElementById('sidebar').classList.remove('show');
}

function openEditor(id){const w=document.getElementById('editor-'+id);w.classList.add('open');runCode(id);w.scrollIntoView({behavior:'smooth',block:'nearest'});}
function closeEditor(id){document.getElementById('editor-'+id).classList.remove('open');}
let debTimer;function debounceRun(id){clearTimeout(debTimer);debTimer=setTimeout(()=>runCode(id),400);}

function runCode(id){
  const q=Q.find(x=>x.id===id);
  const code=document.getElementById('ta-'+id).value;
  const ifr=document.getElementById('ifr-'+id);
  if(q.lang==='html'){ifr.srcdoc=code;}
  else if(q.lang==='css'){ifr.srcdoc='<!DOCTYPE html><html><head><style>'+code+'</style></head><body><h1>Heading</h1><p>Paragraph text here.</p><div class="box">A div box</div><button>Button</button><ul><li>One</li><li>Two</li><li>Three</li><li>Four</li></ul><a href="#">A link</a></body></html>';}
  else if(q.lang==='js'){
    ifr.srcdoc='<!DOCTYPE html><html><body><div id="out" style="font-family:monospace;padding:14px;font-size:13px;line-height:1.5;"></div><scr'+'ipt>'+
    'var logs=[];console.log=function(){logs.push([].map.call(arguments,function(x){return (typeof x==="object"&&x!==null)?JSON.stringify(x,null,2):String(x);}).join(" "));document.getElementById("out").innerHTML=logs.map(function(l){return "<div style=\\"border-bottom:1px solid #eee;padding:4px 0;white-space:pre-wrap\\">"+l.replace(/</g,"&lt;")+"</div>";}).join("");};'+
    'try{'+code+'}catch(e){document.getElementById("out").innerHTML+="<div style=\\"color:#c00\\">Error: "+e.message+"</div>";}'+
    '</scr'+'ipt></body></html>';
  }
}
function resetCode(id){const q=Q.find(x=>x.id===id);document.getElementById('ta-'+id).value=q.code;runCode(id);}

function markDone(id){
  if(!done.includes(id)){done.push(id);}
  else{done=done.filter(x=>x!==id);}
  localStorage.setItem('wdcourse_done',JSON.stringify(done));
  updateProgress();updateSidebar(currentId);
  const b=document.querySelector('.mark-done');if(b)b.textContent=done.includes(id)?'✓ Completed':'Mark as Complete';
}
function updateProgress(){
  document.getElementById('progress-bar').style.width=(done.length/200*100)+'%';
  document.getElementById('prog-count').textContent=done.length+'/200 ✓';
}

function filterQuestions(v){
  v=v.toLowerCase();
  document.querySelectorAll('.q-link').forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(v)?'block':'none';});
}
document.getElementById('sidebar-search').addEventListener('input',function(){filterQuestions(this.value);});
document.getElementById('nav-search').addEventListener('input',function(){
  filterQuestions(this.value);
  document.getElementById('sidebar-search').value=this.value;
  if(window.innerWidth<=900) document.getElementById('sidebar').classList.add('show');
});
document.getElementById('dark-toggle').addEventListener('click',function(){
  document.body.classList.toggle('dark');
  const d=document.body.classList.contains('dark');
  this.innerHTML=d?'☾ Dark':'☀ Light';
  localStorage.setItem('wdcourse_dark',d?'1':'0');
});
document.getElementById('menu-toggle').addEventListener('click',function(){document.getElementById('sidebar').classList.toggle('show');});
function toggleMobileMenu(){document.getElementById('mob-menu').classList.toggle('open');document.body.style.overflow=document.getElementById('mob-menu').classList.contains('open')?'hidden':'';}
function closeMobileMenu(){document.getElementById('mob-menu').classList.remove('open');document.body.style.overflow='';}

if(localStorage.getItem('wdcourse_dark')==='1'){document.body.classList.add('dark');document.getElementById('dark-toggle').innerHTML='☾ Dark';}
buildSidebar();
const h=location.hash.replace('#q','');
if(h&&!isNaN(h)&&Q.find(x=>x.id===parseInt(h)))navigate(parseInt(h));else navigate(1);
</script>
</body>
</html>
